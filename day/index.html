/*
 * Stable handles for the standing plan, so a photo in the chat can say which
 * row to change. Slot and time are not unique on their own (two coffees, two
 * protein bars), so repeats get a trailing count.
 */
function planIds(plan) {
  const seen = {};
  return (plan || S.plan).map((p) => {
    const base = `${String(p.slot || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '')}-${String(p.time || '').replace(':', '')}`;
    const n = (seen[base] = (seen[base] || 0) + 1);
    return `${base}-${n}`;
  });
}
function findPlanByPid(pid) {
  const i = planIds().indexOf(String(pid || ''));
  return i < 0 ? null : { i, item: S.plan[i] };
}
function planForBrain() {
  const ids = planIds();
  return S.plan.map((p, i) => ({
    pid: ids[i], slot: p.slot, time: p.time, name: p.name, parts: p.parts,
    cal: p.cal, protein: p.protein, carbs: p.carbs, fat: p.fat,
    sodium_mg: (p.micros || {}).sodium_mg, potassium_mg: (p.micros || {}).potassium_mg
  }));
}
function stateForBrain() {
  const t = ymd();
  const days = {};
  [t, addDays(t, 1), addDays(t, 2)].forEach((d) => {
    const day = S.days[d] || ensureDay(d);
    days[d] = {
      meals: day.meals.map((m) => ({ id: m.id, slot: m.slot, name: m.name, time: m.time, done: m.done })),
      tasks: day.tasks.map((x) => ({ id: x.id, name: x.name, time: x.time, done: x.done, moved: x.moved, skipped: !!x.skipped })),
      water: { count: day.water, goal: S.settings.waterGoal },
      extras: day.extras.map((e) => e.name)
    };
  });
  const ws = [...S.weights].sort((a, b) => a.date.localeCompare(b.date));
  const m = macrosToday(today());
  const fit = S.fit || {};
  const lastOf = (arr) => (arr && arr.length ? [...arr].sort((a, b) => a.date.localeCompare(b.date)).pop() : null);
  return {
    today: t, days, plan: planForBrain(),
    macros_today: { cal: m.cal, protein: m.protein, carbs: m.carbs, fat: m.fat, sodium_mg: Math.round(m.micros.sodium_mg || 0), potassium_mg: Math.round(m.micros.potassium_mg || 0), fiber_g: Math.round(m.micros.fiber_g || 0) },
    goals: { cal: S.settings.calGoal, protein: S.settings.proteinGoal, carbs: S.settings.carbGoal, fat: S.settings.fatGoal, steps: S.settings.stepGoal, water_bottles: S.settings.waterGoal, weight: S.settings.weightGoal, weight_by: S.settings.weightGoalDate },
    weights_recent: ws.slice(-6), streak: streak(), score: dayScore(today()),
    steps_today: S.steps.date === t ? S.steps.today : null,
    resting_hr: lastOf(fit.rhr), energy_burned_avg: lastOf(fit.energy), steps_weekly_avg: lastOf(fit.steps),
    body_fat_photo: lastOf(S.photos) ? lastOf(S.photos).est : null,
    library: S.library.map((f) => f.name),
    reminders_open: (S.reminders || []).filter((r) => !r.done).map((r) => ({ id: r.id, text: r.text, since: r.date })),
    note_buckets: [...new Set((S.notes || []).map((n) => n.bucket))],
    notes_recent: (S.notes || []).slice(-6).map((n) => `${n.bucket}: ${n.text}`)
  };
}
function profileForBrain() { const p = S.settings.profile || {}; return { height_in: S.settings.heightIn, weight_lb: (S.weights.slice().sort((a, b) => a.date.localeCompare(b.date)).pop() || {}).lb, age: p.age, sex: p.sex, ethnicity: p.ethnicity, lives_in: S.settings.place.name }; }
function chatHistoryForBrain() { return (S.chat || []).slice(-12).map((m) => ({ role: m.role, text: m.text.slice(0, 600) })); }
function applyOps(ops, say, said, imgs) {
  const answers = ops.filter((o) => o.op === 'answer').map((o) => String(o.text || ''));
  const doing = ops.filter((o) => o.op !== 'answer');
  const lines = [];
  if (doing.length) {
    snapshot(say || 'Voice change');
    for (const op of doing) {
      try {
        const r = applyOp(op);
        if (r) lines.push(r);
      } catch (err) { lines.push(`Could not do one: ${err.message}`); }
    }
  }
  if (said || (imgs && imgs.length)) addChat('user', said || '', null, imgs);
  addChat('assistant', [say, ...answers].filter(Boolean).join('\n\n') || (lines.length ? 'Done.' : 'Heard you, nothing to change.'), lines);
  save();
  if (answers.length) toast({ t: say || 'Answered', s: answers[0].slice(0, 140) + (answers[0].length > 140 ? '... (full answer in Chat)' : ''), cls: 'blue', ms: 9000 });
  else if (doing.length) toast({ t: say || 'Done.', s: lines.join(' · '), cls: 'blue', undo: true, ms: 6500 });
  else toast({ t: say || 'Heard you, nothing to change.', ms: 3000 });
  if (doing.length) buzz([15, 30, 15]);
  if (dayComplete(today())) celebrate();
}
function applyOp(op) {
  const t = ymd();
  const target = op.target === 'meal' ? 'meal' : 'task';
  switch (op.op) {
    case 'complete': case 'uncomplete': {
      const f = findItem(target, op.id); if (!f) throw new Error('no such item');
      f.it.done = op.op === 'complete'; f.it.doneAt = f.it.done ? nowHM() : null; f.it.skipped = null;
      return `${f.it.done ? 'Done' : 'Unchecked'}: ${f.it.name}`;
    }
    case 'skip': {
      const f = findItem(target, op.id); if (!f) throw new Error('no such item');
      f.it.skipped = { reason: op.reason || '' }; f.it.done = false;
      return `Skipped ${f.it.name}`;
    }
    case 'move': {
      const f = findItem(target, op.id); if (!f) throw new Error('no such item');
      const to = /^\d{4}-\d{2}-\d{2}$/.test(op.toDate || '') ? op.toDate : addDays(t, 1);
      const dest = ensureDay(to);
      if (target === 'task') {
        f.it.moved = to;
        dest.tasks.push({ id: uid(`${to}-t`), name: f.it.name, time: op.time || f.it.time || null, done: false, doneAt: null, moved: null, skipped: null, movedFrom: f.date });
      } else {
        f.list.splice(f.list.indexOf(f.it), 1);
        dest.meals.push({ ...f.it, id: uid(`${to}-m`), done: false, doneAt: null, time: op.time || f.it.time });
      }
      return `${f.it.name} moved to ${niceDate(to)}`;
    }
    case 'reschedule': {
      const f = findItem(target, op.id); if (!f) throw new Error('no such item');
      const from = f.it.time; f.it.time = op.time;
      return `${f.it.name} ${from ? t12s(from) + ' to ' : 'at '}${t12s(op.time)}`;
    }
    case 'swap_meal': {
      const f = findItem('meal', op.id); if (!f) throw new Error('no such meal');
      f.it.swapped = true; f.it.name = op.name; f.it.done = true; f.it.doneAt = nowHM();
      ['cal', 'protein', 'carbs', 'fat'].forEach((k) => { if (op[k] != null) f.it[k] = Math.round(op[k]); });
      return `${f.it.slot}: ${op.name}`;
    }
    case 'log_food': {
      today().extras.push({ id: uid('x'), slot: op.slot || 'Extra', name: op.name, cal: Math.round(op.cal || 0), protein: Math.round(op.protein || 0), carbs: Math.round(op.carbs || 0), fat: Math.round(op.fat || 0), micros: op.micros || null, at: nowHM() });
      return `Logged ${op.name}`;
    }
    case 'add_task': {
      const d = /^\d{4}-\d{2}-\d{2}$/.test(op.date || '') ? op.date : t;
      ensureDay(d).tasks.push({ id: uid(`${d}-t`), name: op.name, time: op.time || null, done: false, doneAt: null, moved: null, skipped: null });
      return `Added ${op.name}${d !== t ? ' on ' + niceDate(d) : ''}`;
    }
    case 'add_meal': {
      const d = /^\d{4}-\d{2}-\d{2}$/.test(op.date || '') ? op.date : t;
      ensureDay(d).meals.push({ id: uid(`${d}-m`), slot: op.slot || 'Meal', name: op.name, time: op.time || null, cal: Math.round(op.cal || 0), protein: Math.round(op.protein || 0), carbs: Math.round(op.carbs || 0), fat: Math.round(op.fat || 0), done: false, doneAt: null, swapped: false, planned: op.name });
      return `Added ${op.slot || 'meal'}: ${op.name}`;
    }
    case 'remove': {
      const f = findItem(target, op.id); if (!f) throw new Error('no such item');
      f.list.splice(f.list.indexOf(f.it), 1);
      return `Removed ${f.it.name}`;
    }
    case 'water': { today().water = Math.max(0, Math.round(op.count)); return `Water ${today().water} of ${S.settings.waterGoal}`; }
    case 'log_weight': {
      const d = /^\d{4}-\d{2}-\d{2}$/.test(op.date || '') ? op.date : t;
      S.weights = S.weights.filter((w) => w.date !== d); S.weights.push({ date: d, lb: Number(op.lb) });
      ensureDay(d).weight = Number(op.lb);
      return `Weight ${op.lb} lb`;
    }
    case 'note': {
      S.notes = S.notes || [];
      const text = String(op.text || '').trim();
      S.notes.push({ id: uid('n'), title: (op.title || autoTitle(text)).trim().slice(0, 70), text, bucket: (op.bucket || 'Random').trim().slice(0, 20), date: t, at: nowHM() });
      if (S.notes.length > 500) S.notes = S.notes.slice(-500);
      return `Noted under ${op.bucket || 'Random'}`;
    }
    case 'add_reminder': {
      S.reminders = S.reminders || [];
      S.reminders.push({ id: uid('r'), text: op.text, date: t, at: nowHM(), done: false });
      return `Reminder: ${op.text}`;
    }
    case 'done_reminder': {
      const r = (S.reminders || []).find((x) => !x.done && (x.id === op.id || (op.text && x.text.toLowerCase().includes(String(op.text).toLowerCase()))));
      if (!r) throw new Error('no such reminder');
      r.done = true; r.doneAt = nowHM();
      return `Off the list: ${r.text}`;
    }
    case 'log_steps': { S.steps = { today: Math.max(0, Math.round(op.steps)), date: t }; return `Steps ${S.steps.today.toLocaleString()}`; }
    /*
     * A standing change to the plan, not just today: "I bought this rice
     * instead, swap it in". Only the fields he gave are touched, so a new
     * sodium figure does not wipe the rest of the label. Today's copy follows
     * along unless he has already eaten it.
     */
    case 'edit_plan': {
      const f = findPlanByPid(op.pid); if (!f) throw new Error('no such plan item');
      const p = f.item;
      const before = p.name;
      for (const k of ['name', 'parts']) if (op[k] != null) p[k] = String(op[k]);
      for (const k of ['cal', 'protein', 'carbs', 'fat']) if (op[k] != null && isFinite(op[k])) p[k] = Math.round(Number(op[k]));
      if (op.micros && typeof op.micros === 'object') {
        p.micros = { ...(p.micros || {}) };
        for (const [k, v] of Object.entries(op.micros)) if (v != null && isFinite(v)) p.micros[k] = Number(v);
      }
      S.planEdited = true;
      const m = today().meals.find((x) => x.slot === p.slot && x.time === p.time && !x.done);
      if (m) {
        m.name = p.name; m.parts = p.parts; m.cal = p.cal; m.protein = p.protein;
        m.carbs = p.carbs; m.fat = p.fat; m.micros = p.micros; m.planned = p.name;
      }
      return before === p.name ? `Plan updated: ${p.name}` : `Plan: ${before} to ${p.name}`;
    }
    case 'answer': { return null; }
    default: throw new Error(`unknown op ${op.op}`);
  }
}

/* ---------- voice ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
const voice = { rec: null, mode: 'command', text: '', on: false, busy: false, onDone: null };
const mic = $('#mic'), live = $('#live'), liveText = $('#live-text'), micLab = $('#mic-lab');

function setMic(state, label) {
  mic.classList.toggle('open', state !== 'idle');
  mic.classList.toggle('listening', state === 'listening');
  mic.classList.toggle('busy', state === 'busy');
  document.body.dataset.mic = state;
  micLab.textContent = label || (state === 'listening' ? 'Listening · tap when done' : state === 'busy' ? 'Working on it' : '');
}
function startListening(mode = 'command', onDone = null) {
  if (voice.busy) return;
  if (!SR) { openTyped(mode, onDone); return; }
  if (voice.on) { stopListening(); return; }
  voice.mode = mode; voice.text = ''; voice.onDone = onDone; voice.on = true;
  const r = new SR();
  r.lang = 'en-CA'; r.continuous = true; r.interimResults = true;
  let finals = '';
  r.onresult = (e) => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) { const res = e.results[i]; if (res.isFinal) finals += res[0].transcript + ' '; else interim += res[0].transcript; }
    voice.text = (finals + interim).trim();
    liveText.textContent = voice.text || '...';
  };
  r.onerror = (e) => { if (e.error === 'not-allowed' || e.error === 'service-not-allowed') { voice.on = false; setMic('idle'); live.classList.remove('show'); toast({ t: 'Mic is blocked', s: 'Allow the microphone for this site, or type it instead', cls: 'red' }); openTyped(mode, onDone); } };
  r.onend = () => { if (voice.on) finishListening(); };
  voice.rec = r;
  try { r.start(); } catch { voice.on = false; openTyped(mode, onDone); return; }
  liveText.textContent = '...';
  live.classList.add('show');
  setMic('listening', mode === 'wrap' ? 'Listening · wrap it up' : mode === 'food' ? 'Listening · what did you eat' : 'Listening · tap when done');
  buzz([8]);
}
function stopListening() { if (voice.rec) { try { voice.rec.stop(); } catch {} } }
async function finishListening() {
  voice.on = false;
  const text = voice.text.trim();
  live.classList.remove('show');
  if (!text) { setMic('idle'); toast({ t: 'Did not catch that', ms: 1800 }); return; }
  // Photos waiting in the chat box go with whatever he just said, so he can
  // attach one and then simply talk instead of typing.
  const shots = voice.mode === 'command' && atts.length ? atts.splice(0, atts.length) : [];
  if (shots.length) renderAtts();
  await handleSpeech(voice.mode, text, voice.onDone, shots);
}
async function handleSpeech(mode, text, onDone, shots) {
  if (onDone) { setMic('idle'); onDone(text); return; }
  shots = shots || [];
  voice.busy = true; setMic('busy', 'Working on it');
  try {
    if (mode === 'wrap') {
      const r = await brain({ mode: 'wrap', transcript: text, now: `${ymd()} ${nowHM()}`, score: dayScore(today()) });
      const d = today();
      snapshot('Wrap');
      if (d.wrap) { d.wrap.lines = [...d.wrap.lines, ...(r.wrap.lines || [])]; if (r.wrap.title) d.wrap.title = r.wrap.title; }
      else d.wrap = { title: r.wrap.title || '', lines: r.wrap.lines || [text], mood: r.wrap.mood || '', at: nowHM(), raw: text };
      save();
      toast({ t: 'Filed under today', s: r.wrap.title || '', cls: 'blue', undo: true });
    } else {
      const now = new Date();
      // A photo is its own job with its own prompt: reading a label alongside
      // every rule about walks and creamis was slow enough to time out.
      const r = await brain({ mode: shots.length ? 'photo' : 'command', transcript: text, images: shots.map((s) => s.full), now: `${ymd()} ${nowHM()}`, weekday: WDL[now.getDay()], tomorrow: addDays(ymd(), 1), state: stateForBrain(), profile: profileForBrain(), goals: S.settings.goalText, history: chatHistoryForBrain() });
      applyOps(Array.isArray(r.ops) ? r.ops : [], r.say, text, shots.map((s) => s.thumb));
    }
  } catch (err) {
    toast({ t: 'The brain did not answer', s: err.message, cls: 'red', ms: 6000 });
    if (mode !== 'wrap') { addChat('user', text, null, shots.map((s) => s.thumb)); addChat('assistant', `Could not answer: ${err.message}`); save(); }
  } finally { voice.busy = false; setMic('idle'); }
}
/*
 * Photos in the chat. He shows it a package he just bought and says what to do
 * with it. Two sizes are kept: a big one that goes to the brain and is thrown
 * away straight after, and a small square that stays in the thread so he can
 * scroll back and see what he showed it.

const atts = [];
function renderAtts() {
  const box = $('#chat-atts');

}

$('#sh-body').addEventListener('click', (e) => {
  const b = e.target.closest('[data-am]');
  if (!b) return;
  const a = b.dataset.am;
  if (a === 'mode-saved' || a === 'mode-new') { addMeal.mode = a === 'mode-saved' ? 'saved' : 'new'; if (addMeal.mode === 'new') stashTyped(); addMeal.pick = addMeal.mode === 'new' ? addMeal.pick : null; renderAddMeal(); }
  else if (a === 'pick') { const f = S.library.find((x) => x.id === b.dataset.id); addMeal.pick = f ? { ...f } : null; renderAddMeal(); }

/* Keep what he typed when the sheet redraws for a slot or a toggle. */
function stashTyped() {

}

}

/* ---------- the week: the pattern the daily review cannot see ---------- */
function weekKey(d = ymd()) { return addDays(d, -((fromYmd(d).getDay() + 6) % 7)); }
function weekForBrain() {
  const mon = weekKey();
  const fit = S.fit || {};
  const lastOf = (a) => (a && a.length ? [...a].sort((x, y) => x.date.localeCompare(y.date)).pop() : null);
  const days = [];
  for (let i = 0; i < 7; i++) {
    const d = addDays(mon, i);
    const day = S.days[d];
    if (!day || d > ymd()) continue;
    const m = macrosToday(day);
    days.push({
      date: d, weekday: WDL[fromYmd(d).getDay()], score: dayScore(day),
      eaten: { cal: m.cal, protein: m.protein, carbs: m.carbs, fat: m.fat, sodium_mg: Math.round(m.micros.sodium_mg || 0), potassium_mg: Math.round(m.micros.potassium_mg || 0) },
      meals_done: `${day.meals.filter((x) => x.done).length} of ${day.meals.length}`,
      tasks: day.tasks.map((x) => `${x.name}${x.done ? ' (done)' : x.moved ? ' (moved)' : x.skipped ? ' (skipped)' : ' (missed)'}`),
      steps: S.steps.date === d ? S.steps.today : null,
      water: day.water, wrap: day.wrap ? day.wrap.lines : null
    });
  }

const compare = { a: null, b: null };
function openCompare() {
  const ps = [...S.photos].sort((x, y) => x.date.localeCompare(y.date));
  if (ps.length < 2) { toast({ t: 'Need two sets of photos', s: 'Add another Sunday and they can go side by side', ms: 4000 }); return; }

function renderCompare() {
  const ps = [...S.photos].sort((x, y) => x.date.localeCompare(y.date));

/* ---------- one item: the breakdown, editable ---------- */
/*
 * Micros. The fourth column is what the number means: 'cap' is a ceiling to
 * stay under, everything else is a target to reach. They are grouped because
 * eighteen figures in one grid is a wall, not information.
 */
const MICRO_DEFS = [
  ['fiber_g', 'Fiber', 30, 'g'], ['sugars_g', 'Sugars', 50, 'g', 'cap'],
  ['saturated_fat_g', 'Sat fat', 20, 'g', 'cap'], ['cholesterol_mg', 'Cholesterol', 300, 'mg', 'cap'],
  ['sodium_mg', 'Sodium', 2300, 'mg', 'cap'], ['potassium_mg', 'Potassium', 3400, 'mg'],
  ['calcium_mg', 'Calcium', 1000, 'mg'], ['magnesium_mg', 'Magnesium', 400, 'mg'],
  ['iron_mg', 'Iron', 8, 'mg'], ['zinc_mg', 'Zinc', 11, 'mg'],
  ['phosphorus_mg', 'Phosphorus', 700, 'mg'], ['selenium_mcg', 'Selenium', 55, 'mcg'],
  ['vitamin_c_mg', 'Vitamin C', 90, 'mg'], ['vitamin_a_mcg', 'Vitamin A', 900, 'mcg'],
  ['vitamin_d_mcg', 'Vitamin D', 20, 'mcg'], ['folate_mcg', 'Folate', 400, 'mcg'],
  ['vitamin_b6_mg', 'Vitamin B6', 1.3, 'mg'], ['vitamin_b12_mcg', 'Vitamin B12', 2.4, 'mcg']
];
const MICRO_GROUPS = [
  ['In the food', ['fiber_g', 'sugars_g', 'saturated_fat_g', 'cholesterol_mg']],
  ['Minerals', ['sodium_mg', 'potassium_mg', 'calcium_mg', 'magnesium_mg', 'iron_mg', 'zinc_mg', 'phosphorus_mg', 'selenium_mcg']],
  ['Vitamins', ['vitamin_c_mg', 'vitamin_a_mcg', 'vitamin_d_mcg', 'folate_mcg', 'vitamin_b6_mg', 'vitamin_b12_mcg']]
];
const MICRO_BY_KEY = Object.fromEntries(MICRO_DEFS.map((d) => [d[0], d]));
const microRound = (v) => (v >= 100 ? Math.round(v) : Math.round(v * 10) / 10);
/* One cell. A cap that is blown reads red; a target met reads blue. */
function microCell(def, val, opts = {}) {
  const [k, name, goal, unit, kind] = def;
  const v = val || 0;
  const pct = goal > 0 ? v / goal : 0;
  const cap = kind === 'cap';
  const cls = cap ? (pct > 1 ? ' bad' : '') : (pct >= 1 ? ' good' : '');
  const right = opts.pct ? `${Math.round(pct * 100)}%` : `/${goal.toLocaleString()}${unit}`;
  return `<div class="micro${cls}" data-act="nutrient" data-key="${k}" style="cursor:pointer"><div class="n">${name}</div><div class="v">${microRound(v).toLocaleString()}<span>${right}</span></div><div class="mbar"><i style="transform:scaleX(${Math.min(1, pct).toFixed(3)})"></i></div></div>`;
}
/*
 * Where a number comes from. Tapping protein, or sodium, or folate should
 * answer "what is feeding this", so the list is the whole day's plan, not only
 * what he has ticked: the ones already eaten are marked, and the header gives
 * both totals so the day's figure and the plan's figure never look at odds.
 */
const MACRO_DEFS = {
  cal: ['Calories', '', () => S.settings.calGoal],
  protein: ['Protein', 'g', () => S.settings.proteinGoal],
  carbs: ['Carbs', 'g', () => S.settings.carbGoal],
  fat: ['Fat', 'g', () => S.settings.fatGoal]
};
const nutrientOf = (item, key) => (MACRO_DEFS[key] ? item[key] : (item.micros || {})[key]) || 0;
function openNutrient(key) {
  const macro = MACRO_DEFS[key];
  const def = macro ? null : MICRO_BY_KEY[key];
  if (!macro && !def) return;
  const name = macro ? macro[0] : def[1];
  const unit = macro ? macro[1] : def[3];
  const goal = macro ? macro[2]() : def[2];
  const cap = !macro && def[4] === 'cap';
  const day = today();
  const rows = [...day.meals.filter((x) => !x.skipped), ...day.extras]
    .map((x) => ({ name: x.name, slot: x.slot || 'Extra', time: x.time, done: !!x.done, v: nutrientOf(x, key) }))
    .filter((r) => r.v > 0)
    .sort((a, b) => b.v - a.v);
  const all = rows.reduce((s, r) => s + r.v, 0);
  const got = rows.filter((r) => r.done).reduce((s, r) => s + r.v, 0);
  const fmt = (v) => `${microRound(v).toLocaleString()}${unit}`;
  if (!rows.length) {
    openSheet(name, fmt(0), `<div class="card" style="padding:18px"><div class="t">Nothing in today's plan carries ${name.toLowerCase()}.</div><div class="s" style="margin-top:6px;line-height:1.4">Either nothing you eat has it, or the items it is in have no numbers yet. Tap a meal on the Plan to fill them in.</div></div>`);
    return;
  }
  const top = rows[0];
  const share = Math.round((100 * top.v) / all);
  openSheet(name, `${fmt(got)} today`, `
    <div class="card macs">
      <div><div class="n">Eaten</div><div class="v">${fmt(got)}</div></div>

      <div><div class="n">${cap ? 'Ceiling' : 'Target'}</div><div class="v">${fmt(goal)}</div></div>

      const pct = Math.round((100 * r.v) / all);
      return `<div class="row${r.done ? ' done' : ''}"><div class="txt"><div class="t">${esc(r.name)}</div><div class="s">${esc(r.slot)}${r.time ? ' · ' + t12s(r.time) : ''}${r.done ? ' · eaten' : ''}</div><div class="mbar" style="margin-top:6px"><i style="transform:scaleX(${(r.v / (top.v || 1)).toFixed(3)})"></i></div></div><div style="text-align:right;flex-shrink:0"><div class="t">${fmt(r.v)}</div><div class="s">${pct}%</div></div></div>`;
    }).join('')}</div></div>
    <div class="card" style="padding:14px 16px"><div class="s" style="line-height:1.45">${cap
      ? `${name} is a ceiling, not a target. The plan puts ${fmt(all)} in the day against ${fmt(goal)}, and ${esc(top.name)} is ${share}% of it, so that is the one to change if you want the number down.`
      : `The plan puts ${fmt(all)} in the day against ${fmt(goal)}${all >= goal ? ', so a full day covers it' : `, which leaves you ${fmt(goal - all)} short even on a perfect day`}. ${esc(top.name)} carries ${share}% of it.`}</div></div>
  `);
}

function shrink(file, max, q) {

function applyFit(fit) {
  if (!fit || !fit.metric) return null;
  snapshot('Fitbit screenshot');
  S.fit = S.fit || FIT_SEED();
  const entries = (fit.entries || []).filter((x) => /^\d{4}-\d{2}-\d{2}$/.test(x.date || '') && typeof x.value === 'number');
  const merge = (list, es) => { for (const x of es) { const i = list.findIndex((y) => y.date === x.date && y.period === x.period); const row = { date: x.date, value: Math.round(x.value), period: x.period || 'day' }; if (i >= 0) list[i] = row; else list.push(row); } };
  const t = ymd();

    case 'steps':
      merge(S.fit.steps, entries.filter((x) => x.period !== 'day'));
      if (fit.today != null) S.steps = { today: Math.round(fit.today), date: t };
      if (fit.headline?.label) S.fit.notes.steps = `${fit.headline.label}: ${Math.round(fit.headline.value).toLocaleString()}`;
      what = `steps${fit.today != null ? ' · today ' + Math.round(fit.today).toLocaleString() : ''} · ${entries.length} entries`;
      break;
    case 'weight': {
      const lbs = entries.map((x) => ({ date: x.date, lb: fit.unit === 'kg' ? Math.round(x.value * 2.2046 * 10) / 10 : Math.round(x.value * 10) / 10 }));

      if (fit.today != null) { S.weights = S.weights.filter((y) => y.date !== t); S.weights.push({ date: t, lb: fit.unit === 'kg' ? Math.round(fit.today * 2.2046 * 10) / 10 : fit.today }); }
      what = `weight · ${lbs.length + (fit.today != null ? 1 : 0)} entries`;
      break;
    }
    case 'resting_hr':
      merge(S.fit.rhr, entries);
      if (fit.headline?.label) S.fit.notes.rhr = `${fit.headline.label}: ${Math.round(fit.headline.value)} bpm`;
      what = `resting heart rate · ${entries.length} entries`;

      what = `energy · ${entries.length} entries`;
      break;
    default:

  }
  return what;
}

/* ---------- nudges (web push) ----------
 * Three a day, decided server side from this same synced row: steps at 2, where
 * the day stands at 6, anything still open at 10. The subscription is stored in
 * state like everything else, so it rides the normal sync and needs no table.
 * On iPhone this only works from the home-screen copy, never from a Safari tab.
 */
const VAPID_PUBLIC = 'BLKel7CKq4SiXr6mWZhFJmCRBskpg8PAErTg7dOz93AcngJyfAer8w2uLQRZ7g1FfQ5FRXL7OkIi-tXz6Adq7-o';

// subscribe() takes the key as raw bytes. The string form is in the spec but is
// not worth trusting across Safari versions when the conversion is four lines.
function vapidBytes(s) {
  const pad = '='.repeat((4 - (s.length % 4)) % 4);
  const bin = atob((s + pad).replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from(bin, (c) => c.charCodeAt(0));
}
const standalone = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;

function pushCard() {
  const on = !!(S.push && S.push.on);
  if (!pushReady()) {
    return `<div class="card" style="padding:16px"><div class="lbl">Nudges</div><div class="s" style="margin-top:6px">This browser cannot do notifications. On iPhone, open the copy you added to your home screen.</div></div>`;
  }
  const blocked = Notification.permission === 'denied';
  return `<div class="card" style="padding:16px">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
      <div><div class="lbl">Nudges</div><div class="t" style="margin-top:2px">${on ? 'On' : 'Off'}</div></div>
      <button class="btn ${on ? 'ghost' : ''}" data-act="${on ? 'push-off' : 'push-on'}">${on ? 'Turn off' : 'Turn on'}</button>
    </div>
    <div class="s" style="margin-top:8px">Steps at 2. Where the day stands at 6. Anything still open at 10.</div>
    ${blocked ? `<div class="s" style="margin-top:6px;color:#b3261e">Notifications are blocked for this app in iPhone Settings.</div>` : ''}
    ${on ? `<button class="btn ghost wide" data-act="push-test" style="margin-top:10px">Send me a test</button>` : ''}
    ${!standalone() ? `<div class="s" style="margin-top:6px;color:#67645d">Open the home screen copy first, or the switch will not stick.</div>` : ''}
  </div>`;
}

async function pushOn() {
  try {
    if (Notification.permission !== 'granted') {
      const p = await Notification.requestPermission();
      if (p !== 'granted') { toast({ t: 'Notifications not allowed', s: 'You can turn them on in iPhone Settings.', cls: 'red', ms: 6000 }); renderTalk(); return; }
    }
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: vapidBytes(VAPID_PUBLIC) });
    const j = sub.toJSON();
    S.push = { on: true, sub: { endpoint: j.endpoint, keys: j.keys }, at: nowHM(), date: ymd() };
    save();
    toast({ t: 'Nudges on', s: 'Three a day. Try the test button.', cls: 'blue', ms: 5000 });
  } catch (err) {
    toast({ t: 'Could not turn nudges on', s: err.message, cls: 'red', ms: 6000 });
  }
  renderTalk();
}

async function pushOff() {
  try {
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if (sub) await sub.unsubscribe();
  } catch {}
  S.push = { on: false };
  save();
  toast({ t: 'Nudges off', ms: 3000 });
  renderTalk();
}

/* ============================================================
   The desk: the week as the home screen, at desktop width.

   Same state, same sync, same sheets as the phone. What changes is
   the question the screen answers. The phone asks "what is next
   today"; the desk asks "what does my week look like", so a day is
   a short list of the things he has to do and food folds down to
   one row that opens its own section.

   Three additions to a task make that work, all optional so the
   phone reads them as ordinary tasks: a kind (what sort of thing it
   is), steps (a skincare routine is one row with a checklist
   inside), and the routine now carries both.
   ============================================================ */
const DESK = () => window.innerWidth >= 1000;
const desk = { sec: 'week', off: 0, open: null, expand: {}, pop: null, drag: null, say: '' };
const KINDS = [['train', 'Train'], ['content', 'Content'], ['care', 'Care'], ['errand', 'Errand']];
/* Anything added by voice or on the phone has no kind, so read it off the name. */
const KIND_RE = [
  ['train', /gym|workout|basketball|walk|\brun|lift|train|stretch|cardio|hoop|practice/i],
  ['content', /video|record|\bedit|upload|stream|thumbnail|script|voiceover|podcast|\bpost|drops?\b|shoot\b/i],
  ['care', /skin|weigh|photo|floss|shower|sleep|meditat|supplement|vitamin|haircut|shave|journal/i]
];
function kindOf(x) {
  if (x.kind) return x.kind;
  for (const [k, re] of KIND_RE) if (re.test(x.name || '')) return k;
  return 'errand';
}
const DCHECK = (s = 12) => `<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="#fbfaf7" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>`;
const byTime = (a, b) => (a.time ? minutes(a.time) : 9999) - (b.time ? minutes(b.time) : 9999);

const WEEK_ORDER = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

/* A day for the week: the saved one, a peek at one not started yet, or nothing for a past day never opened. */
function deskDay(date) {
  if (S.days[date]) return S.days[date];
  if (date >= ymd()) return previewDay(date);
  return null;
}
/* A peeked item gets a real home the moment it is touched. Same index, so the id maps straight across. */
function realTask(id, date) {
  if (String(id).startsWith('peek-')) { ensureDay(date); id = String(id).slice(5); }
  return findItem('task', id);
}
function taskState(t, date, nm) {
  if (t.done) return 'done';
  if (t.skipped) return 'skip';
  const td = ymd();
  if (date < td) return 'miss';
  if (date === td && t.time && nm - minutes(t.end || t.time) >= MISS_GRACE) return 'miss';
  return '';
}
function deskDates() { const mon = addDays(weekKey(), desk.off * 7); return Array.from({ length: 7 }, (_, i) => addDays(mon, i)); }

/*
 * A future day that has been opened keeps a frozen copy of the meal plan,
 * and the desk opens future days all the time (adding a shopping trip to
 * Saturday is enough). So any day ahead whose food has not been touched is
 * re-read from the plan, and stops going stale behind a plan change.
 */
function healFuture() {
  const td = ymd();
  for (const date of Object.keys(S.days)) {
    if (date <= td) continue;
    const day = S.days[date];
    if (!day || (day.extras && day.extras.length) || day.meals.some((m) => m.done || m.swapped || m.skipped)) continue;
    day.meals = S.plan.map((m, i) => ({ id: `${date}-m${i}`, slot: m.slot, name: m.name, time: m.time, cal: m.cal, protein: m.protein, carbs: m.carbs, fat: m.fat, parts: m.parts || '', micros: m.micros || null, done: false, doneAt: null, swapped: false, planned: m.name }));
  }
}

/* ---- the routine, as something you can change one thing at a time ---- */
const sameSlot = (x, o) => x.name === o.name && (x.time || null) === (o.time || null);
function routineDaysOf(o) { return WEEK_ORDER.filter((wd) => (S.routine[wd] || []).some((x) => sameSlot(x, o))); }
/*
 * Put `item` on exactly these weekdays. `old` is what it used to be called and
 * when, so a rename or a new time replaces the entry instead of adding a twin.
 * Days already opened from today on are brought into line, unless that
 * instance is already ticked.
 */
function routineUpsert(days, item, old) {
  const was = old || item;
  for (const wd of WEEK_ORDER) {
    const list = (S.routine[wd] = S.routine[wd] || []);
    const i = list.findIndex((x) => sameSlot(x, was));
    const entry = { name: item.name, time: item.time || null, end: item.end || null, kind: item.kind || null, steps: item.steps && item.steps.length ? item.steps.map((s) => s.name || s) : null };
    if (days.includes(wd)) { if (i >= 0) list[i] = entry; else list.push(entry); }
    else if (i >= 0 && old) list.splice(i, 1);
    list.sort(byTime);
  }
  const td = ymd();
  for (const date of Object.keys(S.days)) {
    if (date < td) continue;
    const tasks = S.days[date].tasks;
    const i = tasks.findIndex((x) => !x.moved && (sameSlot(x, was) || sameSlot(x, item)));
    if (days.includes(wdOf(date))) {
      if (i < 0) { tasks.push({ id: uid(`${date}-t`), name: item.name, time: item.time || null, end: item.end || null, kind: item.kind || null, steps: stepList(item.steps).length ? stepList(item.steps) : null, done: false, doneAt: null, moved: null, skipped: null }); tasks.sort(byTime); }

}

/* ---- ticking ---- */
function deskSetDone(f, done) {
  const x = f.it;
  snapshot(`${done ? 'Checked' : 'Unchecked'} ${x.name}`);
  x.done = done; x.doneAt = done ? nowHM() : null;
  if (done) x.skipped = null;

  save();

}
function deskTick(id, date) { const f = realTask(id, date); if (f) deskSetDone(f, !f.it.done); }

  const x = f.it;
  snapshot(`Step of ${x.name}`);
  x.steps[i].done = !x.steps[i].done;
  const all = x.steps.every((s) => s.done);
  if (all !== x.done) { x.done = all; x.doneAt = all ? nowHM() : null; }

    <section class="dcard itable"><header><div class="lbl">By month · click one to open it</div><div class="lbl" style="font-weight:600;letter-spacing:.06em">${inc.net ? 'Stripe after fees' : 'Stripe gross'}</div></header>
      <div class="dscroll"><table><thead><tr><th class="l">Month</th><th>Campus Kings</th><th>King Reggie</th><th>YouTube</th><th>Stripe</th><th>Combined</th><th>Against the month before</th></tr></thead><tbody>${rows}</tbody></table></div></section>`;

/*

}
/* How many days of the open window this source can speak for. Stripe is live; YouTube is a day or two behind. */
function incReported(src, p) {

}
/* Round the top of the axis up to a clean number. */
function incCeil(c) { const v = Math.max(1, c / 100); const p = Math.pow(10, Math.floor(Math.log10(v))); for (const m of [1, 2, 2.5, 5, 10]) if (m * p >= v) return m * p * 100; return 10 * p * 100; }
function incDraw() {
  const p = incPeriod();

    const el = $(`#ich-${src}`); if (!el) continue;
    const W = el.clientWidth, H = el.clientHeight; if (W < 80 || H < 60) { el.innerHTML = ''; continue; }
    const cur = p.days.slice(0, incReported(src, p)).map((d) => incOf[src](d)), prev = p.pdays.map((d) => incOf[src](d));
    const L = 46, R = 12, T = 10, B = 22, top = incCeil(Math.max(...cur, ...prev, 100));
    const n = Math.max(p.span, prev.length, 2);

      ${[0, 0.5, 1].map((f) => `<line x1="${L}" x2="${W - R}" y1="${y(top * f)}" y2="${y(top * f)}" stroke="#e6e3dc" stroke-width="1"></line><text x="${L - 8}" y="${y(top * f) + 4}" text-anchor="end" font-size="12" font-weight="600" fill="#67645d" style="font-variant-numeric:tabular-nums">${moneyAxis(top * f)}</text>`).join('')}
      <text x="${L}" y="${H - 4}" font-size="12" font-weight="600" fill="#67645d">${dayLbl(p.start)}</text>
      <text x="${W - R}" y="${H - 4}" text-anchor="end" font-size="12" font-weight="600" fill="#67645d">${dayLbl(addDays(p.start, n - 1))}</text>
      ${prev.length > 1 ? `<polyline points="${pts(prev)}" fill="none" stroke="#a8a49c" stroke-width="1.5" stroke-dasharray="4 4" stroke-linejoin="round" stroke-linecap="round"></polyline>` : ''}
      ${cur.length > 1 ? `<polygon points="${x(0).toFixed(1)},${y(0)} ${pts(cur)} ${x(last).toFixed(1)},${y(0)}" fill="${c}" opacity="0.10"></polygon><polyline points="${pts(cur)}" fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></polyline>` : ''}
      ${cur.length ? `<circle cx="${x(last).toFixed(1)}" cy="${y(cur[last]).toFixed(1)}" r="4" fill="${c}" stroke="#fbfaf7" stroke-width="2"></circle>` : ''}
      <g class="ihov" style="display:none"><line y1="${T}" y2="${H - B}" stroke="#1d1d1f" stroke-width="1"></line><circle class="hp" r="4" fill="#a8a49c" stroke="#fbfaf7" stroke-width="2"></circle><circle class="hc" r="4.5" fill="${c}" stroke="#fbfaf7" stroke-width="2"></circle></g>

/* One pointer, three charts: the day under the cursor is read off all of them together. */
function incHover(src, clientX) {

function incHoverOff() { for (const s of ['yt', 'st', 'all']) { const g = inc.geo[s]; if (!g) continue; const h = g.el.querySelector('.ihov'), t = g.el.querySelector('.itip'); if (h) h.style.display = 'none'; if (t) t.hidden = true; } }
function incAct(a, b) {

  else if (a === 'inc-nav') { const n = Number(b.dataset.n); inc.off = n === 0 ? 0 : Math.max(0, inc.off + n); }

(function incWire() {

/* ---------- sync (Supabase, one row) ----------
 * Two screens, one row. This used to be "whoever writes last wins, with the
 * whole day": fine for a phone you pick up and put down, wrong for a desk
 * that sits open all afternoon and then pushes a three hour old copy of
 * everything over what the phone just did.
 *
 * So each side remembers the copy both last agreed on (the base), looks at
 * the row before it writes, and when both have moved it folds its own changes
 * onto the other's, item by item: a coffee ticked on the phone and a task
 * added at the desk both survive. Only a true clash on one single value falls
 * back to "the side writing now wins".
 */
const sbHeaders = { apikey: SB_KEY, Authorization: `Bearer ${SB_KEY}`, 'Content-Type': 'application/json' };
let syncBase = null;
let syncBusy = false;
function scheduleSync() { clearTimeout(sync.timer); sync.timer = setTimeout(syncNow, 1500); }

/* Equal in content. Key order is ignored on purpose: the database stores JSON with its keys reordered. */
function deepEq(a, b) {
  if (a === b) return true;
  if (a == null || b == null || typeof a !== 'object' || typeof b !== 'object') return false;
  if (Array.isArray(a) !== Array.isArray(b)) return false;
  if (Array.isArray(a)) { if (a.length !== b.length) return false; for (let i = 0; i < a.length; i++) if (!deepEq(a[i], b[i])) return false; return true; }
  const ka = Object.keys(a), kb = Object.keys(b);
  if (ka.length !== kb.length) return false;
  for (const k of ka) if (!(k in b) || !deepEq(a[k], b[k])) return false;
  return true;
}
const isObj = (x) => !!x && typeof x === 'object' && !Array.isArray(x);
/* How to tell that two list entries are the same thing. No answer means the list is taken whole. */
function listKey(arr) {
  const s = arr.find((x) => isObj(x));
  if (!s) return null;
  if ('id' in s) return (x) => (isObj(x) ? `i:${x.id}` : `v:${JSON.stringify(x)}`);
  if ('date' in s && 'lb' in s) return (x) => `d:${x.date}`;
  if ('role' in s && 'text' in s) return (x) => `c:${x.date}|${x.at}|${x.role}|${String(x.text).slice(0, 60)}`;
  return null;
}
/* base, mine, theirs -> what both should now hold */
function merge3(b, l, r) {
  if (deepEq(l, r)) return l;
  if (deepEq(b, l)) return r;                  // only the other side changed this
  if (deepEq(b, r)) return l;                  // only this side changed this
  if (isObj(l) && isObj(r)) {
    const bo = isObj(b) ? b : {}, out = {};
    for (const k of new Set([...Object.keys(r), ...Object.keys(l)])) {

      else if (inL) { if (!inB || !deepEq(bo[k], l[k])) out[k] = l[k]; }      // else they removed it and we never touched it
      else if (!inB || !deepEq(bo[k], r[k])) out[k] = r[k];                    // else we removed it and they never touched it
    }
    return out;
  }
  if (Array.isArray(l) && Array.isArray(r)) {
    const key = listKey(l.length ? l : r);
    if (!key) return l;
    const ba = Array.isArray(b) ? b : [];
    const bm = new Map(ba.map((x) => [key(x), x])), lm = new Map(l.map((x) => [key(x), x])), rm = new Map(r.map((x) => [key(x), x]));

    for (const x of r) { const k = key(x); if (lm.has(k)) out.push(merge3(bm.get(k), lm.get(k), x)); else if (!bm.has(k) || !deepEq(bm.get(k), x)) out.push(x); }

const clone = (o) => JSON.parse(JSON.stringify(o));
/* Someone is mid-thought: a sheet or form is open, a box has focus, the mic is on. Swapping the state under that would lose what they are doing. */
function uiBusy() {
  const a = document.activeElement;
  return !!(desk.pop || desk.drag || voice.on || voice.busy || $('#sheet').classList.contains('show') || (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)));
}
function adoptState(next) {
  S = Object.assign(DEFAULT(), next);
  S.planVersion = next.planVersion || 1;
  migratePlan();
  healFuture();
  try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch {}
}
const liveIO = {
  async stamp() {
    const r = await fetch(`${SB_URL}/rest/v1/day_state?id=eq.${ROW_ID}&select=stamp:data->>updatedAt`, { headers: sbHeaders });
    if (!r.ok) throw new Error(`err ${r.status}`);
    const rows = await r.json();
    return rows.length ? Number(rows[0].stamp) || 0 : null;
  },
  async full() {
    const r = await fetch(`${SB_URL}/rest/v1/day_state?id=eq.${ROW_ID}&select=data`, { headers: sbHeaders });
    if (!r.ok) throw new Error(`err ${r.status}`);
    const rows = await r.json();
    return rows.length ? rows[0].data : null;
  },
  async put(data) {
    const r = await fetch(`${SB_URL}/rest/v1/day_state`, { method: 'POST', headers: { ...sbHeaders, Prefer: 'resolution=merge-duplicates,return=minimal' }, body: JSON.stringify([{ id: ROW_ID, data, updated_at: new Date().toISOString() }]) });

/*
 * One pass. Returns what it did, which is also what the rig checks:

 */
async function syncCore(io) {
  const push = async () => { const sent = clone(S); await io.put(sent); syncBase = sent; return 'pushed'; };
  const stamp = await io.stamp();
  if (stamp == null) return push();                                   // no row yet

  // the row moved since we last agreed
  if (uiBusy()) return 'waiting';
  const remote = await io.full();
  if (!remote) return push();
  if (!syncBase) {

    if ((remote.updatedAt || 0) > (S.updatedAt || 0)) { adoptState(remote); syncBase = clone(remote); return 'adopted'; }

  const merged = merge3(syncBase, clone(S), remote);

const pushSync = syncNow, pullSync = syncNow;

/* ---------- boot ---------- */
load();

tickClock();
render();
renderTabs();
setInterval(() => { tickClock(); renderNow(); renderDesk(); }, 30 * 1000);
setInterval(() => { if (document.visibilityState === 'visible') syncNow(); }, 15 * 1000);
loadWeather();
if (S.settings.place.auto) locate();
pullSync();
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { tickClock(); ensureDay(ymd()); render(); pullSync(); loadWeather(); } });

/*
 * Self-update. The shell is fetched fresh on every open, but a phone can still
 * be running an older copy it already had in memory. So the app asks the site
 * what version is live and reloads itself when that differs. One reload, then
 * the versions match and it stops.
 */
async function checkForUpdate() {
  try {
    const r = await fetch(`/day/index.html?u=${Date.now()}`, { cache: 'no-store' });
    if (!r.ok) return;
    const m = /APP_VERSION = '([^']+)'/.exec(await r.text());
    if (m && m[1] !== APP_VERSION && !sessionStorage.getItem(`reloaded-${m[1]}`)) {
      sessionStorage.setItem(`reloaded-${m[1]}`, '1');
      toast({ t: 'Updating', s: `Daily Board ${m[1]}`, cls: 'blue', ms: 1500 });
      setTimeout(() => location.reload(), 900);
    }
  } catch {}
}
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('/day/sw.js', { updateViaCache: 'none' }).then((reg) => { try { reg.update(); } catch {} }).catch(() => {});
}
if (location.protocol === 'https:') { setTimeout(checkForUpdate, 2500); document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkForUpdate(); }); }
