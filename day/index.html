<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Daily Board</title>
<link rel="manifest" href="/day/manifest.webmanifest">
<link rel="apple-touch-icon" href="/day/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Board">
<meta name="theme-color" content="#e9e7e2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&display=swap">
<style>
  :root {
    --ground: #e9e7e2; --card: #fbfaf7; --edge: #cfccc4; --line: #e6e3dc; --ink: #1d1d1f; --mute: #67645d; --soft: #a8a49c;
    --blue: #2b5cff; --blue-deep: #1a3fc2; --blue-tint: #dbe4ff; --blue-soft: #9db3ff;
    --raise: 0 1px 0 #ffffff inset, 0 6px 0 var(--edge), 0 14px 24px rgba(0,0,0,0.10);
    --press: 0 4px 0 var(--blue-deep) inset, 0 4px 8px rgba(0,0,0,0.22) inset;
    --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
    --barh: 74px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--ground); color: var(--ink); font-family: 'Outfit', 'Trebuchet MS', sans-serif; overscroll-behavior: none; }
  body { overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; border-radius: 8px; }
  input, textarea, select { font: inherit; }

  .lbl { font-weight: 700; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--mute); }
  .big { font-weight: 800; letter-spacing: -0.02em; line-height: 1; }
  .t { font-weight: 700; font-size: 16px; color: var(--ink); }
  .s { font-weight: 600; font-size: 12.5px; color: var(--mute); }
  .card { background: var(--card); border-radius: 26px; box-shadow: var(--raise); }
  .btn { height: 48px; border-radius: 999px; background: var(--ink); color: var(--card); box-shadow: 0 6px 0 #000; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 700; font-size: 14px; padding: 0 18px; transition: transform .08s, box-shadow .08s; }
  .btn:active { transform: translateY(5px); box-shadow: 0 1px 0 #000; }
  .btn.blue { background: var(--blue); box-shadow: 0 6px 0 var(--blue-deep); }
  .btn.blue:active { box-shadow: 0 1px 0 var(--blue-deep); }
  .btn.ghost { background: var(--card); color: var(--ink); box-shadow: 0 1px 0 #fff inset, 0 5px 0 var(--edge); }
  .btn.ghost:active { box-shadow: 0 1px 0 var(--edge); }
  .btn.wide { width: 100%; }
  .pill { height: 36px; padding: 0 14px; border-radius: 999px; background: var(--card); color: var(--ink); box-shadow: 0 1px 0 #fff inset, 0 4px 0 var(--edge); display: inline-flex; align-items: center; font-weight: 700; font-size: 13px; white-space: nowrap; }
  .pill:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--edge); }
  .stamp { font-weight: 800; font-size: 11px; letter-spacing: 0.14em; padding: 4px 8px; border: 2px solid var(--blue); color: var(--blue); background: var(--card); border-radius: 6px; transform: rotate(-6deg); text-shadow: 0 1px 0 #fff; box-shadow: 0 2px 0 #b8c6ff; flex-shrink: 0; }
  .row.done .stamp { animation: stampIn .35s cubic-bezier(.2,1.4,.4,1) both; }
  @keyframes stampIn { 0% { transform: rotate(-20deg) scale(2.2); opacity: 0; } 60% { transform: rotate(-4deg) scale(.92); opacity: 1; } 100% { transform: rotate(-6deg) scale(1); } }

  /* pages */
  #track { position: fixed; inset: 0; display: flex; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; scrollbar-width: none; }
  #track::-webkit-scrollbar { display: none; }
  .page { flex: 0 0 100vw; width: 100vw; height: 100%; scroll-snap-align: start; overflow-y: auto; overflow-x: hidden; padding: calc(var(--sat) + 14px) 14px calc(var(--barh) + var(--sab) + 16px); -webkit-overflow-scrolling: touch; }
  .page::-webkit-scrollbar { display: none; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .in-tabs { display: flex; gap: 6px; margin: 0 0 12px; }

  /* rows */
  .list { display: flex; flex-direction: column; overflow: hidden; }
  .row { display: flex; align-items: center; gap: 12px; min-height: 54px; padding: 4px 16px; position: relative; overflow: hidden; }
  .row + .row { border-top: 1.5px solid var(--line); }
  .row .txt { display: flex; flex-direction: column; flex-grow: 1; min-width: 0; }
  .row .t, .row .s { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .s.parts { white-space: normal; font-size: 12px; color: var(--soft); margin-top: 2px; line-height: 1.3; }
  .row:has(.parts) { padding: 10px 16px; }
  .row::before { content: ""; position: absolute; inset: 0; background: var(--blue-tint); transform: scaleX(0); transform-origin: left; transition: transform .35s cubic-bezier(.2,.9,.3,1); z-index: 0; }
  .row.done::before { transform: scaleX(1); }
  .row > * { position: relative; z-index: 1; }
  .row.moved .t { color: var(--mute); }
  .chk { width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: var(--card); border: 1.5px solid var(--edge); box-shadow: 0 1px 0 #fff inset, 0 4px 0 var(--edge), 0 6px 8px rgba(0,0,0,0.10); transition: transform .08s, box-shadow .08s, background .15s; }
  .chk:active { transform: translateY(4px); box-shadow: 0 0 0 var(--edge); }
  .chk svg { opacity: 0; transform: scale(.4); transition: transform .25s cubic-bezier(.2,1.6,.4,1), opacity .15s; }
  .row.done .chk { background: var(--blue); border-color: var(--blue-deep); box-shadow: var(--press); }
  .row.done .chk svg { opacity: 1; transform: scale(1); }
  .row.moved .chk { border-style: dashed; box-shadow: none; }
  .time { font-weight: 800; font-size: 18px; color: var(--blue); flex-shrink: 0; }
  .grp-lbl { padding: 6px 4px 0; }

  /* now page */
  .sky { position: relative; height: 300px; margin: calc(-1 * (var(--sat) + 14px)) -14px 0; padding: calc(var(--sat) + 14px) 18px 0; border-radius: 0 0 30px 30px; overflow: hidden; transition: background .8s; }
  .sky .sun { position: absolute; right: 30px; top: calc(var(--sat) + 74px); width: 120px; height: 120px; border-radius: 50%; transition: background .8s, box-shadow .8s; }
  .sky .hill { position: absolute; left: -30px; right: -30px; top: 232px; height: 140px; border-radius: 50% 50% 0 0 / 100% 100% 0 0; transition: background .8s, box-shadow .8s; }
  .sky .moon { position: absolute; right: 44px; top: calc(var(--sat) + 80px); width: 86px; height: 86px; border-radius: 50%; background: #f4f1ea; box-shadow: 0 6px 0 rgba(0,0,0,0.18); opacity: 0; transition: opacity .8s; }
  .sky .star { position: absolute; width: 4px; height: 4px; border-radius: 50%; background: #fff; opacity: 0; transition: opacity .8s; }
  .sky.night .moon, .sky.night .star { opacity: 1; }
  .sky.night .sun { opacity: 0; }
  .sky .top { position: relative; display: flex; justify-content: space-between; gap: 8px; }
  .chip { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border-radius: 999px; background: var(--ink); color: var(--card); box-shadow: 0 4px 0 #000; font-weight: 700; font-size: 13px; white-space: nowrap; min-width: 0; }
  .chip svg { flex-shrink: 0; }
  .chip span { overflow: hidden; text-overflow: ellipsis; }
  #place-chip { flex-shrink: 0; }
  #wx-chip { flex: 0 1 auto; }
  .sky .clock { position: relative; margin-top: 22px; }
  .sky .clock .lbl { color: inherit; }
  .sky .clock .big { font-size: 72px; margin-top: 6px; }
  .next { margin-top: -50px; position: relative; z-index: 2; background: var(--ink); color: var(--card); border-radius: 26px; padding: 16px; box-shadow: 0 6px 0 #000, 0 14px 24px rgba(0,0,0,0.14); display: flex; flex-direction: column; gap: 10px; }
  .next .lbl { color: var(--soft); }
  .next .in { color: var(--blue-soft); }
  .next .line { height: 2px; background: #000; box-shadow: 0 1px 0 #3a3a3d; border-radius: 1px; }
  .next .h { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
  .next .h .big { font-size: 32px; }
  .next .h .when { font-size: 24px; color: var(--blue-soft); padding-bottom: 2px; }
  .next .meal { display: flex; align-items: center; gap: 12px; }
  .next .meal .s { color: var(--soft); }
  .next .meal .t { color: var(--card); font-size: 15px; }
  .tiles { display: flex; gap: 10px; }
  .tile { flex: 1 1 0; display: flex; flex-direction: column; gap: 8px; padding: 14px; min-height: 88px; }
  .tile .big { font-size: 28px; }
  .tile.slim { flex: 0 0 auto; min-width: 92px; }
  .ring { width: 40px; height: 40px; }
  .barr { height: 8px; border-radius: 4px; background: var(--ground); box-shadow: 0 2px 0 var(--edge) inset; overflow: hidden; }
  .barr i { display: block; height: 100%; width: 100%; border-radius: 4px; background: var(--ink); transform-origin: left; transform: scaleX(0); transition: transform .5s cubic-bezier(.2,.9,.3,1); }
  .fold { display: flex; align-items: center; justify-content: space-between; padding: 0 4px; min-height: 44px; }
  .fold .lbl { display: flex; align-items: center; gap: 8px; }
  .fold svg { transition: transform .2s; }
  .fold.open svg { transform: rotate(180deg); }
  .fold + .list { display: none; }
  .fold-row { display: flex; align-items: center; justify-content: space-between; }
  .fold.open + .list { display: flex; }

  /* macros */
  .mac { display: flex; align-items: center; gap: 10px; min-height: 30px; }
  .mac .n { font-weight: 700; font-size: 13px; width: 60px; flex-shrink: 0; }
  .mac .v { font-weight: 700; font-size: 13px; width: 80px; text-align: right; flex-shrink: 0; }
  .mac .barr { flex-grow: 1; height: 10px; border-radius: 5px; }
  .mac .barr i { background: var(--ink); }
  .mac.p .barr i { background: var(--blue); }
  .micro-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 20px; padding: 4px 16px 10px; }
  .micro { display: flex; justify-content: space-between; align-items: center; min-height: 32px; }
  .micro .n { font-weight: 600; font-size: 13px; color: var(--mute); }
  .micro .v { font-weight: 700; font-size: 13px; }
  .micro .v span { color: var(--mute); font-weight: 600; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; padding: 2px 4px; }

  /* body page */
  .weight-hero { display: flex; align-items: flex-end; justify-content: space-between; }
  .weight-hero .big { font-size: 40px; }
  .spark { width: 100%; height: 70px; display: block; }
  .phys { display: flex; overflow: hidden; min-height: 190px; }
  .phys .pic { width: 150px; flex-shrink: 0; background: #d6d2c8; position: relative; box-shadow: 4px 0 0 var(--edge); display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .phys .pic img { width: 100%; height: 100%; object-fit: cover; }
  .phys .pic .tag { position: absolute; left: 10px; bottom: 10px; padding: 4px 8px; border-radius: 6px; background: var(--ink); color: var(--card); font-weight: 700; font-size: 11px; }
  .phys .info { display: flex; flex-direction: column; gap: 8px; padding: 14px 16px; flex-grow: 1; min-width: 0; }
  .phys .info .big { font-size: 40px; }
  .phys .info .big span { font-size: 22px; }
  .meas { display: flex; gap: 12px; }
  .meas > div { flex: 1 1 0; display: flex; flex-direction: column; gap: 2px; }
  .meas .lbl { font-size: 10px; }
  .thumbs { display: flex; gap: 8px; }
  .thumbs .th { flex: 1 1 0; height: 72px; border-radius: 18px; background: #d6d2c8; box-shadow: var(--raise); overflow: hidden; position: relative; }
  .thumbs .th img { width: 100%; height: 100%; object-fit: cover; }
  .thumbs .th .s { position: absolute; left: 8px; bottom: 6px; font-weight: 700; color: var(--ink); background: rgba(251,250,247,0.85); padding: 2px 6px; border-radius: 6px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field input, .field textarea, .field select { width: 100%; height: 48px; border-radius: 14px; border: 1.5px solid var(--edge); background: var(--card); padding: 0 14px; font-weight: 700; font-size: 16px; color: var(--ink); box-shadow: 0 2px 0 var(--edge) inset; outline: none; }
  .field textarea { height: auto; min-height: 120px; padding: 12px 14px; line-height: 1.4; font-weight: 600; font-size: 14px; resize: vertical; }
  .field input:focus, .field textarea:focus { border-color: var(--blue); }

  /* wrap */
  .prompt { background: var(--ink); color: var(--card); border-radius: 26px; padding: 18px; box-shadow: 0 6px 0 #000, 0 14px 24px rgba(0,0,0,0.14); display: flex; flex-direction: column; gap: 14px; }
  .prompt p { margin: 0; font-weight: 600; font-size: 15px; line-height: 1.4; color: #d9d3c5; }
  .prompt .go { display: flex; align-items: center; gap: 12px; }
  .prompt .go .mic-btn { width: 56px; height: 56px; border-radius: 50%; background: var(--blue); box-shadow: 0 5px 0 var(--blue-deep); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .prompt .go .mic-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--blue-deep); }
  .day { display: flex; gap: 12px; padding: 12px 14px; align-items: flex-start; }
  .score { width: 46px; height: 46px; border-radius: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-weight: 800; font-size: 18px; background: var(--blue-tint); color: var(--blue); box-shadow: 0 3px 0 #b8c6ff; }
  .score.top { background: var(--ink); color: var(--card); box-shadow: 0 3px 0 #000; }
  .score.low { background: var(--ground); color: var(--mute); box-shadow: 0 3px 0 var(--edge); }
  .day .q { font-weight: 600; font-size: 13.5px; color: #3a3a3a; line-height: 1.35; }
  .day .q div + div { margin-top: 3px; }

  /* section tabs at the top of each page */
  .tab { flex: 1 1 0; height: 40px; border-radius: 999px; background: var(--card); color: var(--mute); box-shadow: 0 1px 0 #fff inset, 0 4px 0 var(--edge); font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center; transition: transform .08s, box-shadow .08s; white-space: nowrap; padding: 0 6px; }
  .tab:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--edge); }
  .tab.on { background: var(--ink); color: var(--card); box-shadow: 0 4px 0 #000; }

  /* bottom nav: one icon per area, the way Fitbit does it */
  #nav { position: fixed; left: 0; right: 0; bottom: 0; height: calc(var(--barh) + var(--sab)); padding: 8px 10px calc(var(--sab) + 8px); display: flex; gap: 4px; align-items: stretch; background: var(--card); box-shadow: 0 -1px 0 #fff inset, 0 -6px 0 var(--edge), 0 -14px 24px rgba(0,0,0,0.08); z-index: 20; }
  .nb { flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border-radius: 16px; color: var(--mute); font-weight: 700; font-size: 9.5px; letter-spacing: 0.03em; text-transform: uppercase; transition: transform .08s, box-shadow .08s, background .12s; min-width: 0; padding: 0 2px; }
  .nb svg { width: 22px; height: 22px; }
  .nb:active { transform: translateY(2px); }
  .nb.on { background: var(--ink); color: var(--card); box-shadow: 0 4px 0 #000; }
  .nb:last-child { margin-right: 60px; }

  /*
   * Section heroes. Same flat toy panel as the Now sky: one colour, a hard
   * bottom edge, one thing moving slowly behind the words. Each page gets its
   * own hue and its own motion so you know where you are at a glance.
   */
  .hero { position: relative; margin: calc(-1 * (var(--sat) + 14px)) -14px 12px; padding: calc(var(--sat) + 26px) 18px 18px; border-radius: 0 0 30px 30px; overflow: hidden; min-height: 164px; display: flex; align-items: flex-end; }
  .hero-art { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  .hero-row { position: relative; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; width: 100%; }
  .hero .big { font-size: 34px; }
  .hero .lbl { color: rgba(29,29,31,0.75); }
  .hero-stat { text-align: right; flex-shrink: 0; }
  .hero-stat .big { font-size: 24px; }
  .hero-stat .big span { opacity: 0.55; }

  .hero.fuel { background: #ffcf85; color: var(--ink); box-shadow: 0 6px 0 #d9922f, 0 14px 24px rgba(0,0,0,0.10); }
  .hero.fuel .fill { position: absolute; left: 0; right: 0; bottom: 0; height: 100%; background: #ff9d3d; transform-origin: bottom; transform: scaleY(0); transition: transform .9s cubic-bezier(.2,.9,.3,1); }
  .hero.fuel .wave { position: absolute; top: -11px; left: -50%; width: 200%; height: 24px; fill: #ff9d3d; animation: drift 11s linear infinite; }
  .hero.fuel .fill { will-change: transform; }
  @keyframes drift { to { transform: translateX(25%); } }

  .hero.body { background: #8fdcc0; color: var(--ink); box-shadow: 0 6px 0 #3f9c7a, 0 14px 24px rgba(0,0,0,0.10); }
  .hero.body .trend { position: absolute; inset: 0; width: 100%; height: 100%; }
  .hero.body .trend polyline { fill: none; stroke: #1d6b52; stroke-width: 3.5; stroke-linejoin: round; stroke-linecap: round; opacity: .55; animation: draw 2.2s ease-out both; }
  .hero.body .trend line { stroke: #6ec6a6; stroke-width: 1.5; }
  .hero.body .trend circle { fill: #1d6b52; }
  @keyframes draw { from { stroke-dashoffset: var(--len); } to { stroke-dashoffset: 0; } }

  .hero.board { background: #a3b9ff; color: var(--ink); box-shadow: 0 6px 0 #4f6fd4, 0 14px 24px rgba(0,0,0,0.10); }
  .hero.board .blocks { position: absolute; left: 18px; right: 18px; top: calc(var(--sat) + 22px); display: flex; gap: 4px; height: 30px; }
  .hero.board .blocks i { flex: 1 1 0; border-radius: 4px; background: rgba(29,29,31,0.14); transition: background .4s; }
  .hero.board .blocks i.on { background: var(--blue); }
  .hero.board .sheen { position: absolute; top: 0; bottom: 0; width: 70%; left: -70%; background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.45) 50%, rgba(255,255,255,0) 100%); animation: sweep 7s ease-in-out infinite; }
  @keyframes sweep { 0%, 55% { left: -70%; } 100% { left: 110%; } }

  .hero.talk { background: #1b2350; color: #f4f1ea; box-shadow: 0 6px 0 #0c1130, 0 14px 24px rgba(0,0,0,0.14); }
  .hero.talk .lbl { color: #93a0d8; }
  .hero.talk .orb { position: absolute; border-radius: 50%; display: block; }
  .hero.talk .o1 { width: 130px; height: 130px; right: -20px; top: -30px; background: #2b3a86; animation: float1 16s ease-in-out infinite; }
  .hero.talk .o2 { width: 76px; height: 76px; right: 96px; top: 62px; background: #26306b; animation: float2 13s ease-in-out infinite; }
  .hero.talk .o3 { width: 40px; height: 40px; right: 176px; top: 26px; background: var(--blue); opacity: .5; animation: float1 19s ease-in-out infinite reverse; }
  @keyframes float1 { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-14px, 12px); } }
  @keyframes float2 { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(10px, -14px); } }
  @media (prefers-reduced-motion: reduce) { .hero * { animation: none !important; } }

  /* the now divider inside the flow list */
  .nowline { display: flex; align-items: center; gap: 10px; padding: 6px 16px; border-top: 1.5px solid var(--line); }
  .nowline span { flex: 1 1 0; height: 2px; border-radius: 1px; background: var(--line); }

  /* reminder strip, parked above the nav */
  #strip { position: fixed; left: 0; right: 0; bottom: calc(var(--barh) + var(--sab)); z-index: 21; display: none; gap: 8px; padding: 22px 12px 10px; overflow-x: auto; scrollbar-width: none; background: linear-gradient(180deg, rgba(233,231,226,0) 0%, var(--ground) 42%); }
  #strip::-webkit-scrollbar { display: none; }
  #strip.show { display: flex; }
  .rem { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px 0 8px; border-radius: 999px; background: var(--card); box-shadow: 0 1px 0 #fff inset, 0 4px 0 var(--edge); max-width: 74vw; transition: transform .08s, box-shadow .08s, opacity .2s; }
  .rem.add:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--edge); }
  .rem .tick { width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0; background: var(--ground); box-shadow: 0 2px 0 var(--edge) inset; display: flex; align-items: center; justify-content: center; }
  .rem .tick:active { background: var(--blue); box-shadow: 0 3px 0 var(--blue-deep) inset; }
  .rem .tick svg { width: 14px; height: 14px; stroke: var(--card); opacity: 0; }
  .rem .tick:active svg { opacity: 1; }
  .rem .rt { font-weight: 700; font-size: 14px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; padding: 8px 0; }
  .rem .rd { font-weight: 700; font-size: 11px; color: var(--blue); flex-shrink: 0; }
  .rem.add { background: transparent; box-shadow: 0 0 0 2px var(--edge) inset; }
  .rem.add .rt { color: var(--mute); }
  .rem.going { opacity: 0; transform: scale(.9); }
  .has-strip .page { padding-bottom: calc(var(--barh) + var(--sab) + 76px); }

  /* mic */

/*
 * The flow: the last couple of things you finished, then the next few coming

 * checkbox, so an item you do early gets ticked without leaving the page, and

const PREP = [[/gym|basketball|workout/i, 30], [/walk/i, 10]];
function prepFor(name) { for (const [re, m] of PREP) if (re.test(name)) return m; return 0; }

  const prepTxt = prep ? ` · get ready ${prepAt - nm > 0 && !isTomorrow ? 'in ' + relTime(prepAt - nm).replace('in ', '') + ', at' : 'at'} ${t12s(hhmmOf(prepAt))}` : '';

function renderFlow(day, nm) {
  const tag = (d, kind, off) => d[kind === 'meal' ? 'meals' : 'tasks'].map((x) => ({ ...x, kind, at: x.time ? minutes(x.time) + off : null }));
  const all = [...tag(day, 'task', 0), ...tag(day, 'meal', 0)];

  const done = all.filter((x) => x.done && x.doneAt).sort((a, b) => a.doneAt.localeCompare(b.doneAt)).slice(-2);
  let next = all.filter((x) => !x.done && !x.moved && !x.skipped && x.at != null && x.at >= nm - 20).sort((a, b) => a.at - b.at);
  let label = 'Coming up';
  if (next.length < 3) {
    // Peek at tomorrow without creating it: a day built now would freeze
    // against any routine or plan change made later today.
    const d = addDays(ymd(), 1);
    const tm = S.days[d] || previewDay(d);
    const tomorrow = [...tag(tm, 'task', 24 * 60), ...tag(tm, 'meal', 24 * 60)]
      .filter((x) => !x.done && !x.moved && !x.skipped && x.at != null).sort((a, b) => a.at - b.at).slice(0, 3 - next.length);
    if (tomorrow.length) { next = [...next, ...tomorrow]; if (!next.some((x) => x.at < 24 * 60)) label = 'Tomorrow'; }
  }
  next = next.slice(0, 3);
  if (!done.length && !next.length) return '';

  const nowLine = done.length && next.length
    ? `<div class="nowline"><span></span><div class="lbl" style="color:#2b5cff">${label}</div><span></span></div>`
    : '';
  const head = done.length ? 'Just done' : label;
  return `<div class="lbl grp-lbl" style="margin-bottom:8px">${head}</div><div class="card list">${done.map((x) => flowRow(x, nm)).join('')}${nowLine}${next.map((x) => flowRow(x, nm)).join('')}</div>`;
}

/*
 * Small charts drawn in place, same hand as the weight line. Bars for
 * counts (steps, calories), a line for a level (resting heart rate).
 */
function chart(points, opts = {}) {
  const pts = [...points].sort((a, b) => a.date.localeCompare(b.date)).slice(-(opts.max || 14));
  if (!pts.length) return `<div class="s">Nothing here yet.</div>`;
  const W = 330, H = 90, top = 8, bottom = 70;
  const vals = pts.map((p) => p.value);
  const lo = opts.zero ? 0 : Math.min(...vals), hi = Math.max(...vals);
  const span = Math.max(1, hi - lo);
  const y = (v) => bottom - ((bottom - top) * (v - lo)) / span;
  const lab = (p) => { const d = fromYmd(p.date); return p.period === 'month' ? MO[d.getMonth()] : `${MO[d.getMonth()]} ${d.getDate()}`; };
  let body = '';
  if (opts.type === 'line') {
    const xs = pts.map((p, i) => [pts.length > 1 ? (W * i) / (pts.length - 1) : W / 2, y(p.value)]);
    body = `<polyline points="${xs.map((q) => q.join(',')).join(' ')}" fill="none" stroke="#1d1d1f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"></polyline>${xs.map((q, i) => `<circle cx="${q[0]}" cy="${q[1]}" r="${i === xs.length - 1 ? 5 : 3.5}" fill="${i === xs.length - 1 ? '#2b5cff' : '#1d1d1f'}"></circle>`).join('')}`;
  } else {
    const bw = Math.min(22, (W / pts.length) * 0.62);
    body = pts.map((p, i) => { const x = (W * (i + 0.5)) / pts.length - bw / 2; const yy = y(p.value); return `<rect x="${x}" y="${yy}" width="${bw}" height="${bottom - yy}" rx="${bw / 2}" fill="${i === pts.length - 1 ? '#2b5cff' : '#1d1d1f'}"></rect>`; }).join('');
    if (opts.goal != null && opts.goal >= lo && opts.goal <= hi) body += `<line x1="0" y1="${y(opts.goal)}" x2="${W}" y2="${y(opts.goal)}" stroke="#2b5cff" stroke-width="1.5" stroke-dasharray="4 4"></line>`;
  }
  const grid = [top, (top + bottom) / 2, bottom].map((g) => `<line x1="0" y1="${g}" x2="${W}" y2="${g}" stroke="#e6e3dc" stroke-width="1.5"></line>`).join('');
  const first = pts[0], last = pts[pts.length - 1];
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px;display:block" preserveAspectRatio="none">${grid}${body}</svg><div style="display:flex;justify-content:space-between"><div class="s">${lab(first)} · ${opts.fmt ? opts.fmt(first.value) : first.value}</div><div class="s">${lab(last)} · ${opts.fmt ? opts.fmt(last.value) : last.value}</div></div>`;
}
function renderTrends() {
  const fit = S.fit || FIT_SEED();
  const k = (v) => v.toLocaleString();
  const stepsAvg = fit.steps.length ? Math.round(fit.steps.slice(-4).reduce((a, p) => a + p.value, 0) / Math.min(4, fit.steps.length)) : null;
  const rhrLast = fit.rhr.length ? [...fit.rhr].sort((a, b) => a.date.localeCompare(b.date)).pop().value : null;
  const enLast = fit.energy.length ? [...fit.energy].sort((a, b) => a.date.localeCompare(b.date)).pop().value : null;
  let html = '';
  html += `<div class="card" style="padding:14px 16px 12px;display:flex;flex-direction:column;gap:8px"><div style="display:flex;justify-content:space-between;align-items:flex-end"><div><div class="lbl">Steps · weekly</div><div style="display:flex;align-items:baseline;gap:6px"><div class="big" style="font-size:32px">${stepsAvg != null ? k(stepsAvg) : '--'}</div><div class="s">a day, last 4 weeks</div></div></div><div class="s" style="text-align:right">${esc(fit.notes?.steps || '')}</div></div>${chart(fit.steps, { type: 'bar', zero: true, max: 13, goal: S.settings.stepGoal, fmt: k })}</div>`;
  html += `<div class="card" style="padding:14px 16px 12px;display:flex;flex-direction:column;gap:8px"><div style="display:flex;justify-content:space-between;align-items:flex-end"><div><div class="lbl">Resting heart rate</div><div style="display:flex;align-items:baseline;gap:6px"><div class="big" style="font-size:32px">${rhrLast ?? '--'}</div><div class="s">bpm this month</div></div></div><div class="s" style="text-align:right">${esc(fit.notes?.rhr || '')}</div></div>${chart(fit.rhr, { type: 'line', max: 12 })}</div>`;
  html += `<div class="card" style="padding:14px 16px 12px;display:flex;flex-direction:column;gap:8px"><div style="display:flex;justify-content:space-between;align-items:flex-end"><div><div class="lbl">Energy burned · weekly</div><div style="display:flex;align-items:baseline;gap:6px"><div class="big" style="font-size:32px">${enLast != null ? k(enLast) : '--'}</div><div class="s">cal a day</div></div></div><div class="s" style="text-align:right">${esc(fit.notes?.energy || '')}</div></div>${chart(fit.energy, { type: 'bar', zero: true, max: 12, fmt: k })}</div>`;
  html += `<button class="btn wide" data-act="fit-shot">${ICON_CAM} Read a Fitbit screenshot</button>`;
  html += `<div class="s" style="padding:0 6px">Screenshot any Fitbit page (steps, weight, resting heart rate, energy) and the numbers land here. The live Fitbit link comes next and replaces this.</div>`;
  return html;
}

/* The weight line, drawn faintly across the Body hero. */
function paintTrendHero(ws) {
  const el = $('#body-trend');
  const pts = ws.slice(-24);
  if (pts.length < 2) { el.innerHTML = ''; return; }
  // Kept to the top third so it never runs through the words.
  const W = 390, top = 26, bottom = 92;
  const lo = Math.min(...pts.map((p) => p.lb)), hi = Math.max(...pts.map((p) => p.lb));
  const span = Math.max(0.5, hi - lo);
  const xy = pts.map((p, i) => [8 + ((W - 16) * i) / (pts.length - 1), bottom - ((bottom - top) * (p.lb - lo)) / span]);
  const d = xy.map((q) => `${q[0].toFixed(1)},${q[1].toFixed(1)}`).join(' ');
  let len = 0;
  for (let i = 1; i < xy.length; i++) len += Math.hypot(xy[i][0] - xy[i - 1][0], xy[i][1] - xy[i - 1][1]);
  const last = xy[xy.length - 1];
  el.innerHTML = `<line x1="0" y1="${top}" x2="${W}" y2="${top}"></line><line x1="0" y1="${(top + bottom) / 2}" x2="${W}" y2="${(top + bottom) / 2}"></line><line x1="0" y1="${bottom}" x2="${W}" y2="${bottom}"></line>`
    + `<polyline points="${d}" style="--len:${Math.ceil(len)};stroke-dasharray:${Math.ceil(len)}"></polyline>`
    + `<circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="5" style="transform-origin:${last[0].toFixed(1)}px ${last[1].toFixed(1)}px"></circle>`;
}

function renderBoard() {
  const day = today();
  const items = dayItems(day).filter((x) => !x.skipped);
  const done = items.filter((x) => x.done).length;
  $('#hit-count').innerHTML = `${done}<span>/${items.length}</span>`;
  // One block per thing on today's board, lighting up as they land.
  $('#board-blocks').innerHTML = [...items.map((x) => x.done), day.water >= S.settings.waterGoal].map((on) => `<i class="${on ? 'on' : ''}"></i>`).join('');
  const sec = ui.section.board;
  let html = '';
  const all = [...day.meals.map((m) => ({ ...m, kind: 'meal' })), ...day.tasks.map((t) => ({ ...t, kind: 'task' }))];
  if (sec === 'today') {
    const bucket = (x) => { const t = x.time ? minutes(x.time) : 12 * 60; return t < 12 * 60 ? 'Morning' : t < 17 * 60 ? 'Afternoon' : 'Evening'; };
    const groups = { Morning: [], Afternoon: [], Evening: [] };
    all.filter((x) => !x.moved && !x.skipped).forEach((x) => groups[bucket(x)].push(x));
    for (const g of Object.keys(groups)) {
      if (!groups[g].length) continue;
      groups[g].sort((a, b) => minutes(a.time || '12:00') - minutes(b.time || '12:00'));
      html += `<div class="lbl grp-lbl">${g}</div><div class="card list">${groups[g].map((x) => rowHTML(x, x.kind)).join('')}</div>`;
    }
    html += `<div class="card list">${waterRow(day)}</div>`;
    html += `<div class="chips"><button class="pill" data-act="add-task">+ Add a task</button><button class="pill" data-act="edit-routine">Edit the routine</button></div>`;
  } else if (sec === 'week') {
    html += renderWeek();
  } else if (sec === 'done') {
    const d = all.filter((x) => x.done).sort((a, b) => (a.doneAt || '').localeCompare(b.doneAt || ''));
    html += d.length ? `<div class="card list">${d.map((x) => rowHTML(x, x.kind)).join('')}</div>` : `<div class="card" style="padding:18px"><div class="t">Nothing checked off yet.</div><div class="s" style="margin-top:4px">Tap a circle or just tell me.</div></div>`;
  } else {
    const mv = [...day.tasks.filter((t) => t.moved || t.skipped)];
    const later = Object.keys(S.days).filter((d) => d > ymd()).sort().flatMap((d) => S.days[d].tasks.filter((t) => t.movedFrom === ymd() || d <= addDays(ymd(), 7)).map((t) => ({ ...t, date: d })));
    html += mv.length ? `<div class="lbl grp-lbl">Off today's board</div><div class="card list">${mv.map((x) => rowHTML(x, 'task')).join('')}</div>` : '';
    html += later.length ? `<div class="lbl grp-lbl">Coming up</div><div class="card list">${later.map((x) => `<div class="row" data-id="${x.id}"><div class="chk">${ICON_MOVE}</div><div class="txt"><div class="t">${esc(x.name)}</div><div class="s">${niceDate(x.date)}${x.time ? ' · ' + t12(x.time) : ''}${x.movedFrom ? ' · moved from ' + niceDate(x.movedFrom) : ''}</div></div></div>`).join('')}</div>` : '';
    if (!mv.length && !later.length) html += `<div class="card" style="padding:18px"><div class="t">Nothing moved.</div><div class="s" style="margin-top:4px">"Push the gym to tomorrow" lands here.</div></div>`;
  }
  $('#board-body').innerHTML = html;
}

/*
 * The week: Monday to Sunday, the routine for each day with what actually
 * happened. Days already in the log show their real items (moved, done,
 * added by voice); days not yet opened show the routine as planned.
 */
function renderWeek() {
  const t = ymd();
  const dow = fromYmd(t).getDay();
  const monday = addDays(t, -((dow + 6) % 7));
  let html = '';
  let hit = 0, total = 0;
  const cards = [];
  for (let i = 0; i < 7; i++) {
    const d = addDays(monday, i);
    const wd = WD[fromYmd(d).getDay()];
    const stored = S.days[d];
    const items = stored ? stored.tasks.filter((x) => !x.moved) : (S.routine[wd] || []).map((x, k) => ({ id: `plan-${d}-${k}`, name: x.name, time: x.time, end: x.end || null, done: false, planned: true }));
    const isToday = d === t, past = d < t;
    items.forEach((x) => { if (!x.skipped) { total++; if (x.done) hit++; } });
    const rows = items.length
      ? items.map((x) => {
          const tag = x.done ? '<div class="stamp">DONE</div>' : x.skipped ? '<div class="stamp" style="border-color:#6d6a63;color:#6d6a63;box-shadow:0 2px 0 #cfccc4">SKIP</div>' : past && !x.planned ? '<div class="stamp" style="border-color:#b8321f;color:#b8321f;box-shadow:0 2px 0 #f0c4bc">MISSED</div>' : x.time ? `<div class="time" style="${!isToday ? 'color:#6d6a63' : ''}">${t12s(x.time)}</div>` : '';
          const chk = d > t ? `<div class="chk" style="box-shadow:none;border-style:dashed"></div>` : `<button class="chk" data-act="toggle-day" data-date="${d}" data-id="${x.id}">${ICON_CHECK}</button>`;
          return `<div class="row${x.done ? ' done' : ''}${x.skipped ? ' moved' : ''}" data-id="${x.id}">${chk}<div class="txt"><div class="t">${esc(x.name)}</div><div class="s">${x.done && x.doneAt ? 'Done ' + t12s(x.doneAt) : x.time ? spanTxt(x) : 'No time set'}</div></div>${tag}</div>`;
        }).join('')
      : `<div class="row"><div class="txt"><div class="s">Rest day</div></div></div>`;
    cards.push(`<div class="lbl grp-lbl" style="${isToday ? 'color:#2b5cff' : ''}">${WDL[fromYmd(d).getDay()]}${isToday ? ' · today' : ''} · ${MO[fromYmd(d).getMonth()]} ${fromYmd(d).getDate()}</div><div class="card list"${isToday ? ' style="box-shadow:0 0 0 2.5px #2b5cff, 0 6px 0 #cfccc4"' : ''}>${rows}</div>`);
  }
  html += `<div class="card" style="padding:14px 16px;display:flex;align-items:center;justify-content:space-between"><div><div class="lbl">This week</div><div class="big" style="font-size:28px;margin-top:4px">${hit}<span style="color:#6d6a63">/${total}</span></div></div><div style="display:flex;gap:4px">${Array.from({ length: 7 }, (_, i) => { const d = addDays(monday, i); const st = S.days[d]; const items = st ? st.tasks.filter((x) => !x.moved && !x.skipped) : []; const all = items.length && items.every((x) => x.done); const some = items.some((x) => x.done); return `<div style="width:12px;height:28px;border-radius:3px;background:${all ? '#2b5cff' : some ? '#9db3ff' : d === t ? '#1d1d1f' : 'rgba(29,29,31,0.15)'}"></div>`; }).join('')}</div></div>`;
  html += cards.join('');
  html += `<div class="chips"><button class="pill" data-act="edit-routine">Edit the routine</button></div>`;
  return html;
}
/*

    const dates = Object.keys(S.days).filter((d) => d < ymd()).sort().reverse().slice(0, 30);

  }

  if (sec === 'backlog') html += pushCard() + `<div class="s" style="text-align:center;padding:8px 0 0;color:#a8a49c">Daily Board ${APP_VERSION} · plan v${S.planVersion} · sync ${sync.status}</div>`;

}
function dayCard(date, day) {

}

function toast({ t, s, cls = '', undo: canUndo = false, ms = 3600 }) {
  const el = document.createElement('div');
  el.className = `toast ${cls}`;
  el.innerHTML = `<div class="txt"><div class="t">${esc(t)}</div>${s ? `<div class="s">${esc(s)}</div>` : ''}</div>${canUndo ? '<button class="undo">Undo</button>' : ''}`;
  if (canUndo) el.querySelector('.undo').addEventListener('click', () => { undo(); kill(); });
  $('#toasts').appendChild(el);
  const kill = () => { el.classList.add('out'); setTimeout(() => el.remove(), 260); };
  el.addEventListener('click', (e) => { if (!e.target.closest('.undo')) kill(); });

function profileForBrain() { const p = S.settings.profile || {}; return { height_in: S.settings.heightIn, weight_lb: (S.weights.slice().sort((a, b) => a.date.localeCompare(b.date)).pop() || {}).lb, age: p.age, sex: p.sex, ethnicity: p.ethnicity, lives_in: S.settings.place.name }; }
function chatHistoryForBrain() { return (S.chat || []).slice(-12).map((m) => ({ role: m.role, text: m.text.slice(0, 600) })); }
function applyOps(ops, say, said) {
  const answers = ops.filter((o) => o.op === 'answer').map((o) => String(o.text || ''));
  const doing = ops.filter((o) => o.op !== 'answer');
  const lines = [];
  if (doing.length) {
    snapshot(say || 'Voice change');
    for (const op of doing) {
      try {
        const r = applyOp(op);
        if (r) lines.push(r);
      } catch (err) { lines.push(`Could not do one: ${err.message}`); }
    }
  }
  if (said) addChat('user', said);
  addChat('assistant', [say, ...answers].filter(Boolean).join('\n\n') || (lines.length ? 'Done.' : 'Heard you, nothing to change.'), lines);
  save();
  if (answers.length) toast({ t: say || 'Answered', s: answers[0].slice(0, 140) + (answers[0].length > 140 ? '... (full answer in Chat)' : ''), cls: 'blue', ms: 9000 });
  else if (doing.length) toast({ t: say || 'Done.', s: lines.join(' · '), cls: 'blue', undo: true, ms: 6500 });
  else toast({ t: say || 'Heard you, nothing to change.', ms: 3000 });
  if (doing.length) buzz([15, 30, 15]);
  if (dayComplete(today())) celebrate();
}
function applyOp(op) {
  const t = ymd();
  const target = op.target === 'meal' ? 'meal' : 'task';
  switch (op.op) {
    case 'complete': case 'uncomplete': {
      const f = findItem(target, op.id); if (!f) throw new Error('no such item');
      f.it.done = op.op === 'complete'; f.it.doneAt = f.it.done ? nowHM() : null; f.it.skipped = null;
      return `${f.it.done ? 'Done' : 'Unchecked'}: ${f.it.name}`;
    }
    case 'skip': {
      const f = findItem(target, op.id); if (!f) throw new Error('no such item');
      f.it.skipped = { reason: op.reason || '' }; f.it.done = false;
      return `Skipped ${f.it.name}`;
    }
    case 'move': {
      const f = findItem(target, op.id); if (!f) throw new Error('no such item');
      const to = /^\d{4}-\d{2}-\d{2}$/.test(op.toDate || '') ? op.toDate : addDays(t, 1);
      const dest = ensureDay(to);
      if (target === 'task') {
        f.it.moved = to;
        dest.tasks.push({ id: uid(`${to}-t`), name: f.it.name, time: op.time || f.it.time || null, done: false, doneAt: null, moved: null, skipped: null, movedFrom: f.date });
      } else {
        f.list.splice(f.list.indexOf(f.it), 1);
        dest.meals.push({ ...f.it, id: uid(`${to}-m`), done: false, doneAt: null, time: op.time || f.it.time });
      }
      return `${f.it.name} moved to ${niceDate(to)}`;
    }
    case 'reschedule': {
      const f = findItem(target, op.id); if (!f) throw new Error('no such item');
      const from = f.it.time; f.it.time = op.time;
      return `${f.it.name} ${from ? t12s(from) + ' to ' : 'at '}${t12s(op.time)}`;
    }
    case 'swap_meal': {
      const f = findItem('meal', op.id); if (!f) throw new Error('no such meal');
      f.it.swapped = true; f.it.name = op.name; f.it.done = true; f.it.doneAt = nowHM();
      ['cal', 'protein', 'carbs', 'fat'].forEach((k) => { if (op[k] != null) f.it[k] = Math.round(op[k]); });
      return `${f.it.slot}: ${op.name}`;
    }
    case 'log_food': {
      today().extras.push({ id: uid('x'), slot: op.slot || 'Extra', name: op.name, cal: Math.round(op.cal || 0), protein: Math.round(op.protein || 0), carbs: Math.round(op.carbs || 0), fat: Math.round(op.fat || 0), micros: op.micros || null, at: nowHM() });
      return `Logged ${op.name}`;
    }
    case 'add_task': {
      const d = /^\d{4}-\d{2}-\d{2}$/.test(op.date || '') ? op.date : t;
      ensureDay(d).tasks.push({ id: uid(`${d}-t`), name: op.name, time: op.time || null, done: false, doneAt: null, moved: null, skipped: null });
      return `Added ${op.name}${d !== t ? ' on ' + niceDate(d) : ''}`;
    }
    case 'add_meal': {
      const d = /^\d{4}-\d{2}-\d{2}$/.test(op.date || '') ? op.date : t;
      ensureDay(d).meals.push({ id: uid(`${d}-m`), slot: op.slot || 'Meal', name: op.name, time: op.time || null, cal: Math.round(op.cal || 0), protein: Math.round(op.protein || 0), carbs: Math.round(op.carbs || 0), fat: Math.round(op.fat || 0), done: false, doneAt: null, swapped: false, planned: op.name });
      return `Added ${op.slot || 'meal'}: ${op.name}`;
    }
    case 'remove': {
      const f = findItem(target, op.id); if (!f) throw new Error('no such item');
      f.list.splice(f.list.indexOf(f.it), 1);
      return `Removed ${f.it.name}`;
    }
    case 'water': { today().water = Math.max(0, Math.round(op.count)); return `Water ${today().water} of ${S.settings.waterGoal}`; }
    case 'log_weight': {
      const d = /^\d{4}-\d{2}-\d{2}$/.test(op.date || '') ? op.date : t;
      S.weights = S.weights.filter((w) => w.date !== d); S.weights.push({ date: d, lb: Number(op.lb) });
      ensureDay(d).weight = Number(op.lb);
      return `Weight ${op.lb} lb`;
    }
    case 'note': {
      S.notes = S.notes || [];
      const text = String(op.text || '').trim();
      S.notes.push({ id: uid('n'), title: (op.title || autoTitle(text)).trim().slice(0, 70), text, bucket: (op.bucket || 'Random').trim().slice(0, 20), date: t, at: nowHM() });
      if (S.notes.length > 500) S.notes = S.notes.slice(-500);
      return `Noted under ${op.bucket || 'Random'}`;
    }
    case 'add_reminder': {
      S.reminders = S.reminders || [];
      S.reminders.push({ id: uid('r'), text: op.text, date: t, at: nowHM(), done: false });
      return `Reminder: ${op.text}`;
    }
    case 'done_reminder': {
      const r = (S.reminders || []).find((x) => !x.done && (x.id === op.id || (op.text && x.text.toLowerCase().includes(String(op.text).toLowerCase()))));
      if (!r) throw new Error('no such reminder');
      r.done = true; r.doneAt = nowHM();
      return `Off the list: ${r.text}`;
    }
    case 'log_steps': { S.steps = { today: Math.max(0, Math.round(op.steps)), date: t }; return `Steps ${S.steps.today.toLocaleString()}`; }
    case 'answer': { return null; }
    default: throw new Error(`unknown op ${op.op}`);
  }
}

/* ---------- voice ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
const voice = { rec: null, mode: 'command', text: '', on: false, busy: false, onDone: null };
const mic = $('#mic'), live = $('#live'), liveText = $('#live-text'), micLab = $('#mic-lab');

function setMic(state, label) {
  mic.classList.toggle('open', state !== 'idle');
  mic.classList.toggle('listening', state === 'listening');
  mic.classList.toggle('busy', state === 'busy');
  micLab.textContent = label || (state === 'listening' ? 'Listening · tap when done' : state === 'busy' ? 'Working on it' : '');
}
function startListening(mode = 'command', onDone = null) {
  if (voice.busy) return;
  if (!SR) { openTyped(mode, onDone); return; }
  if (voice.on) { stopListening(); return; }
  voice.mode = mode; voice.text = ''; voice.onDone = onDone; voice.on = true;
  const r = new SR();
  r.lang = 'en-CA'; r.continuous = true; r.interimResults = true;
  let finals = '';
  r.onresult = (e) => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) { const res = e.results[i]; if (res.isFinal) finals += res[0].transcript + ' '; else interim += res[0].transcript; }
    voice.text = (finals + interim).trim();
    liveText.textContent = voice.text || '...';
  };
  r.onerror = (e) => { if (e.error === 'not-allowed' || e.error === 'service-not-allowed') { voice.on = false; setMic('idle'); live.classList.remove('show'); toast({ t: 'Mic is blocked', s: 'Allow the microphone for this site, or type it instead', cls: 'red' }); openTyped(mode, onDone); } };
  r.onend = () => { if (voice.on) finishListening(); };
  voice.rec = r;
  try { r.start(); } catch { voice.on = false; openTyped(mode, onDone); return; }
  liveText.textContent = '...';
  live.classList.add('show');
  setMic('listening', mode === 'wrap' ? 'Listening · wrap it up' : mode === 'food' ? 'Listening · what did you eat' : 'Listening · tap when done');
  buzz([8]);
}
function stopListening() { if (voice.rec) { try { voice.rec.stop(); } catch {} } }
async function finishListening() {
  voice.on = false;
  const text = voice.text.trim();
  live.classList.remove('show');
  if (!text) { setMic('idle'); toast({ t: 'Did not catch that', ms: 1800 }); return; }
  await handleSpeech(voice.mode, text, voice.onDone);
}
async function handleSpeech(mode, text, onDone) {
  if (onDone) { setMic('idle'); onDone(text); return; }
  voice.busy = true; setMic('busy', 'Working on it');
  try {
    if (mode === 'wrap') {
      const r = await brain({ mode: 'wrap', transcript: text, now: `${ymd()} ${nowHM()}`, score: dayScore(today()) });
      const d = today();
      snapshot('Wrap');
      if (d.wrap) { d.wrap.lines = [...d.wrap.lines, ...(r.wrap.lines || [])]; if (r.wrap.title) d.wrap.title = r.wrap.title; }
      else d.wrap = { title: r.wrap.title || '', lines: r.wrap.lines || [text], mood: r.wrap.mood || '', at: nowHM(), raw: text };
      save();
      toast({ t: 'Filed under today', s: r.wrap.title || '', cls: 'blue', undo: true });
    } else {
      const now = new Date();
      const r = await brain({ mode: 'command', transcript: text, now: `${ymd()} ${nowHM()}`, weekday: WDL[now.getDay()], tomorrow: addDays(ymd(), 1), state: stateForBrain(), profile: profileForBrain(), goals: S.settings.goalText, history: chatHistoryForBrain() });
      applyOps(Array.isArray(r.ops) ? r.ops : [], r.say, text);
    }
  } catch (err) {
    toast({ t: 'The brain did not answer', s: err.message, cls: 'red', ms: 6000 });
    if (mode !== 'wrap') { addChat('user', text); addChat('assistant', `Could not answer: ${err.message}`); save(); }
  } finally { voice.busy = false; setMic('idle'); }
}

/* ---------- the week: the pattern the daily review cannot see ---------- */
function weekKey(d = ymd()) { return addDays(d, -((fromYmd(d).getDay() + 6) % 7)); }
function weekForBrain() {
  const mon = weekKey();
  const fit = S.fit || {};
  const lastOf = (a) => (a && a.length ? [...a].sort((x, y) => x.date.localeCompare(y.date)).pop() : null);
  const days = [];
  for (let i = 0; i < 7; i++) {
    const d = addDays(mon, i);
    const day = S.days[d];
    if (!day || d > ymd()) continue;
    const m = macrosToday(day);
    days.push({
      date: d, weekday: WDL[fromYmd(d).getDay()], score: dayScore(day),
      eaten: { cal: m.cal, protein: m.protein, carbs: m.carbs, fat: m.fat, sodium_mg: Math.round(m.micros.sodium_mg || 0), potassium_mg: Math.round(m.micros.potassium_mg || 0) },
      meals_done: `${day.meals.filter((x) => x.done).length} of ${day.meals.length}`,
      tasks: day.tasks.map((x) => `${x.name}${x.done ? ' (done)' : x.moved ? ' (moved)' : x.skipped ? ' (skipped)' : ' (missed)'}`),
      steps: S.steps.date === d ? S.steps.today : null,
      water: day.water, wrap: day.wrap ? day.wrap.lines : null
    });
  }
  const ws = [...S.weights].sort((a, b) => a.date.localeCompare(b.date));
  return {
    week_of: mon, days_so_far: days.length, days,
    goals: { cal: S.settings.calGoal, protein: S.settings.proteinGoal, carbs: S.settings.carbGoal, fat: S.settings.fatGoal, steps: S.settings.stepGoal, weight: S.settings.weightGoal, weight_by: S.settings.weightGoalDate },
    weights_recent: ws.slice(-8), trend: projection(), streak: streakInfo().n,
    resting_hr: lastOf(fit.rhr), energy_burned_avg: lastOf(fit.energy)
  };
}

/* ---------- two Sundays, side by side ---------- */
const compare = { a: null, b: null };
function openCompare() {
  const ps = [...S.photos].sort((x, y) => x.date.localeCompare(y.date));
  if (ps.length < 2) { toast({ t: 'Need two sets of photos', s: 'Add another Sunday and they can go side by side', ms: 4000 }); return; }
  compare.a = compare.a && ps.some((p) => p.date === compare.a) ? compare.a : ps[0].date;
  compare.b = compare.b && ps.some((p) => p.date === compare.b) ? compare.b : ps[ps.length - 1].date;
  renderCompare();
}
function renderCompare() {
  const ps = [...S.photos].sort((x, y) => x.date.localeCompare(y.date));
  const A = ps.find((p) => p.date === compare.a), B = ps.find((p) => p.date === compare.b);
  const wAt = (d) => { const w = [...S.weights].sort((x, y) => x.date.localeCompare(y.date)).filter((x) => x.date <= d).pop(); return w ? w.lb : null; };
  const wa = wAt(A.date), wb = wAt(B.date);
  const dBf = B.est.mid - A.est.mid, dW = wa != null && wb != null ? wb - wa : null;
  const gap = Math.round((fromYmd(B.date) - fromYmd(A.date)) / 86400000);
  const pane = (p, w) => `<div style="flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:8px">
      <div class="card" style="aspect-ratio:3/4;overflow:hidden;background:#d6d2c8;position:relative">${p.thumbs[0] ? `<img src="${p.thumbs[0]}" alt="" style="width:100%;height:100%;object-fit:cover">` : ''}<div style="position:absolute;left:8px;bottom:8px;padding:4px 8px;border-radius:6px;background:#1d1d1f;color:#fbfaf7;font-weight:700;font-size:11px">${niceDate(p.date)}</div></div>
      <div style="text-align:center"><div class="big" style="font-size:26px">${p.est.mid}<span style="font-size:15px">%</span></div><div class="s">${w != null ? w + ' lb' : 'no weigh-in'}</div></div>
    </div>`;
  const pick = (which, sel) => `<select data-cmp="${which}" style="flex:1 1 0;min-width:0;height:44px;border-radius:14px;border:1.5px solid var(--edge);background:var(--card);padding:0 12px;font-weight:700;font-size:14px;color:var(--ink);box-shadow:0 2px 0 var(--edge) inset;outline:none">${ps.map((p) => `<option value="${p.date}"${p.date === sel ? ' selected' : ''}>${niceDate(p.date)} · ${p.est.mid}%</option>`).join('')}</select>`;
  const arrow = (v, unit, goodDown = true) => {
    if (v == null) return '<span class="s">no reading</span>';
    const good = goodDown ? v < 0 : v > 0;
    return `<span style="color:${v === 0 ? '#67645d' : good ? '#2b5cff' : '#b8321f'};font-weight:800">${v > 0 ? '+' : ''}${unit === '%' ? v : v.toFixed(1)}${unit}</span>`;
  };
  openSheet('Body', `${gap} day${gap === 1 ? '' : 's'} apart`, `
    <div style="display:flex;gap:10px">${pane(A, wa)}${pane(B, wb)}</div>
    <div style="display:flex;gap:10px">${pick('a', compare.a)}${pick('b', compare.b)}</div>
    <div class="card" style="padding:14px 16px;display:flex;justify-content:space-between">
      <div><div class="lbl">Body fat</div><div class="big" style="font-size:24px;margin-top:4px">${arrow(dBf, '%')}</div></div>
      <div><div class="lbl">Weight</div><div class="big" style="font-size:24px;margin-top:4px">${arrow(dW, ' lb')}</div></div>
      <div><div class="lbl">Between</div><div class="big" style="font-size:24px;margin-top:4px">${gap}d</div></div>
    </div>
    <div class="s" style="padding:0 6px">Photo estimates carry a few points of error each, so read the gap between them, not either number on its own.</div>`);
}

async function readFood(words, fixing) {
  renderFood(food.img ? 'snap' : 'talk', true);
  try {
    const prev = fixing && food.result ? `Previous read: ${JSON.stringify(food.result)}. Correction: ` : '';
    const r = await brain({ mode: 'food', transcript: prev + (words || ''), images: food.img ? [food.img] : [] });
    food.result = r.food;
    renderFood(food.img ? 'snap' : 'talk');
  } catch (err) { closeSheet(); toast({ t: 'Could not read that', s: err.message, cls: 'red', ms: 6000 }); }
}
function commitFood(replace) {
  const r = food.result; if (!r) return;
  snapshot(`Food: ${r.name}`);
  const item = { name: r.name, cal: Math.round(r.cal || 0), protein: Math.round(r.protein || 0), carbs: Math.round(r.carbs || 0), fat: Math.round(r.fat || 0), micros: r.micros || null };
  if (replace) {
    const m = today().meals.find((x) => x.slot === food.slot && !x.done);
    if (m) { Object.assign(m, item, { swapped: true, done: true, doneAt: nowHM() }); }
  } else today().extras.push({ ...item, id: uid('x'), slot: food.slot, at: nowHM() });
  if (food.saveAsMeal) S.library.push({ ...item, id: uid('f') });
  save(); closeSheet();
  toast({ t: `${replace ? 'Swapped in' : 'Logged'} ${r.name}`, s: `${item.cal} cal · ${item.protein}g protein${food.saveAsMeal ? ' · saved' : ''}`, cls: 'blue', undo: true });
  buzz([15]);
}
function shrink(file, max, q) {
  return new Promise((res, rej) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', q));
    };
    img.onerror = rej; img.src = url;
  });
}

/* Fitbit screenshots: the brain reads the numbers, this files them. */
$('#file-fit').addEventListener('change', async (e) => {
  const files = Array.from(e.target.files).slice(0, 4); e.target.value = '';
  if (!files.length) return;
  toast({ t: `Reading ${files.length > 1 ? files.length + ' screenshots' : 'the screenshot'}`, ms: 4000 });
  let filed = [];
  for (const f of files) {
    try {
      const img = await shrink(f, 1200, 0.85);
      const r = await brain({ mode: 'fitbit', images: [img], now: `${ymd()} ${nowHM()}` });
      filed.push(applyFit(r.fit));
    } catch (err) { toast({ t: 'Could not read one', s: err.message, cls: 'red', ms: 6000 }); }
  }
  if (filed.length) { ui.section.body = 'trends'; save(); toast({ t: 'Filed', s: filed.filter(Boolean).join(' · '), cls: 'blue', ms: 7000 }); }
});
function applyFit(fit) {
  if (!fit || !fit.metric) return null;
  snapshot('Fitbit screenshot');
  S.fit = S.fit || FIT_SEED();
  const entries = (fit.entries || []).filter((x) => /^\d{4}-\d{2}-\d{2}$/.test(x.date || '') && typeof x.value === 'number');
  const merge = (list, es) => { for (const x of es) { const i = list.findIndex((y) => y.date === x.date && y.period === x.period); const row = { date: x.date, value: Math.round(x.value), period: x.period || 'day' }; if (i >= 0) list[i] = row; else list.push(row); } };
  const t = ymd();
  let what = '';
  switch (fit.metric) {
    case 'steps':
      merge(S.fit.steps, entries.filter((x) => x.period !== 'day'));
      if (fit.today != null) S.steps = { today: Math.round(fit.today), date: t };
      if (fit.headline?.label) S.fit.notes.steps = `${fit.headline.label}: ${Math.round(fit.headline.value).toLocaleString()}`;
      what = `steps${fit.today != null ? ' · today ' + Math.round(fit.today).toLocaleString() : ''} · ${entries.length} entries`;
      break;
    case 'weight': {
      const lbs = entries.map((x) => ({ date: x.date, lb: fit.unit === 'kg' ? Math.round(x.value * 2.2046 * 10) / 10 : Math.round(x.value * 10) / 10 }));
      for (const w of lbs) { S.weights = S.weights.filter((y) => y.date !== w.date); S.weights.push(w); }
      if (fit.today != null) { S.weights = S.weights.filter((y) => y.date !== t); S.weights.push({ date: t, lb: fit.unit === 'kg' ? Math.round(fit.today * 2.2046 * 10) / 10 : fit.today }); }
      what = `weight · ${lbs.length + (fit.today != null ? 1 : 0)} entries`;
      break;
    }
    case 'resting_hr':
      merge(S.fit.rhr, entries);
      if (fit.headline?.label) S.fit.notes.rhr = `${fit.headline.label}: ${Math.round(fit.headline.value)} bpm`;
      what = `resting heart rate · ${entries.length} entries`;
      break;
    case 'energy':
      merge(S.fit.energy, entries);
      if (fit.headline?.label) S.fit.notes.energy = `${fit.headline.label}: ${Math.round(fit.headline.value).toLocaleString()} cal`;
      what = `energy · ${entries.length} entries`;
      break;
    default:
      what = `${fit.metric} (not charted yet)`;
  }
  return what;
}

/* ---------- nudges (web push) ----------
 * Three a day, decided server side from this same synced row: steps at 2, where
 * the day stands at 6, anything still open at 10. The subscription is stored in
 * state like everything else, so it rides the normal sync and needs no table.
 * On iPhone this only works from the home-screen copy, never from a Safari tab.
 */
const VAPID_PUBLIC = 'BLKel7CKq4SiXr6mWZhFJmCRBskpg8PAErTg7dOz93AcngJyfAer8w2uLQRZ7g1FfQ5FRXL7OkIi-tXz6Adq7-o';
const pushReady = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
// subscribe() takes the key as raw bytes. The string form is in the spec but is
// not worth trusting across Safari versions when the conversion is four lines.
function vapidBytes(s) {
  const pad = '='.repeat((4 - (s.length % 4)) % 4);
  const bin = atob((s + pad).replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from(bin, (c) => c.charCodeAt(0));
}
const standalone = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;

function pushCard() {
  const on = !!(S.push && S.push.on);
  if (!pushReady()) {
    return `<div class="card" style="padding:16px"><div class="lbl">Nudges</div><div class="s" style="margin-top:6px">This browser cannot do notifications. On iPhone, open the copy you added to your home screen.</div></div>`;
  }
  const blocked = Notification.permission === 'denied';
  return `<div class="card" style="padding:16px">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
      <div><div class="lbl">Nudges</div><div class="t" style="margin-top:2px">${on ? 'On' : 'Off'}</div></div>
      <button class="btn ${on ? 'ghost' : ''}" data-act="${on ? 'push-off' : 'push-on'}">${on ? 'Turn off' : 'Turn on'}</button>
    </div>
    <div class="s" style="margin-top:8px">Steps at 2. Where the day stands at 6. Anything still open at 10.</div>
    ${blocked ? `<div class="s" style="margin-top:6px;color:#b3261e">Notifications are blocked for this app in iPhone Settings.</div>` : ''}
    ${on ? `<button class="btn ghost wide" data-act="push-test" style="margin-top:10px">Send me a test</button>` : ''}
    ${!standalone() ? `<div class="s" style="margin-top:6px;color:#67645d">Open the home screen copy first, or the switch will not stick.</div>` : ''}
  </div>`;
}

async function pushOn() {
  try {
    if (Notification.permission !== 'granted') {
      const p = await Notification.requestPermission();
      if (p !== 'granted') { toast({ t: 'Notifications not allowed', s: 'You can turn them on in iPhone Settings.', cls: 'red', ms: 6000 }); renderTalk(); return; }
    }
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: vapidBytes(VAPID_PUBLIC) });
    const j = sub.toJSON();
    S.push = { on: true, sub: { endpoint: j.endpoint, keys: j.keys }, at: nowHM(), date: ymd() };
    save();
    toast({ t: 'Nudges on', s: 'Three a day. Try the test button.', cls: 'blue', ms: 5000 });
  } catch (err) {
    toast({ t: 'Could not turn nudges on', s: err.message, cls: 'red', ms: 6000 });
  }
  renderTalk();
}

async function pushOff() {
  try {
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if (sub) await sub.unsubscribe();
  } catch {}
  S.push = { on: false };
  save();
  toast({ t: 'Nudges off', ms: 3000 });
  renderTalk();
}

async function pushTest() {
  toast({ t: 'Sending', ms: 2500 });
  try {
    const r = await fetch('/.netlify/functions/day-ping');
    const t = await r.text();
    if (!r.ok) throw new Error(t.slice(0, 120));
    toast({ t: 'Sent', s: 'It should land in a second.', cls: 'blue', ms: 5000 });
  } catch (err) { toast({ t: 'Test failed', s: err.message, cls: 'red', ms: 6000 }); }
}

/* ---------- sync (Supabase, one row) ---------- */
const sbHeaders = { apikey: SB_KEY, Authorization: `Bearer ${SB_KEY}`, 'Content-Type': 'application/json' };
function scheduleSync() { clearTimeout(sync.timer); sync.timer = setTimeout(pushSync, 1500); }
async function pushSync() {
  if (IS_TEST_HOST) { sync.status = 'local'; return; }
  if (!SB_KEY || SB_KEY.startsWith('__')) return;
  try {
    const r = await fetch(`${SB_URL}/rest/v1/day_state`, { method: 'POST', headers: { ...sbHeaders, Prefer: 'resolution=merge-duplicates,return=minimal' }, body: JSON.stringify([{ id: ROW_ID, data: S, updated_at: new Date().toISOString() }]) });
    sync.status = r.ok ? 'on' : `err ${r.status}`;
  } catch { sync.status = 'offline'; }
}
async function pullSync() {
  if (IS_TEST_HOST) { sync.status = 'local'; return; }
  if (!SB_KEY || SB_KEY.startsWith('__')) return;
  try {
    const r = await fetch(`${SB_URL}/rest/v1/day_state?id=eq.${ROW_ID}&select=data,updated_at`, { headers: sbHeaders });
    if (!r.ok) { sync.status = `err ${r.status}`; return; }
    const rows = await r.json();
    if (!rows.length) { sync.status = 'on'; pushSync(); return; }
    const remote = rows[0].data;
    if (remote && (remote.updatedAt || 0) > (S.updatedAt || 0)) { S = Object.assign(DEFAULT(), remote); S.planVersion = remote.planVersion || 1; migratePlan(); localStorage.setItem(STORE_KEY, JSON.stringify(S)); render(); }
    sync.status = 'on';
  } catch { sync.status = 'offline'; }
}

/* ---------- boot ---------- */
load();
ensureDay(ymd());
tickClock();
render();
renderTabs();
setInterval(() => { tickClock(); renderNow(); }, 30 * 1000);
loadWeather();
if (S.settings.place.auto) locate();
pullSync();
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { tickClock(); ensureDay(ymd()); render(); pullSync(); loadWeather(); } });
window.addEventListener('resize', renderTabs);
/*
 * Self-update. The shell is fetched fresh on every open, but a phone can still
 * be running an older copy it already had in memory. So the app asks the site
 * what version is live and reloads itself when that differs. One reload, then
 * the versions match and it stops.
 */
async function checkForUpdate() {
  try {
    const r = await fetch(`/day/index.html?u=${Date.now()}`, { cache: 'no-store' });
    if (!r.ok) return;
    const m = /APP_VERSION = '([^']+)'/.exec(await r.text());
    if (m && m[1] !== APP_VERSION && !sessionStorage.getItem(`reloaded-${m[1]}`)) {
      sessionStorage.setItem(`reloaded-${m[1]}`, '1');
      toast({ t: 'Updating', s: `Daily Board ${m[1]}`, cls: 'blue', ms: 1500 });
      setTimeout(() => location.reload(), 900);
    }
  } catch {}
}
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('/day/sw.js', { updateViaCache: 'none' }).then((reg) => { try { reg.update(); } catch {} }).catch(() => {});
}
if (location.protocol === 'https:') { setTimeout(checkForUpdate, 2500); document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkForUpdate(); }); }
</script>
