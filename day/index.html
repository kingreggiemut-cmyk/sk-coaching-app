<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Daily Board</title>
<link rel="manifest" href="/day/manifest.webmanifest">
<link rel="apple-touch-icon" href="/day/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Board">
<meta name="theme-color" content="#e9e7e2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&display=swap">
<style>
  :root {
    --ground: #e9e7e2; --card: #fbfaf7; --edge: #cfccc4; --line: #e6e3dc; --ink: #1d1d1f; --mute: #67645d; --soft: #a8a49c;
    --blue: #2b5cff; --blue-deep: #1a3fc2; --blue-tint: #dbe4ff; --blue-soft: #9db3ff;
    --raise: 0 1px 0 #ffffff inset, 0 6px 0 var(--edge), 0 14px 24px rgba(0,0,0,0.10);
    --press: 0 4px 0 var(--blue-deep) inset, 0 4px 8px rgba(0,0,0,0.22) inset;
    --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
    --barh: 74px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--ground); color: var(--ink); font-family: 'Outfit', 'Trebuchet MS', sans-serif; overscroll-behavior: none; }
  body { overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; border-radius: 8px; }
  input, textarea, select { font: inherit; }

  .lbl { font-weight: 700; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--mute); }
  .big { font-weight: 800; letter-spacing: -0.02em; line-height: 1; }
  .t { font-weight: 700; font-size: 16px; color: var(--ink); }
  .s { font-weight: 600; font-size: 12.5px; color: var(--mute); }
  .card { background: var(--card); border-radius: 26px; box-shadow: var(--raise); }
  .btn { height: 48px; border-radius: 999px; background: var(--ink); color: var(--card); box-shadow: 0 6px 0 #000; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 700; font-size: 14px; padding: 0 18px; transition: transform .08s, box-shadow .08s; }
  .btn:active { transform: translateY(5px); box-shadow: 0 1px 0 #000; }
  .btn.blue { background: var(--blue); box-shadow: 0 6px 0 var(--blue-deep); }
  .btn.blue:active { box-shadow: 0 1px 0 var(--blue-deep); }
  .btn.ghost { background: var(--card); color: var(--ink); box-shadow: 0 1px 0 #fff inset, 0 5px 0 var(--edge); }
  .btn.ghost:active { box-shadow: 0 1px 0 var(--edge); }
  .btn.wide { width: 100%; }
  .pill { height: 36px; padding: 0 14px; border-radius: 999px; background: var(--card); color: var(--ink); box-shadow: 0 1px 0 #fff inset, 0 4px 0 var(--edge); display: inline-flex; align-items: center; font-weight: 700; font-size: 13px; white-space: nowrap; }
  .pill:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--edge); }
  .stamp { font-weight: 800; font-size: 11px; letter-spacing: 0.14em; padding: 4px 8px; border: 2px solid var(--blue); color: var(--blue); background: var(--card); border-radius: 6px; transform: rotate(-6deg); text-shadow: 0 1px 0 #fff; box-shadow: 0 2px 0 #b8c6ff; flex-shrink: 0; }
  /* Went by without an answer. Red, and it asks rather than tells. */
  .row.miss { background: #fdf0ed; }
  .row.miss .t { color: #8f2718; }
  .row.miss .chk { border-color: #e6b3a8; box-shadow: 0 1px 0 #fff inset, 0 4px 0 #e6b3a8, 0 6px 8px rgba(0,0,0,0.10); }
  .card.tapme { cursor: pointer; }
  .card.tapme:active { transform: translateY(2px); }
  .stamp.q { font-size: 15px; letter-spacing: 0; padding: 2px 10px; border-color: #b8321f; color: #b8321f; box-shadow: 0 2px 0 #e6b3a8; }
  .row.done .stamp { animation: stampIn .35s cubic-bezier(.2,1.4,.4,1) both; }
  @keyframes stampIn { 0% { transform: rotate(-20deg) scale(2.2); opacity: 0; } 60% { transform: rotate(-4deg) scale(.92); opacity: 1; } 100% { transform: rotate(-6deg) scale(1); } }

  /* pages */
  #track { position: fixed; inset: 0; display: flex; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; scrollbar-width: none; }
  #track::-webkit-scrollbar { display: none; }
  .page { flex: 0 0 100vw; width: 100vw; height: 100%; scroll-snap-align: start; overflow-y: auto; overflow-x: hidden; padding: calc(var(--sat) + 14px) 14px calc(var(--barh) + var(--sab) + 16px); -webkit-overflow-scrolling: touch; }
  .page::-webkit-scrollbar { display: none; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .in-tabs { display: flex; gap: 6px; margin: 0 0 12px; }

  /* rows */
  .list { display: flex; flex-direction: column; overflow: hidden; }
  .row { display: flex; align-items: center; gap: 12px; min-height: 54px; padding: 4px 16px; position: relative; overflow: hidden; }
  .row + .row { border-top: 1.5px solid var(--line); }
  .row .txt { display: flex; flex-direction: column; flex-grow: 1; min-width: 0; }
  .row .t, .row .s { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .s.parts { white-space: normal; font-size: 12px; color: var(--soft); margin-top: 2px; line-height: 1.3; }
  .row:has(.parts) { padding: 10px 16px; }
  .row::before { content: ""; position: absolute; inset: 0; background: var(--blue-tint); transform: scaleX(0); transform-origin: left; transition: transform .35s cubic-bezier(.2,.9,.3,1); z-index: 0; }
  .row.done::before { transform: scaleX(1); }
  .row > * { position: relative; z-index: 1; }
  .row.moved .t { color: var(--mute); }
  .chk { width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: var(--card); border: 1.5px solid var(--edge); box-shadow: 0 1px 0 #fff inset, 0 4px 0 var(--edge), 0 6px 8px rgba(0,0,0,0.10); transition: transform .08s, box-shadow .08s, background .15s; }
  .chk:active { transform: translateY(4px); box-shadow: 0 0 0 var(--edge); }
  .chk svg { opacity: 0; transform: scale(.4); transition: transform .25s cubic-bezier(.2,1.6,.4,1), opacity .15s; }
  .row.done .chk { background: var(--blue); border-color: var(--blue-deep); box-shadow: var(--press); }
  .row.done .chk svg { opacity: 1; transform: scale(1); }
  .row.moved .chk { border-style: dashed; box-shadow: none; }
  .time { font-weight: 800; font-size: 18px; color: var(--blue); flex-shrink: 0; }
  .grp-lbl { padding: 6px 4px 0; }

  /* now page */
  .sky { position: relative; height: 300px; margin: calc(-1 * (var(--sat) + 14px)) -14px 0; padding: calc(var(--sat) + 14px) 18px 0; border-radius: 0 0 30px 30px; overflow: hidden; transition: background .8s; }
  .sky .sun { position: absolute; right: 30px; top: calc(var(--sat) + 74px); width: 120px; height: 120px; border-radius: 50%; transition: background .8s, box-shadow .8s; }
  .sky .hill { position: absolute; left: -30px; right: -30px; top: 232px; height: 140px; border-radius: 50% 50% 0 0 / 100% 100% 0 0; transition: background .8s, box-shadow .8s; }
  .sky .moon { position: absolute; right: 44px; top: calc(var(--sat) + 80px); width: 86px; height: 86px; border-radius: 50%; background: #f4f1ea; box-shadow: 0 6px 0 rgba(0,0,0,0.18); opacity: 0; transition: opacity .8s; }
  .sky .star { position: absolute; width: 4px; height: 4px; border-radius: 50%; background: #fff; opacity: 0; transition: opacity .8s; }
  .sky.night .moon, .sky.night .star { opacity: 1; }
  .sky.night .sun { opacity: 0; }
  .sky .top { position: relative; display: flex; justify-content: space-between; gap: 8px; }
  .chip { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border-radius: 999px; background: var(--ink); color: var(--card); box-shadow: 0 4px 0 #000; font-weight: 700; font-size: 13px; white-space: nowrap; min-width: 0; }
  .chip svg { flex-shrink: 0; }
  .chip span { overflow: hidden; text-overflow: ellipsis; }
  #place-chip { flex-shrink: 0; }
  #wx-chip { flex: 0 1 auto; }
  .sky .clock { position: relative; margin-top: 22px; }
  .sky .clock .lbl { color: inherit; }
  .sky .clock .big { font-size: 72px; margin-top: 6px; }
  .next { margin-top: -50px; position: relative; z-index: 2; background: var(--ink); color: var(--card); border-radius: 26px; padding: 16px; box-shadow: 0 6px 0 #000, 0 14px 24px rgba(0,0,0,0.14); display: flex; flex-direction: column; gap: 10px; }
  .next .lbl { color: var(--soft); }
  .next .in { color: var(--blue-soft); }
  .next .line { height: 2px; background: #000; box-shadow: 0 1px 0 #3a3a3d; border-radius: 1px; }
  .next .h { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
  .next .h .big { font-size: 32px; }
  .next .h .when { font-size: 24px; color: var(--blue-soft); padding-bottom: 2px; }
  .next .meal { display: flex; align-items: center; gap: 12px; }
  .next .meal .s { color: var(--soft); }
  .next .meal .t { color: var(--card); font-size: 15px; }
  .tiles { display: flex; gap: 10px; }
  .tile { flex: 1 1 0; display: flex; flex-direction: column; gap: 8px; padding: 14px; min-height: 88px; }
  .tile .big { font-size: 28px; }
  .tile.slim { flex: 0 0 auto; min-width: 92px; }
  .ring { width: 40px; height: 40px; }
  .barr { height: 8px; border-radius: 4px; background: var(--ground); box-shadow: 0 2px 0 var(--edge) inset; overflow: hidden; }
  .barr i { display: block; height: 100%; width: 100%; border-radius: 4px; background: var(--ink); transform-origin: left; transform: scaleX(0); transition: transform .5s cubic-bezier(.2,.9,.3,1); }
  .fold { display: flex; align-items: center; justify-content: space-between; padding: 0 4px; min-height: 44px; }
  .fold .lbl { display: flex; align-items: center; gap: 8px; }
  .fold svg { transition: transform .2s; }
  .fold.open svg { transform: rotate(180deg); }
  .fold + .list { display: none; }
  .fold-row { display: flex; align-items: center; justify-content: space-between; }
  .fold.open + .list { display: flex; }

  /* macros */
  .mac { display: flex; align-items: center; gap: 10px; min-height: 30px; }
  .mac .n { font-weight: 700; font-size: 13px; width: 60px; flex-shrink: 0; }
  .mac .v { font-weight: 700; font-size: 13px; width: 80px; text-align: right; flex-shrink: 0; }
  .mac .barr { flex-grow: 1; height: 10px; border-radius: 5px; }
  .mac .barr i { background: var(--ink); }
  .mac.p .barr i { background: var(--blue); }
  .micro-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 20px; padding: 6px 16px 12px; }
  .micro { min-width: 0; }
  .micro .n { font-weight: 600; font-size: 12.5px; color: var(--mute); }
  .micro .v { font-weight: 800; font-size: 13.5px; display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
  .micro .v span { color: var(--mute); font-weight: 600; font-size: 12px; }
  /* A bar per micro: a ceiling gone over reads red, a target reached reads blue. */
  .micro .mbar { height: 5px; margin-top: 5px; border-radius: 99px; background: var(--line); overflow: hidden; }
  .micro .mbar i { display: block; height: 100%; border-radius: 99px; background: #9a968d; transform-origin: left; transform: scaleX(0); transition: transform .5s cubic-bezier(.2,.9,.3,1); }
  .micro.good .mbar i { background: var(--blue); }
  .micro.bad .mbar i { background: #b8321f; }
  .micro.bad .v { color: #b8321f; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; padding: 2px 4px; }

  /* body page */
  .weight-hero { display: flex; align-items: flex-end; justify-content: space-between; }
  .weight-hero .big { font-size: 40px; }
  .spark { width: 100%; height: 70px; display: block; }
  .phys { display: flex; overflow: hidden; min-height: 190px; }
  .phys .pic { width: 150px; flex-shrink: 0; background: #d6d2c8; position: relative; box-shadow: 4px 0 0 var(--edge); display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .phys .pic img { width: 100%; height: 100%; object-fit: cover; }
  .phys .pic .tag { position: absolute; left: 10px; bottom: 10px; padding: 4px 8px; border-radius: 6px; background: var(--ink); color: var(--card); font-weight: 700; font-size: 11px; }
  .phys .info { display: flex; flex-direction: column; gap: 8px; padding: 14px 16px; flex-grow: 1; min-width: 0; }
  .phys .info .big { font-size: 40px; }
  .phys .info .big span { font-size: 22px; }
  .meas { display: flex; gap: 12px; }
  .meas > div { flex: 1 1 0; display: flex; flex-direction: column; gap: 2px; }
  .meas .lbl { font-size: 10px; }
  .thumbs { display: flex; gap: 8px; }
  .thumbs .th { flex: 1 1 0; height: 72px; border-radius: 18px; background: #d6d2c8; box-shadow: var(--raise); overflow: hidden; position: relative; }
  .thumbs .th img { width: 100%; height: 100%; object-fit: cover; }
  .thumbs .th .s { position: absolute; left: 8px; bottom: 6px; font-weight: 700; color: var(--ink); background: rgba(251,250,247,0.85); padding: 2px 6px; border-radius: 6px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field input, .field textarea, .field select { width: 100%; height: 48px; border-radius: 14px; border: 1.5px solid var(--edge); background: var(--card); padding: 0 14px; font-weight: 700; font-size: 16px; color: var(--ink); box-shadow: 0 2px 0 var(--edge) inset; outline: none; }
  .field textarea { height: auto; min-height: 120px; padding: 12px 14px; line-height: 1.4; font-weight: 600; font-size: 14px; resize: vertical; }
  .field input:focus, .field textarea:focus { border-color: var(--blue); }

  /* wrap */
  .prompt { background: var(--ink); color: var(--card); border-radius: 26px; padding: 18px; box-shadow: 0 6px 0 #000, 0 14px 24px rgba(0,0,0,0.14); display: flex; flex-direction: column; gap: 14px; }
  .prompt p { margin: 0; font-weight: 600; font-size: 15px; line-height: 1.4; color: #d9d3c5; }
  .prompt .go { display: flex; align-items: center; gap: 12px; }
  .prompt .go .mic-btn { width: 56px; height: 56px; border-radius: 50%; background: var(--blue); box-shadow: 0 5px 0 var(--blue-deep); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .prompt .go .mic-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--blue-deep); }
  .day { display: flex; gap: 12px; padding: 12px 14px; align-items: flex-start; }
  .score { width: 46px; height: 46px; border-radius: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-weight: 800; font-size: 18px; background: var(--blue-tint); color: var(--blue); box-shadow: 0 3px 0 #b8c6ff; }
  .score.top { background: var(--ink); color: var(--card); box-shadow: 0 3px 0 #000; }
  .score.low { background: var(--ground); color: var(--mute); box-shadow: 0 3px 0 var(--edge); }
  .day .q { font-weight: 600; font-size: 13.5px; color: #3a3a3a; line-height: 1.35; }
  .day .q div + div { margin-top: 3px; }

  /* section tabs at the top of each page */
  .tab { flex: 1 1 0; height: 40px; border-radius: 999px; background: var(--card); color: var(--mute); box-shadow: 0 1px 0 #fff inset, 0 4px 0 var(--edge); font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center; transition: transform .08s, box-shadow .08s; white-space: nowrap; padding: 0 6px; }
  .tab:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--edge); }
  .tab.on { background: var(--ink); color: var(--card); box-shadow: 0 4px 0 #000; }

  /* bottom nav: one icon per area, the way Fitbit does it */
  #nav { position: fixed; left: 0; right: 0; bottom: 0; height: calc(var(--barh) + var(--sab)); padding: 8px 10px calc(var(--sab) + 8px); display: flex; gap: 4px; align-items: stretch; background: var(--card); box-shadow: 0 -1px 0 #fff inset, 0 -6px 0 var(--edge), 0 -14px 24px rgba(0,0,0,0.08); z-index: 20; }
  .nb { flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border-radius: 16px; color: var(--mute); font-weight: 700; font-size: 9.5px; letter-spacing: 0.03em; text-transform: uppercase; transition: transform .08s, box-shadow .08s, background .12s; min-width: 0; padding: 0 2px; }
  .nb svg { width: 22px; height: 22px; }
  .nb:active { transform: translateY(2px); }
  .nb.on { background: var(--ink); color: var(--card); box-shadow: 0 4px 0 #000; }
  .nb:last-child { margin-right: 60px; }

  /*
   * Section heroes. Same flat toy panel as the Now sky: one colour, a hard
   * bottom edge, one thing moving slowly behind the words. Each page gets its
   * own hue and its own motion so you know where you are at a glance.
   */
  .hero { position: relative; margin: calc(-1 * (var(--sat) + 14px)) -14px 12px; padding: calc(var(--sat) + 26px) 18px 18px; border-radius: 0 0 30px 30px; overflow: hidden; min-height: 164px; display: flex; align-items: flex-end; }
  /*
   * The art sits on its own layer and the words sit above it, both said out
   * loud. iOS promotes an animated or will-change'd child of .hero-art to its
   * own compositing layer, and a promoted layer was painting OVER the text:
   * the Fuel band went completely blank on his phone while Chrome was fine.
   * Never leave these two on z-index auto.
   */
  .hero-art { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
  .hero-row { position: relative; z-index: 1; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; width: 100%; }
  /* Fuel fills the whole band instead of sitting in a line at the bottom: the
     day's number in the middle, the three macros along the foot. */
  .hero.fuel { align-items: stretch; }
  .hero-col { position: relative; z-index: 1; display: flex; flex-direction: column; justify-content: space-between; width: 100%; gap: 12px; }
  .hero-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .hero-top > .lbl:first-child { flex-shrink: 0; white-space: nowrap; }
  #fuel-right { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: right; }
  .hero-mid { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .hero-mid .big { line-height: 1; }
  .hero-bars { display: flex; gap: 10px; }
  .hb { flex: 1; min-width: 0; }
  .hb .k { display: flex; justify-content: space-between; gap: 6px; font-weight: 800; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(29,29,31,0.75); }
  .hb .k b { font-weight: 800; color: var(--ink); }
  .hb .t { height: 7px; margin-top: 5px; border-radius: 99px; background: rgba(29,29,31,0.17); overflow: hidden; }
  .hb .t i { display: block; height: 100%; border-radius: 99px; background: #1d1d1f; transform-origin: left; transform: scaleX(0); transition: transform .6s cubic-bezier(.2,.9,.3,1); }
  .hb.p .t i { background: var(--blue); }
  .hb.over .t i { background: #b8321f; }
  .hero .big { font-size: 34px; }
  .hero .lbl { color: rgba(29,29,31,0.75); }
  .hero-stat { text-align: right; flex-shrink: 0; }
  .hero-stat .big { font-size: 24px; }
  .hero-stat .big span { opacity: 0.55; }

  .hero.fuel { background: #ffcf85; color: var(--ink); box-shadow: 0 6px 0 #d9922f, 0 14px 24px rgba(0,0,0,0.10); }
  .hero.fuel .fill { position: absolute; left: 0; right: 0; bottom: 0; height: 100%; background: #ff9d3d; transform-origin: bottom; transform: scaleY(0); transition: transform .9s cubic-bezier(.2,.9,.3,1); }
  .hero.fuel .wave { position: absolute; top: -11px; left: -50%; width: 200%; height: 24px; fill: #ff9d3d; animation: drift 11s linear infinite; }
  /* A second crest behind the first, slower and softer: two speeds read as
     liquid, one speed reads as a shape sliding sideways. */
  .hero.fuel .wave.back { top: -16px; height: 28px; fill: #ffb877; opacity: .55; animation: drift2 17s linear infinite; }
  .hero.fuel .bubbles { position: absolute; inset: 0; }
  .hero.fuel .bubbles i { position: absolute; bottom: -14px; width: 9px; height: 9px; border-radius: 50%; background: rgba(255,255,255,0.42); animation: rise 9s ease-in infinite; }
  @keyframes drift { to { transform: translateX(25%); } }
  @keyframes drift2 { to { transform: translateX(-25%); } }
  @keyframes rise { 0% { transform: translateY(0) scale(.7); opacity: 0; } 12% { opacity: .85; } 80% { opacity: .5; } 100% { transform: translateY(-150px) scale(1.15); opacity: 0; } }

  .hero.body { background: #8fdcc0; color: var(--ink); box-shadow: 0 6px 0 #3f9c7a, 0 14px 24px rgba(0,0,0,0.10); }
  .hero.body .trend { position: absolute; inset: 0; width: 100%; height: 100%; }
  .hero.body .trend polyline { fill: none; stroke: #1d6b52; stroke-width: 3.5; stroke-linejoin: round; stroke-linecap: round; opacity: .55; animation: draw 2.2s ease-out both; }
  .hero.body .trend line { stroke: #6ec6a6; stroke-width: 1.5; }
  .hero.body .trend circle { fill: #1d6b52; }
  /* The last weigh-in pulses: the one point that is actually current. */
  .hero.body .trend circle.now { animation: ping 3.4s ease-out infinite; transform-origin: center; transform-box: fill-box; }
  .hero.body .glow { position: absolute; left: -20%; right: -20%; top: -40%; height: 150%; border-radius: 50%; background: radial-gradient(closest-side, rgba(255,255,255,0.5), rgba(255,255,255,0)); animation: breathe 12s ease-in-out infinite; }
  @keyframes ping { 0% { r: 4; opacity: 1; } 70% { r: 11; opacity: 0; } 100% { r: 4; opacity: 0; } }
  @keyframes breathe { 0%, 100% { transform: translateY(0) scale(1); opacity: .55; } 50% { transform: translateY(10px) scale(1.08); opacity: .85; } }
  @keyframes draw { from { stroke-dashoffset: var(--len); } to { stroke-dashoffset: 0; } }

  .hero.board { background: #a3b9ff; color: var(--ink); box-shadow: 0 6px 0 #4f6fd4, 0 14px 24px rgba(0,0,0,0.10); }
  .hero.board .blocks { position: absolute; left: 18px; right: 18px; top: calc(var(--sat) + 22px); display: flex; gap: 4px; height: 30px; }
  .hero.board .blocks i { flex: 1 1 0; border-radius: 4px; background: rgba(29,29,31,0.14); transition: background .4s, transform .4s; }
  /* Done blocks drop in one after another rather than all at once. */
  .hero.board .blocks i.on { background: var(--blue); animation: land .5s cubic-bezier(.2,1.3,.4,1) both; animation-delay: var(--d, 0s); }
  .hero.board .sheen { position: absolute; top: 0; bottom: 0; width: 80%; left: -80%; background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.30) 50%, rgba(255,255,255,0) 100%); animation: sweep 11s ease-in-out infinite; }
  .hero.board .grid { position: absolute; inset: 0; opacity: .3; background-image: linear-gradient(rgba(29,29,31,0.10) 1.5px, transparent 1.5px); background-size: 100% 26px; animation: creep 20s linear infinite; }
  @keyframes sweep { 0%, 62% { left: -80%; } 100% { left: 110%; } }
  @keyframes land { from { transform: scaleY(.25); opacity: .3; } to { transform: scaleY(1); opacity: 1; } }
  @keyframes creep { to { background-position-y: 26px; } }

  .hero.talk { background: #1b2350; color: #f4f1ea; box-shadow: 0 6px 0 #0c1130, 0 14px 24px rgba(0,0,0,0.14); }
  .hero.talk .lbl { color: #93a0d8; }
  .hero.talk .orb { position: absolute; border-radius: 50%; display: block; }
  .hero.talk .o1 { width: 130px; height: 130px; right: -20px; top: -30px; background: #2b3a86; animation: float1 16s ease-in-out infinite; }
  .hero.talk .o2 { width: 76px; height: 76px; right: 96px; top: 62px; background: #26306b; animation: float2 13s ease-in-out infinite; }
  .hero.talk .o3 { width: 40px; height: 40px; right: 176px; top: 26px; background: var(--blue); opacity: .5; animation: float1 19s ease-in-out infinite reverse; }
  /* A slow waveform along the foot: the band looks like it is listening. */
  .hero.talk .bars { position: absolute; left: 0; right: 0; bottom: 0; height: 46px; display: flex; align-items: flex-end; gap: 5px; padding: 0 14px; opacity: .5; }
  .hero.talk .bars i { flex: 1 1 0; border-radius: 3px 3px 0 0; background: linear-gradient(180deg, #4a5bc4 0%, #2b3a86 100%); height: 8px; animation: listen 4.2s ease-in-out infinite; animation-delay: var(--d, 0s); }
  @keyframes float1 { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-14px, 12px); } }
  @keyframes float2 { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(10px, -14px); } }
  @keyframes listen { 0%, 100% { height: 7px; } 50% { height: var(--h, 24px); } }
  @media (prefers-reduced-motion: reduce) { .hero * { animation: none !important; } }

  /* the now divider inside the flow list */
  .nowline { display: flex; align-items: center; gap: 10px; padding: 6px 16px; border-top: 1.5px solid var(--line); }
  .nowline span { flex: 1 1 0; height: 2px; border-radius: 1px; background: var(--line); }

  /* reminder strip, parked above the nav */
  #strip { position: fixed; left: 0; right: 0; bottom: calc(var(--barh) + var(--sab)); z-index: 21; display: none; gap: 8px; padding: 22px 12px 10px; overflow-x: auto; scrollbar-width: none; background: linear-gradient(180deg, rgba(233,231,226,0) 0%, var(--ground) 42%); }
  #strip::-webkit-scrollbar { display: none; }
  #strip.show { display: flex; }
  .rem { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px 0 8px; border-radius: 999px; background: var(--card); box-shadow: 0 1px 0 #fff inset, 0 4px 0 var(--edge); max-width: 74vw; transition: transform .08s, box-shadow .08s, opacity .2s; }
  .rem.add:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--edge); }
  .rem .tick { width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0; background: var(--ground); box-shadow: 0 2px 0 var(--edge) inset; display: flex; align-items: center; justify-content: center; }
  .rem .tick:active { background: var(--blue); box-shadow: 0 3px 0 var(--blue-deep) inset; }
  .rem .tick svg { width: 14px; height: 14px; stroke: var(--card); opacity: 0; }
  .rem .tick:active svg { opacity: 1; }
  .rem .rt { font-weight: 700; font-size: 14px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; padding: 8px 0; }
  .rem .rd { font-weight: 700; font-size: 11px; color: var(--blue); flex-shrink: 0; }
  .rem.add { background: transparent; box-shadow: 0 0 0 2px var(--edge) inset; }
  .rem.add .rt { color: var(--mute); }
  .rem.going { opacity: 0; transform: scale(.9); }
  .has-strip .page { padding-bottom: calc(var(--barh) + var(--sab) + 76px); }

  /* mic */
  #mic { position: fixed; right: 12px; bottom: calc(var(--sab) + 12px); z-index: 30; height: 58px; width: 58px; border-radius: 999px; background: var(--ink); color: var(--card); box-shadow: 0 6px 0 #000, 0 14px 24px rgba(0,0,0,0.16); display: flex; align-items: center; gap: 10px; padding: 0 16px; overflow: hidden; transition: width .25s cubic-bezier(.2,1.2,.4,1), background .2s, transform .08s, box-shadow .08s; pointer-events: auto; touch-action: manipulation; }
  #mic:active { transform: translateY(5px); box-shadow: 0 1px 0 #000, 0 6px 12px rgba(0,0,0,0.16); }
  #mic svg { flex-shrink: 0; }
  #mic .lab { font-weight: 700; font-size: 15px; white-space: nowrap; opacity: 0; transition: opacity .15s; }
  #mic.open { width: calc(100vw - 24px); bottom: calc(var(--sab) + var(--barh) + 12px); background: var(--blue); box-shadow: 0 6px 0 var(--blue-deep), 0 14px 24px rgba(43,92,255,0.25); }
  #mic.open .lab { opacity: 1; }
  #mic.busy { background: var(--ink); }
  #mic .wave { display: none; gap: 3px; align-items: center; height: 20px; margin-left: auto; }
  #mic.open.listening .wave { display: flex; }
  #mic .wave i { width: 4px; height: 8px; border-radius: 2px; background: var(--card); animation: wave .9s ease-in-out infinite; }
  #mic .wave i:nth-child(2) { animation-delay: .15s; } #mic .wave i:nth-child(3) { animation-delay: .3s; } #mic .wave i:nth-child(4) { animation-delay: .45s; }
  @keyframes wave { 0%, 100% { height: 6px; } 50% { height: 20px; } }
  #live { position: fixed; left: 14px; right: 14px; bottom: calc(var(--sab) + var(--barh) + 82px); z-index: 29; background: var(--card); border-radius: 22px; padding: 14px 16px; box-shadow: var(--raise); font-weight: 600; font-size: 15px; line-height: 1.35; display: none; max-height: 30vh; overflow: auto; }
  #live.show { display: block; }
  #live .lbl { margin-bottom: 4px; }

  /* toasts */
  #toasts { position: fixed; left: 14px; right: 14px; top: calc(var(--sat) + 12px); z-index: 40; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
  .toast { pointer-events: auto; background: var(--ink); color: var(--card); border-radius: 20px; padding: 12px 14px; box-shadow: 0 6px 0 #000, 0 14px 24px rgba(0,0,0,0.2); display: flex; align-items: center; gap: 12px; animation: toastIn .35s cubic-bezier(.2,1.2,.4,1) both; }
  .toast.out { animation: toastOut .25s ease-in both; }
  .toast .txt { flex-grow: 1; min-width: 0; }
  .toast .t { color: var(--card); font-size: 15px; }
  .toast .s { color: var(--soft); }
  .toast.blue { background: var(--blue); box-shadow: 0 6px 0 var(--blue-deep), 0 14px 24px rgba(43,92,255,0.25); }
  .toast.blue .s { color: #dbe4ff; }
  .toast.red { background: #b8321f; box-shadow: 0 6px 0 #7a1f12; }
  .toast .undo { height: 36px; padding: 0 14px; border-radius: 999px; background: rgba(251,250,247,0.18); color: var(--card); font-weight: 700; font-size: 13px; flex-shrink: 0; }
  @keyframes toastIn { from { transform: translateY(-20px) scale(.96); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes toastOut { to { transform: translateY(-10px); opacity: 0; } }

  /* the day is done: the one big moment the app owes him */
  #done { position: fixed; inset: 0; z-index: 60; background: var(--blue); color: var(--card); display: none; flex-direction: column; justify-content: center; padding: calc(var(--sat) + 28px) 24px calc(var(--sab) + 28px); overflow: hidden; }
  #done.show { display: flex; animation: doneIn .45s cubic-bezier(.2,.9,.3,1) both; }
  @keyframes doneIn { from { opacity: 0; transform: scale(1.04); } to { opacity: 1; transform: none; } }
  #done .swoosh { position: absolute; left: -10%; right: -10%; top: 18%; height: 46%; background: var(--ink); border-radius: 50% 50% 46% 54% / 22% 26% 74% 78%; transform: rotate(-7deg); }
  #done .inner { position: relative; display: flex; flex-direction: column; gap: 22px; }
  #done .kicker { font-weight: 700; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: #cfd9ff; }
  #done h1 { margin: 0; font-weight: 800; font-size: 58px; line-height: 0.92; letter-spacing: -0.03em; }
  #done .sub { font-weight: 600; font-size: 16px; color: #cfd9ff; max-width: 300px; }
  #done .figs { display: flex; justify-content: space-between; gap: 10px; }
  #done .fig { display: flex; flex-direction: column; gap: 2px; }
  #done .fig b { font-weight: 800; font-size: 30px; line-height: 1; letter-spacing: -0.02em; }
  #done .fig span { font-weight: 700; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: #a8b8ff; }
  #done .wk { display: flex; gap: 6px; }
  #done .wk i { flex: 1 1 0; height: 42px; border-radius: 12px; background: rgba(251,250,247,0.22); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px; font-style: normal; color: #cfd9ff; }
  #done .wk i.on { background: var(--card); color: var(--blue); }
  #done .wk i.now { box-shadow: 0 0 0 3px var(--card); }
  #done .go { height: 58px; border-radius: 999px; background: var(--card); color: var(--blue); font-weight: 800; font-size: 18px; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 0 #c4c1b9; }
  #done .go:active { transform: translateY(5px); box-shadow: 0 1px 0 #c4c1b9; }
  @media (prefers-reduced-motion: reduce) { #done.show { animation: none; } }

  /* sheets */
  #sheet-back { position: fixed; inset: 0; background: rgba(29,29,31,0.35); z-index: 50; display: none; }
  #sheet-back.show { display: block; }
  #sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 92%; background: var(--ground); border-radius: 30px 30px 0 0; box-shadow: 0 -6px 0 var(--edge), 0 -14px 30px rgba(0,0,0,0.2); z-index: 51; transform: translateY(105%); transition: transform .3s cubic-bezier(.2,1,.3,1); display: flex; flex-direction: column; }
  #sheet.show { transform: none; }
  #sheet .sh-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 18px 8px; }
  #sheet .sh-head .big { font-size: 28px; }
  #sheet .x { width: 44px; height: 44px; border-radius: 50%; background: var(--card); box-shadow: 0 1px 0 #fff inset, 0 4px 0 var(--edge); display: flex; align-items: center; justify-content: center; }
  #sheet .sh-body { overflow: auto; padding: 8px 14px calc(var(--sab) + 20px); display: flex; flex-direction: column; gap: 12px; }
  .seg { display: flex; gap: 4px; padding: 4px; border-radius: 999px; }
  .seg button { flex: 1 1 0; height: 40px; border-radius: 999px; font-weight: 700; font-size: 14px; color: var(--mute); display: flex; align-items: center; justify-content: center; gap: 8px; }
  .seg button.on { background: var(--ink); color: var(--card); box-shadow: 0 4px 0 #000; }
  .seg button.on svg { stroke: var(--card); }
  .food { display: flex; overflow: hidden; min-height: 132px; }
  .food .pic { width: 120px; flex-shrink: 0; background: #d6d2c8; box-shadow: 4px 0 0 var(--edge); display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .food .pic img { width: 100%; height: 100%; object-fit: cover; }
  .food .info { padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; flex-grow: 1; min-width: 0; }
  .food .info .big { font-size: 20px; line-height: 1.1; }
  .macs { display: flex; padding: 4px 6px; }
  .macs > div { flex: 1 1 0; display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; }
  .macs > div + div { border-left: 1.5px solid var(--line); }
  .macs .n { font-weight: 700; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--mute); }
  .macs .v { font-weight: 800; font-size: 20px; }
  .switch { display: flex; align-items: center; gap: 12px; padding: 12px 16px; }
  .switch .txt { flex-grow: 1; }
  .tog { width: 54px; height: 32px; border-radius: 999px; background: var(--edge); position: relative; flex-shrink: 0; transition: background .2s; }
  .tog i { position: absolute; left: 3px; top: 3px; width: 26px; height: 26px; border-radius: 50%; background: var(--card); box-shadow: 0 2px 0 #b5b2aa; transition: left .2s; }
  .tog.on { background: var(--blue); box-shadow: 0 3px 0 var(--blue-deep) inset; }
  .tog.on i { left: 25px; }
  .hidden { display: none !important; }
  .center { text-align: center; }
  .spin { width: 22px; height: 22px; border-radius: 50%; border: 3px solid rgba(251,250,247,0.3); border-top-color: var(--card); animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* chat */
  .thread { display: flex; flex-direction: column; gap: 10px; padding-bottom: 8px; }
  .msg { max-width: 86%; padding: 12px 14px; border-radius: 20px; font-weight: 600; font-size: 15px; line-height: 1.4; white-space: pre-wrap; }
  .msg.me { align-self: flex-end; background: var(--ink); color: var(--card); box-shadow: 0 4px 0 #000; border-bottom-right-radius: 6px; }
  .msg.ai { align-self: flex-start; background: var(--card); color: var(--ink); box-shadow: var(--raise); border-bottom-left-radius: 6px; }
  .msg .ops { margin-top: 8px; padding-top: 8px; border-top: 1.5px solid var(--line); font-size: 12.5px; color: var(--blue); font-weight: 700; }
  .msg .when { display: block; margin-top: 4px; font-size: 11px; color: var(--mute); font-weight: 600; }
  .msg.me .when { color: #a8a49c; }
  .msg .shots { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .msg .shots img { width: 88px; height: 88px; object-fit: cover; border-radius: 12px; background: #d6d2c8; }
  .msg .gone { font-size: 12px; font-weight: 700; opacity: 0.7; margin-bottom: 6px; }
  /* Attachments waiting to be sent, above the box they will go with. */
  .atts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .att { position: relative; }
  .att img { width: 60px; height: 60px; object-fit: cover; border-radius: 12px; background: #d6d2c8; box-shadow: 0 3px 0 var(--edge); display: block; }
  .att .x { position: absolute; top: -7px; right: -7px; width: 24px; height: 24px; border-radius: 50%; background: var(--ink); color: var(--card); font-weight: 800; font-size: 14px; line-height: 1; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 0 #000; }
  .chat-in { display: flex; gap: 8px; margin-top: 12px; align-items: center; }
  .chat-in .cam { width: 46px; height: 46px; border-radius: 50%; flex-shrink: 0; background: var(--card); border: 1.5px solid var(--edge); box-shadow: 0 3px 0 var(--edge); display: flex; align-items: center; justify-content: center; }
  .chat-in .cam:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--edge); }
  .chat-in input { flex-grow: 1; height: 46px; border-radius: 999px; border: 1.5px solid var(--edge); background: var(--card); padding: 0 16px; font-weight: 600; font-size: 15px; color: var(--ink); box-shadow: 0 2px 0 var(--edge) inset; outline: none; min-width: 0; }
  .chat-in input:focus { border-color: var(--blue); }
  .review { display: flex; flex-direction: column; gap: 8px; padding: 14px 16px; }
  .review .grade { width: 46px; height: 46px; border-radius: 14px; background: var(--blue); color: var(--card); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 22px; box-shadow: 0 4px 0 var(--blue-deep); flex-shrink: 0; }

  /* ============================================================
     The desk. At desktop width the app is a week planner: seven day
     lists you tick off, the day you clicked open beside them, and
     food in a section of its own. The phone layout above is untouched.
     Built to the board at claude.ai/artifact/TxFL3jhZE1cPG1LGGuozWM:
     12 columns, the week on 9 and the open day on 3.
     ============================================================ */
  #desk, #dpop, #dpop-back { display: none; }
  @media (min-width: 1000px) {
    :root { --k-train: #5b54d6; --k-content: #d6455d; --k-care: #1f9e86; --k-errand: #8a7f6d; --k-fuel: #e8891a; }
    #nav, #strip, #strip.show { display: none; }
    #toasts { left: 40px; right: auto; width: 400px; top: auto; bottom: 28px; flex-direction: column-reverse; }
    #sheet { left: 50%; right: auto; width: 520px; transform: translate(-50%, 105%); border-radius: 30px 30px 0 0; }
    #sheet.show { transform: translate(-50%, 0); }
    /* Off the week there is no talk box, so the mic sits in the top bar, clear of the content. */
    #mic { right: 284px; top: 23px; bottom: auto; }
    #mic.open { width: 264px; }
    #live { left: auto; right: 40px; width: 420px; top: 92px; bottom: auto; }
    /* On the week the talk box at the foot of the open day is the mic. */
    body.sec-week #mic { opacity: 0; pointer-events: none; }
    body.sec-week #live { right: 40px; top: auto; bottom: 96px; width: 360px; }

    /* Body and Talk are the phone pages, shown as one centred column. */
    #track { display: none; position: fixed; left: 50%; top: 104px; bottom: 0; width: min(760px, calc(100vw - 80px)); transform: translateX(-50%); overflow-x: hidden; overflow-y: auto; padding: 0 0 130px; scroll-snap-type: none; }
    body.sec-body #track, body.sec-talk #track { display: block; }
    #track .page { display: none; flex: none; width: auto; height: auto; min-height: 0; overflow: visible; border-radius: 30px; background: #efede8; box-shadow: 0 1px 0 #fff inset, 0 6px 0 var(--edge); padding: 14px 14px 24px; }
    body.sec-body #track .page.body, body.sec-talk #track .page.talk { display: block; }

    #desk { display: flex; flex-direction: column; gap: 14px; position: fixed; inset: 0; padding: 24px 40px 28px; min-height: 0; }
    body.sec-body #desk, body.sec-talk #desk { bottom: auto; height: 104px; }
    #desk .lbl { color: var(--mute); }
    #desk button { font-family: inherit; }

    .dtop { flex: 0 0 56px; position: relative; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .dtl { display: flex; align-items: center; gap: 16px; min-width: 0; }
    .dclock { font-weight: 800; font-size: 44px; letter-spacing: -0.03em; line-height: 1; font-variant-numeric: tabular-nums; }
    .dtabs { position: absolute; left: 50%; transform: translateX(-50%); display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: #dedbd3; }
    .dtab { height: 40px; padding: 0 22px; border-radius: 999px; font-weight: 700; font-size: 15px; }
    .dtab.on { background: var(--ink); color: var(--card); }
    .dtr { display: flex; align-items: center; gap: 8px; }
    .dchip { height: 32px; padding: 0 14px; border-radius: 999px; background: var(--ground); box-shadow: 0 2px 0 var(--edge); font-weight: 700; font-size: 13px; white-space: nowrap; }
    .dchip:active { transform: translateY(2px); box-shadow: none; }
    .dchip.ar { width: 32px; padding: 0; font-size: 18px; background: var(--card); }
    .dchip.sm { padding: 0 10px; }
    .dwkl { height: 32px; font-weight: 700; font-size: 15px; padding: 0 6px; min-width: 96px; text-align: center; border-radius: 8px; }
    .dsync { margin-left: 10px; display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border-radius: 999px; background: var(--card); box-shadow: 0 2px 0 var(--edge); font-weight: 700; font-size: 13px; white-space: nowrap; }
    .dsync i { width: 8px; height: 8px; border-radius: 50%; background: #1f9d55; }
    .dsync.off i { background: #b8321f; } .dsync.idle i { background: var(--soft); }

    .dsec { display: none; flex: 1; min-height: 0; }
    body.sec-week #dweek, body.sec-fuel #dfuel { display: grid; }
    #dweek { grid-template-columns: minmax(0, 9fr) minmax(300px, 3fr); grid-template-rows: 22px minmax(0, 1fr); gap: 12px 24px; }
    .dleg { grid-column: 1; display: flex; align-items: center; justify-content: space-between; gap: 16px; min-width: 0; }
    .dkinds { display: flex; gap: 16px; flex-wrap: wrap; }
    .dkinds span, .dkinds button { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 13px; }
    .dkinds i, .kd, .dpick i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; flex: 0 0 auto; }
    .k-train > i, .k-train .eh i, .k-train > .kd { background: var(--k-train); } .k-content > i, .k-content .eh i, .k-content > .kd { background: var(--k-content); }
    .k-care > i, .k-care .eh i, .k-care > .kd { background: var(--k-care); } .k-errand > i, .k-errand .eh i, .k-errand > .kd { background: var(--k-errand); }

     * and a meal he added himself is left alone.

    const stock = PLAN_CURRENT();

/*
 * Where the scale is heading, from a least squares fit over his recent

 * fit, or when the trend runs away from the goal.
 */
function projection() {
  const g = S.settings.weightGoal;
  const ws = [...S.weights].sort((a, b) => a.date.localeCompare(b.date)).filter((w) => w.date >= addDays(ymd(), -45));
  if (ws.length < 3 || !g) return null;
  const x0 = fromYmd(ws[0].date).getTime();
  const pts = ws.map((w) => [(fromYmd(w.date).getTime() - x0) / 86400000, w.lb]);

  const intercept = (sy - slope * sx) / n;

  const now = slope * todayX + intercept;
  const perWeek = slope * 7;
  if (Math.abs(perWeek) < 0.15) return { perWeek, now, verdict: 'flat', span: ws.length };
  const need = (g - now) / slope;                          // days to reach the goal
  if (need < 0 || !isFinite(need)) return { perWeek, now, verdict: slope > 0 ? 'away' : 'past', span: ws.length };

}

  if (p.verdict === 'slow') return `Down ${rate}. At that rate ${g} is more than a year out.`;

const WX_TEXT = (c) => c === 0 ? 'clear' : c <= 2 ? 'partly cloudy' : c === 3 ? 'cloudy' : c <= 48 ? 'fog' : c <= 57 ? 'drizzle' : c <= 67 ? 'rain' : c <= 77 ? 'snow' : c <= 82 ? 'showers' : c <= 86 ? 'snow showers' : 'storms';

  try {
    const c = JSON.parse(localStorage.getItem(cacheKey) || 'null');

  } catch {}

    const u = `https://api.open-meteo.com/v1/forecast?latitude=${p.lat}&longitude=${p.lon}&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,relative_humidity_2m&hourly=temperature_2m,precipitation_probability,weather_code,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset,wind_speed_10m_max&timezone=auto&forecast_days=2&temperature_unit=celsius&wind_speed_unit=kmh`;

    ? `<button class="card review" data-act="open-review" style="width:100%;text-align:left"><div style="display:flex;align-items:center;gap:12px"><div class="grade">${esc(rv.grade || '')}</div><div style="min-width:0"><div class="lbl" style="color:#2b5cff">Day review · ${t12s(rv.at)}</div><div class="t" style="margin-top:2px">${esc(rv.title || 'Reviewed')}</div><div class="s" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc((rv.lines || [])[0] || '')}</div></div></div></button>`
    : `<button class="card review" data-act="review" style="width:100%;text-align:left"><div style="display:flex;align-items:center;gap:12px"><div class="grade" style="background:#1d1d1f;box-shadow:0 4px 0 #000"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fbfaf7" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5M4 15l4-4 4 3 5-6 3 2"></path></svg></div><div><div class="t">Review my day</div><div class="s">Meals, steps, walks, sodium and water, and where the scale should land tomorrow.</div></div></div></button>`;

  $('#upcoming').innerHTML = renderFlow(day, nm);
  renderMissed(day, nm);

  const left = [...day.tasks.filter((t) => !t.done && !t.moved && !t.skipped), ...day.meals.filter((m) => !m.done)];
  $('#left-count').textContent = left.length ? `· ${left.length}` : '· clear';
  $('#now-left').innerHTML = left.length
    ? [...day.tasks.filter((t) => !t.done && !t.moved && !t.skipped).map((t) => rowHTML(t, 'task')), ...day.meals.filter((m) => !m.done).map((m) => rowHTML(m, 'meal'))].join('') + waterRow(day)
    : `<div class="row"><div class="txt"><div class="t">Everything is in.</div><div class="s">Streak ticks at midnight.</div></div></div>`;
}
/*
 * The flow: the last couple of things you finished, then the next few coming
 * up, with the current moment marked between them. Everything here has a live
 * checkbox, so an item you do early gets ticked without leaving the page, and
 * a finished one stays visible instead of vanishing. Once today is spent it
 * looks at tomorrow, so the last thing on screen at night is the morning.
 */
const PREP = [[/gym|basketball|workout/i, 30], [/walk/i, 10]];
function prepFor(name) { for (const [re, m] of PREP) if (re.test(name)) return m; return 0; }
function relTime(diff) { if (diff <= 0) return 'now'; if (diff < 60) return `in ${diff}m`; const h = Math.floor(diff / 60), m = diff % 60; return m ? `in ${h}h ${pad(m)}m` : `in ${h}h`; }
function hhmmOf(min) { const m = ((min % (24 * 60)) + 24 * 60) % (24 * 60); return `${pad(Math.floor(m / 60))}:${pad(m % 60)}`; }
function flowRow(x, nm) {
  const slot = x.kind === 'meal' && x.slot ? ` <span style="color:#6d6a63;font-weight:600">· ${esc(x.slot)}</span>` : '';
  const chk = `<button class="chk" data-act="toggle" data-kind="${x.kind}" data-id="${x.id}">${ICON_CHECK}</button>`;
  const txt = `<div class="txt" data-act="open-item" data-kind="${x.kind}" data-id="${x.id}" style="cursor:pointer">`;
  if (x.done) {
    return `<div class="row done" data-id="${x.id}">${chk}${txt}<div class="t">${esc(x.name)}${slot}</div><div class="s">Done ${x.doneAt ? t12s(x.doneAt) : ''}</div></div><div class="stamp">${x.swapped ? 'SWAP' : 'DONE'}</div></div>`;
  }
  const diff = x.at - nm;
  const isTomorrow = x.at >= 24 * 60;
  const prep = prepFor(x.name);
  const prepAt = prep ? x.at - prep : null;
  const when = isTomorrow ? `Tomorrow ${t12(x.time)}` : `${t12(x.time)}${x.end ? ' to ' + t12s(x.end) : ''}`;
  const prepTxt = prep ? ` · get ready ${prepAt - nm > 0 && !isTomorrow ? 'in ' + relTime(prepAt - nm).replace('in ', '') + ', at' : 'at'} ${t12s(hhmmOf(prepAt))}` : '';
  const rel = isTomorrow ? relTime(diff) : diff < -5 ? 'open' : relTime(diff);
  const col = isTomorrow ? '#6d6a63' : Math.abs(diff) <= 15 ? '#2b5cff' : '#1d1d1f';
  return `<div class="row" data-id="${x.id}">${chk}${txt}<div class="t">${esc(x.name)}${slot}</div><div class="s">${when}${prepTxt}</div></div><div class="time" style="color:${col}">${rel}</div></div>`;
}
function renderFlow(day, nm) {
  const tag = (d, kind, off) => d[kind === 'meal' ? 'meals' : 'tasks'].map((x) => ({ ...x, kind, at: x.time ? minutes(x.time) + off : null }));
  const all = [...tag(day, 'task', 0), ...tag(day, 'meal', 0)];

  const done = all.filter((x) => x.done && x.doneAt).sort((a, b) => a.doneAt.localeCompare(b.doneAt)).slice(-2);
  let next = all.filter((x) => !x.done && !x.moved && !x.skipped && x.at != null && x.at >= nm - 20).sort((a, b) => a.at - b.at);
  let label = 'Coming up';
  if (next.length < 3) {
    // Peek at tomorrow without creating it: a day built now would freeze
    // against any routine or plan change made later today.
    const d = addDays(ymd(), 1);
    const tm = S.days[d] || previewDay(d);
    const tomorrow = [...tag(tm, 'task', 24 * 60), ...tag(tm, 'meal', 24 * 60)]
      .filter((x) => !x.done && !x.moved && !x.skipped && x.at != null).sort((a, b) => a.at - b.at).slice(0, 3 - next.length);
    if (tomorrow.length) { next = [...next, ...tomorrow]; if (!next.some((x) => x.at < 24 * 60)) label = 'Tomorrow'; }
  }
  next = next.slice(0, 3);
  if (!done.length && !next.length) return '';

  const nowLine = done.length && next.length
    ? `<div class="nowline"><span></span><div class="lbl" style="color:#2b5cff">${label}</div><span></span></div>`
    : '';
  const head = done.length ? 'Just done' : label;
  return `<div class="lbl grp-lbl" style="margin-bottom:8px">${head}</div><div class="card list">${done.map((x) => flowRow(x, nm)).join('')}${nowLine}${next.map((x) => flowRow(x, nm)).join('')}</div>`;
}

/*
 * Missed. Anything whose time went by without an answer used to just fall off
 * the front page, so a day quietly ended incomplete with no idea why. Now it
 * sits here in red with a question mark until he says what happened. An hour
 * of grace first, because he runs late and that is not a miss.
 */
const MISS_GRACE = 60;
function missedItems(day, nm) {
  const late = (x) => {
    if (x.done || x.moved || x.skipped || !x.time) return false;
    const due = minutes(x.end || x.time);
    return nm - due >= MISS_GRACE;
  };
  return [
    ...day.tasks.filter(late).map((x) => ({ ...x, kind: 'task' })),
    ...day.meals.filter(late).map((x) => ({ ...x, kind: 'meal' }))
  ].sort((a, b) => minutes(a.time) - minutes(b.time));
}
function renderMissed(day, nm) {
  const miss = missedItems(day, nm);
  const el = $('#missed');
  if (!miss.length) { el.innerHTML = ''; return; }
  el.innerHTML =
    `<div class="lbl grp-lbl" style="margin-bottom:8px;color:#b8321f">${miss.length === 1 ? 'One thing went by' : `${miss.length} things went by`}</div>` +
    `<div class="card list">${miss.map((x) => `<div class="row miss" data-id="${x.id}">
      <button class="chk" data-act="toggle" data-kind="${x.kind}" data-id="${x.id}">${ICON_CHECK}</button>
      <div class="txt" data-act="missed" data-kind="${x.kind}" data-id="${x.id}" style="cursor:pointer">
        <div class="t">${esc(x.name)}</div>
        <div class="s">${x.kind === 'meal' ? esc(x.slot) : 'Was'} ${t12s(x.time)}${x.end ? ` to ${t12(x.end)}` : ''}</div>
      </div>
      <button class="stamp q" data-act="missed" data-kind="${x.kind}" data-id="${x.id}">?</button>
    </div>`).join('')}</div>`;
}
/* Tap the question mark: three answers, and one of them is "it is fine". */
function openMissed(kind, id) {
  const f = findItem(kind, id);
  if (!f) return;
  const x = f.it;
  // Pushing a planned meal is meaningless: tomorrow already has it from the
  // plan, so moving it there just makes two. Tasks and one-offs can move.
  const canMove = kind === 'task' || !x.planned;
  openSheet('Went by', x.name, `
    <div class="card" style="padding:16px"><div class="s" style="line-height:1.45">It was ${t12s(x.time)}${x.end ? ` to ${t12(x.end)}` : ''} and it never got checked off. What happened?</div></div>
    <button class="btn blue wide" data-act="miss-did" data-kind="${kind}" data-id="${id}">I did it</button>
    ${canMove ? `<button class="btn wide" data-act="miss-move" data-kind="${kind}" data-id="${id}">Push it to tomorrow</button>` : ''}
    <div class="field"><label for="miss-why">Skipping it? Why (optional)</label><input id="miss-why" placeholder="Ran out of time"></div>
    <button class="btn ghost wide" data-act="miss-skip" data-kind="${kind}" data-id="${id}">Skip it today</button>
  `);
}

/*
 * The strip: errands and one-off reminders, parked above the nav so they are
 * in front of him wherever he is. Tap one to knock it off.
 */
function renderStrip() {
  const open = (S.reminders || []).filter((r) => !r.done);
  const el = $('#strip');
  el.classList.toggle('show', open.length > 0);
  document.body.classList.toggle('has-strip', open.length > 0);
  if (!open.length) { el.innerHTML = ''; return; }
  el.innerHTML = open.map((r) => {
    const old = r.date !== ymd();
    // The tick knocks it off, the words open it for editing. Two targets, one chip.
    return `<div class="rem" data-id="${r.id}"><button class="tick" data-act="rem-done" data-id="${r.id}" aria-label="Done">${ICON_CHECK}</button><button class="rt" data-act="rem-edit" data-id="${r.id}">${esc(r.text)}</button>${old ? `<span class="rd">${niceDate(r.date)}</span>` : ''}</div>`;
  }).join('') + `<button class="rem add" data-act="rem-add"><span class="rt">+ Add</span></button>`;
}
function waterRow(day) {
  const g = S.settings.waterGoal;
  const bars = Array.from({ length: g }, (_, i) => `<div style="width:8px;height:16px;border-radius:2px;background:${i < day.water ? '#1d1d1f' : '#e3ded2'}"></div>`).join('');
  return `<div class="row${day.water >= g ? ' done' : ''}"><button class="chk" data-act="water">${ICON_CHECK}</button><div class="txt"><div class="t">Water · ${day.water} of ${g}</div><div class="s">${day.water >= g ? 'Goal hit' : 'Tap for one more bottle'}</div></div><div style="display:flex;gap:3px">${bars}</div></div>`;
}

function renderFuel() {
  const day = today();
  const m = macrosToday(day);
  $('#cal-so-far').innerHTML = `${m.cal.toLocaleString()}<span>/${S.settings.calGoal.toLocaleString()}</span>`;
  // The hero fills like a glass as the day's calories go in.
  $('#fuel-fill').style.transform = `scaleY(${Math.min(1, m.cal / Math.max(1, S.settings.calGoal)).toFixed(3)})`;
  const sec = ui.section.fuel;
  /*
   * The band used to hold two words pinned to its bottom edge, so most of the
   * day it was a blank orange slab: the liquid only rises with calories, and he
   * fasts until mid afternoon. It now carries the numbers it was named after.
   */
  const left = S.settings.calGoal - m.cal;
  $('#cal-note').textContent = left > 0 ? `cal so far · ${left.toLocaleString()} left` : left === 0 ? 'cal so far · right on it' : `cal so far · ${Math.abs(left).toLocaleString()} over`;
  const eaten = day.meals.filter((x) => x.done && !x.skipped).length;
  const total = day.meals.filter((x) => !x.skipped).length;

  $('#fuel-right').textContent =

  };

    html += `<div style="display:flex;gap:10px"><button class="btn" style="flex:1" data-act="food-talk">${ICON_MIC} Talk it in</button><button class="btn" style="flex:1" data-act="food-snap">${ICON_CAM} Snap a photo</button></div>`;
    html += `<button class="btn blue wide" data-act="advise"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fbfaf7" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M9.5 9.5a2.5 2.5 0 1 1 3 2.45V14"></path><path d="M12 17.2v.01"></path></svg> What fits right now?</button>`;
    html += `<button class="btn ghost wide" data-act="add-meal">+ Add a meal</button>`;

}

function renderBody() {
  const ws = [...S.weights].sort((a, b) => a.date.localeCompare(b.date));
  const last = ws[ws.length - 1];
  const monthAgo = addDays(ymd(), -30);
  const base = [...ws].filter((w) => w.date <= monthAgo).pop() || ws[0];
  const delta = last && base && last !== base ? (last.lb - base.lb) : null;
  $('#w-delta').innerHTML = delta != null ? `${delta > 0 ? '+' : ''}${delta.toFixed(1)}<span> lb</span>` : `<span>no trend yet</span>`;
  $('#w-delta').nextElementSibling.textContent = base && last && base !== last ? `since ${niceDate(base.date)}` : '30 days';
  paintTrendHero(ws);
  const sec = ui.section.body;
  let html = '';
  if (sec === 'weight') {
    const weekAgo = addDays(ymd(), -7);
    const wk = ws.filter((w) => w.date <= weekAgo).pop();
    const wkDelta = last && wk ? last.lb - wk.lb : null;
    const wkTxt = wkDelta == null ? 'No week yet' : `${wkDelta > 0 ? 'Up' : 'Down'} ${Math.abs(wkDelta).toFixed(1)} ${wk.date >= addDays(ymd(), -10) ? 'this week' : 'since ' + niceDate(wk.date)}`;
    const pts = ws.slice(-30);
    let spark = '';
    if (pts.length >= 2) {
      const min = Math.min(...pts.map((p) => p.lb)), max = Math.max(...pts.map((p) => p.lb));
      const span = Math.max(1, max - min);
      const xs = pts.map((p, i) => [(330 * i) / (pts.length - 1), 8 + (54 * (max - p.lb)) / span]);
      spark = `<svg class="spark" viewBox="0 0 330 70" preserveAspectRatio="none"><line x1="0" y1="60" x2="330" y2="60" stroke="#e6e3dc" stroke-width="1.5"></line><line x1="0" y1="35" x2="330" y2="35" stroke="#e6e3dc" stroke-width="1.5"></line><line x1="0" y1="10" x2="330" y2="10" stroke="#e6e3dc" stroke-width="1.5"></line><polyline points="${xs.map((p) => p.join(',')).join(' ')}" fill="none" stroke="#1d1d1f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"></polyline><circle cx="${xs[xs.length - 1][0]}" cy="${xs[xs.length - 1][1]}" r="5" fill="#2b5cff"></circle></svg><div style="display:flex;justify-content:space-between"><div class="s">${niceDate(pts[0].date)} · ${pts[0].lb}</div><div class="s">${niceDate(last.date)} · ${last.lb}</div></div>`;
    } else spark = `<div class="s">Log a couple of weigh-ins and the trend line shows up here.</div>`;
    html += `<div class="card tapme" data-act="trend" data-kind="weight" style="padding:14px 16px 12px;display:flex;flex-direction:column;gap:8px"><div class="weight-hero"><div><div class="lbl">Weight${last ? ' · ' + niceDate(last.date) : ''}</div><div style="display:flex;align-items:baseline;gap:6px"><div class="big">${last ? last.lb : '--'}</div><div class="s">lb</div></div></div><div style="text-align:right"><div class="t" style="color:#2b5cff">${wkTxt}</div><div class="s">Goal ${S.settings.weightGoal} by ${niceDate(S.settings.weightGoalDate)}</div></div></div>${spark}</div>`;
    html += `<div class="card" style="padding:14px 16px;display:flex;align-items:flex-start;gap:12px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2b5cff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;margin-top:1px"><path d="M4 19V5"></path><path d="M4 15l5-5 4 3 6-7"></path><path d="M15 6h4v4"></path></svg><div><div class="lbl">On this trend</div><div class="t" style="margin-top:4px;line-height:1.4;font-size:14.5px">${esc(projectionLine())}</div></div></div>`;
    html += `<button class="btn wide" data-act="weigh">Log weigh-in</button>`;
    if (ws.length) html += `<div class="lbl grp-lbl">Recent</div><div class="card list">${ws.slice(-7).reverse().map((w) => `<div class="row"><div class="txt"><div class="t">${w.lb} lb</div><div class="s">${niceDate(w.date)}</div></div><button class="pill" data-act="drop-weight" data-date="${w.date}">x</button></div>`).join('')}</div>`;
  } else if (sec === 'trends') {
    html += renderTrends();
  } else if (sec === 'photos') {
    const ps = [...S.photos].sort((a, b) => a.date.localeCompare(b.date));
    const p = ps[ps.length - 1];
    html += `<div class="card phys"><div class="pic">${p && p.thumbs[0] ? `<img src="${p.thumbs[0]}" alt="">` : '<svg width="90" height="120" viewBox="0 0 90 120"><circle cx="45" cy="16" r="12" fill="#6d6a63"></circle><path d="M25 40 Q45 30 65 40 L72 82 Q45 90 18 82 Z" fill="#6d6a63"></path><path d="M25 42 L10 78 L18 80 L30 52 Z" fill="#6d6a63"></path><path d="M65 42 L80 78 L72 80 L60 52 Z" fill="#6d6a63"></path><path d="M26 84 L30 118 L42 118 L44 90 Z" fill="#6d6a63"></path><path d="M64 84 L60 118 L48 118 L46 90 Z" fill="#6d6a63"></path></svg>'}${p ? `<div class="tag">${niceDate(p.date)}</div>` : ''}</div><div class="info"><div class="lbl">Est. body fat</div>${p ? `<div style="display:flex;align-items:baseline;gap:6px"><div class="big">${p.est.mid}<span>%</span></div><div class="s">${p.est.low} to ${p.est.high}</div></div><div class="s">${esc(p.est.read || '')}</div>` : `<div class="big">--</div><div class="s">Front and side, same light and pose each Sunday. The trend is the point, not the number.</div>`}</div></div>`;
    if (ps.length) html += `<div class="fold-row"><div class="lbl grp-lbl">Last four</div>${ps.length > 1 ? '<button class="lbl" style="color:#2b5cff;padding:6px 4px" data-act="compare">Compare</button>' : ''}</div><div class="thumbs">${ps.slice(-4).map((x) => `<div class="th">${x.thumbs[0] ? `<img src="${x.thumbs[0]}" alt="">` : ''}<div class="s">${MO[fromYmd(x.date).getMonth()]} ${fromYmd(x.date).getDate()} · ${x.est.mid}%</div></div>`).join('')}</div>`;
    html += `<button class="btn wide" data-act="phys">${ICON_CAM} Add photos</button>`;
    if (p && p.est.photo_tip) html += `<div class="s" style="padding:0 6px">${esc(p.est.photo_tip)}</div>`;
  }
  $('#body-body').innerHTML = html;
}
/*
 * Small charts drawn in place, same hand as the weight line. Bars for
 * counts (steps, calories), a line for a level (resting heart rate).
 */
function chart(points, opts = {}) {
  const pts = [...points].sort((a, b) => a.date.localeCompare(b.date)).slice(-(opts.max || 14));
  if (!pts.length) return `<div class="s">Nothing here yet.</div>`;
  const W = 330, H = 90, top = 8, bottom = 70;
  const vals = pts.map((p) => p.value);
  const lo = opts.zero ? 0 : Math.min(...vals), hi = Math.max(...vals);
  const span = Math.max(1, hi - lo);
  const y = (v) => bottom - ((bottom - top) * (v - lo)) / span;
  const lab = (p) => { const d = fromYmd(p.date); return p.period === 'month' ? MO[d.getMonth()] : `${MO[d.getMonth()]} ${d.getDate()}`; };
  let body = '';
  if (opts.type === 'line') {
    const xs = pts.map((p, i) => [pts.length > 1 ? (W * i) / (pts.length - 1) : W / 2, y(p.value)]);
    body = `<polyline points="${xs.map((q) => q.join(',')).join(' ')}" fill="none" stroke="#1d1d1f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"></polyline>${xs.map((q, i) => `<circle cx="${q[0]}" cy="${q[1]}" r="${i === xs.length - 1 ? 5 : 3.5}" fill="${i === xs.length - 1 ? '#2b5cff' : '#1d1d1f'}"></circle>`).join('')}`;
  } else {
    const bw = Math.min(22, (W / pts.length) * 0.62);
    body = pts.map((p, i) => { const x = (W * (i + 0.5)) / pts.length - bw / 2; const yy = y(p.value); return `<rect x="${x}" y="${yy}" width="${bw}" height="${bottom - yy}" rx="${bw / 2}" fill="${i === pts.length - 1 ? '#2b5cff' : '#1d1d1f'}"></rect>`; }).join('');
    if (opts.goal != null && opts.goal >= lo && opts.goal <= hi) body += `<line x1="0" y1="${y(opts.goal)}" x2="${W}" y2="${y(opts.goal)}" stroke="#2b5cff" stroke-width="1.5" stroke-dasharray="4 4"></line>`;
  }
  const grid = [top, (top + bottom) / 2, bottom].map((g) => `<line x1="0" y1="${g}" x2="${W}" y2="${g}" stroke="#e6e3dc" stroke-width="1.5"></line>`).join('');
  const first = pts[0], last = pts[pts.length - 1];
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px;display:block" preserveAspectRatio="none">${grid}${body}</svg><div style="display:flex;justify-content:space-between"><div class="s">${lab(first)} · ${opts.fmt ? opts.fmt(first.value) : first.value}</div><div class="s">${lab(last)} · ${opts.fmt ? opts.fmt(last.value) : last.value}</div></div>`;
}
function renderTrends() {

/*
 * Tapping a trend. The card gives one number and a sparkline; this is the
 * rest of it: the spread, the direction, every reading, and a plain reading of
 * what the movement actually means for him rather than a generic definition.
 */
function trendStats(pts) {
  if (!pts.length) return null;
  const v = pts.map((p) => p.value);
  const first = v[0], last = v[v.length - 1];
  return {
    first, last, min: Math.min(...v), max: Math.max(...v),
    mean: Math.round(v.reduce((a, b) => a + b, 0) / v.length),
    delta: last - first, n: v.length,
    from: pts[0].date, to: pts[pts.length - 1].date
  };
}
const TREND_META = {
  steps: {
    title: 'Steps', lbl: 'Steps · weekly', unit: '', each: 'a week',
    read: (s, goal) => {
      const over = s.mean >= goal;
      return `Your weekly average runs ${s.mean.toLocaleString()} a day against a ${goal.toLocaleString()} goal, so you are ${over ? 'clearing it on average' : `about ${(goal - s.mean).toLocaleString()} short on a typical week`}. The spread from ${s.min.toLocaleString()} to ${s.max.toLocaleString()} is the part worth watching: a quiet week is where a cut stalls, because steps are most of your daily burn outside the gym.`;
    }
  },
  rhr: {
    title: 'Resting heart rate', lbl: 'Resting heart rate', unit: ' bpm', each: 'a month',
    read: (s) => {
      const dir = s.delta > 1 ? 'up' : s.delta < -1 ? 'down' : 'flat';
      const base = `Resting heart rate drifts down as conditioning improves and up with short sleep, alcohol, illness, or hard training you have not recovered from.`;
      if (dir === 'flat') return `${base} Yours has held around ${s.mean} bpm, which is what you want while cutting.`;
      return `${base} Yours has gone ${dir} ${Math.abs(s.delta)} bpm across these readings, from ${s.first} to ${s.last}. ${s.delta > 0 ? 'A rise while eating in a deficit usually means recovery, not fitness: check sleep and how hard the last few sessions were.' : 'That is the direction conditioning moves it.'}`;
    }
  },
  energy: {
    title: 'Energy burned', lbl: 'Energy burned · weekly', unit: ' cal', each: 'a week',
    read: (s) => {
      const gap = Math.max(0, s.mean - S.settings.calGoal);
      const onPaper = (gap * 7) / 3500;
      const p = projection();
      const real = p && p.perWeek ? Math.abs(p.perWeek) : null;
      return `You burn about ${s.mean.toLocaleString()} calories a day across these weeks, ranging ${s.min.toLocaleString()} to ${s.max.toLocaleString()}. Against a ${S.settings.calGoal.toLocaleString()} calorie day that is a ${gap.toLocaleString()} calorie gap, which on paper is ${onPaper.toFixed(1)} lb a week. ${real ? `The scale says ${real.toFixed(1)}. Trust the scale: the watch is overcounting, which is normal, and your real deficit is nearer ${Math.round((real * 3500) / 7).toLocaleString()} a day.` : 'Nothing loses that fast in practice. Wearables overcount burn, so treat it as a direction, not a number, and let the scale settle the argument.'}`;
    }
  },
  weight: {
    title: 'Weight', lbl: 'Weight', unit: ' lb', each: 'reading',
    read: (s) => {
      const p = projection();
      return `${s.n} weigh-ins from ${niceDate(s.from)} to ${niceDate(s.to)}, ${s.first} down to ${s.last} lb, low of ${s.min}. ${p && p.perWeek ? projectionLine() : 'Log a few more and this will project a date for 180.'} Weigh at the same time each morning: day to day swings are water and sodium, not fat.`;
    }

};
function trendPoints(kind) {
  if (kind === 'weight') return [...S.weights].sort((a, b) => a.date.localeCompare(b.date)).map((w) => ({ date: w.date, value: w.lb }));
  const fit = S.fit || FIT_SEED();

}
function openTrend(kind) {
  const meta = TREND_META[kind];
  const pts = trendPoints(kind);
  const s = trendStats(pts);
  if (!meta || !s) { toast({ t: 'Nothing logged yet', ms: 3000 }); return; }
  const goal = kind === 'steps' ? S.settings.stepGoal : null;
  const n = (v) => `${Math.round(v).toLocaleString()}${meta.unit}`;
  const cell = (k, v) => `<div><div class="n">${k}</div><div class="v">${v}</div></div>`;
  const dirWord = s.delta === 0 ? 'no change' : `${s.delta > 0 ? '+' : ''}${(Math.round(s.delta * 10) / 10).toLocaleString()}${meta.unit}`;
  openSheet(meta.lbl, n(s.last), `
    <div class="card macs">${cell('Average', n(s.mean))}${cell('Lowest', n(s.min))}${cell('Highest', n(s.max))}${cell('Change', dirWord)}</div>
    <div class="card" style="padding:14px 16px 12px">${chart(pts, kind === 'rhr' || kind === 'weight' ? { type: 'line', max: 24 } : { type: 'bar', zero: true, max: 24, goal, fmt: (v) => v.toLocaleString() })}</div>
    <div class="card" style="padding:14px 16px"><div class="lbl">What it means</div><div class="s" style="margin-top:6px;line-height:1.45;color:#3a3a3a">${esc(meta.read(s, goal))}</div></div>
    <div class="card"><div class="lbl" style="padding:14px 16px 4px">Every reading · ${s.n}</div><div class="list">${[...pts].reverse().slice(0, 24).map((p) => `<div class="row"><div class="txt"><div class="t">${n(p.value)}</div><div class="s">${niceDate(p.date)}${p.period ? ` · per ${p.period}` : ''}</div></div></div>`).join('')}</div></div>
  `);
}

/* The weight line, drawn faintly across the Body hero. */
function paintTrendHero(ws) {
  const el = $('#body-trend');
  const pts = ws.slice(-24);

  // Kept to the top third so it never runs through the words.

  const lo = Math.min(...pts.map((p) => p.lb)), hi = Math.max(...pts.map((p) => p.lb));
  const span = Math.max(0.5, hi - lo);
  const xy = pts.map((p, i) => [8 + ((W - 16) * i) / (pts.length - 1), bottom - ((bottom - top) * (p.lb - lo)) / span]);

    + `<polyline points="${d}" style="--len:${Math.ceil(len)};stroke-dasharray:${Math.ceil(len)}"></polyline>`
    + `<circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="5" style="transform-origin:${last[0].toFixed(1)}px ${last[1].toFixed(1)}px"></circle>`

}

function renderBoard() {

  $('#board-blocks').innerHTML = [...items.map((x) => x.done), day.water >= S.settings.waterGoal].map((on, i) => `<i class="${on ? 'on' : ''}" style="--d:${(i * 0.045).toFixed(3)}s"></i>`).join('');
  const sec = ui.section.board;
  let html = '';
  const all = [...day.meals.map((m) => ({ ...m, kind: 'meal' })), ...day.tasks.map((t) => ({ ...t, kind: 'task' }))];
  if (sec === 'today') {
    const bucket = (x) => { const t = x.time ? minutes(x.time) : 12 * 60; return t < 12 * 60 ? 'Morning' : t < 17 * 60 ? 'Afternoon' : 'Evening'; };

  } else if (sec === 'week') {

    html += mv.length ? `<div class="lbl grp-lbl">Off today's board</div><div class="card list">${mv.map((x) => rowHTML(x, 'task')).join('')}</div>` : '';
    html += later.length ? `<div class="lbl grp-lbl">Coming up</div><div class="card list">${later.map((x) => `<div class="row" data-id="${x.id}"><div class="chk">${ICON_MOVE}</div><div class="txt"><div class="t">${esc(x.name)}</div><div class="s">${niceDate(x.date)}${x.time ? ' · ' + t12(x.time) : ''}${x.movedFrom ? ' · moved from ' + niceDate(x.movedFrom) : ''}</div></div></div>`).join('')}</div>` : '';
    if (!mv.length && !later.length) html += `<div class="card" style="padding:18px"><div class="t">Nothing moved.</div><div class="s" style="margin-top:4px">"Push the gym to tomorrow" lands here.</div></div>`;

/*
 * The week: Monday to Sunday, the routine for each day with what actually
 * happened. Days already in the log show their real items (moved, done,
 * added by voice); days not yet opened show the routine as planned.
 */
function renderWeek() {
  const t = ymd();
  const dow = fromYmd(t).getDay();
  const monday = addDays(t, -((dow + 6) % 7));
  let html = '';
  let hit = 0, total = 0;
  const cards = [];
  for (let i = 0; i < 7; i++) {
    const d = addDays(monday, i);
    const wd = WD[fromYmd(d).getDay()];
    const stored = S.days[d];
    const items = stored ? stored.tasks.filter((x) => !x.moved) : (S.routine[wd] || []).map((x, k) => ({ id: `plan-${d}-${k}`, name: x.name, time: x.time, end: x.end || null, done: false, planned: true }));
    const isToday = d === t, past = d < t;
    items.forEach((x) => { if (!x.skipped) { total++; if (x.done) hit++; } });
    const rows = items.length
      ? items.map((x) => {
          const tag = x.done ? '<div class="stamp">DONE</div>' : x.skipped ? '<div class="stamp" style="border-color:#6d6a63;color:#6d6a63;box-shadow:0 2px 0 #cfccc4">SKIP</div>' : past && !x.planned ? '<div class="stamp" style="border-color:#b8321f;color:#b8321f;box-shadow:0 2px 0 #f0c4bc">MISSED</div>' : x.time ? `<div class="time" style="${!isToday ? 'color:#6d6a63' : ''}">${t12s(x.time)}</div>` : '';
          const chk = d > t ? `<div class="chk" style="box-shadow:none;border-style:dashed"></div>` : `<button class="chk" data-act="toggle-day" data-date="${d}" data-id="${x.id}">${ICON_CHECK}</button>`;
          return `<div class="row${x.done ? ' done' : ''}${x.skipped ? ' moved' : ''}" data-id="${x.id}">${chk}<div class="txt"><div class="t">${esc(x.name)}</div><div class="s">${x.done && x.doneAt ? 'Done ' + t12s(x.doneAt) : x.time ? spanTxt(x) : 'No time set'}</div></div>${tag}</div>`;
        }).join('')
      : `<div class="row"><div class="txt"><div class="s">Rest day</div></div></div>`;
    cards.push(`<div class="lbl grp-lbl" style="${isToday ? 'color:#2b5cff' : ''}">${WDL[fromYmd(d).getDay()]}${isToday ? ' · today' : ''} · ${MO[fromYmd(d).getMonth()]} ${fromYmd(d).getDate()}</div><div class="card list"${isToday ? ' style="box-shadow:0 0 0 2.5px #2b5cff, 0 6px 0 #cfccc4"' : ''}>${rows}</div>`);
  }
  html += `<div class="card" style="padding:14px 16px;display:flex;align-items:center;justify-content:space-between"><div><div class="lbl">This week</div><div class="big" style="font-size:28px;margin-top:4px">${hit}<span style="color:#6d6a63">/${total}</span></div></div><div style="display:flex;gap:4px">${Array.from({ length: 7 }, (_, i) => { const d = addDays(monday, i); const st = S.days[d]; const items = st ? st.tasks.filter((x) => !x.moved && !x.skipped) : []; const all = items.length && items.every((x) => x.done); const some = items.some((x) => x.done); return `<div style="width:12px;height:28px;border-radius:3px;background:${all ? '#2b5cff' : some ? '#9db3ff' : d === t ? '#1d1d1f' : 'rgba(29,29,31,0.15)'}"></div>`; }).join('')}</div></div>`;
  html += cards.join('');
  html += `<div class="chips"><button class="pill" data-act="edit-routine">Edit the routine</button></div>`;
  return html;
}

function dayCard(date, day) {

const CHAT_IMG_KEEP = 12;
function addChat(role, text, ops, imgs) {
  if (!Array.isArray(S.chat)) S.chat = [];
  const m = { role, text, ops: ops || null, at: nowHM(), date: ymd() };
  if (imgs && imgs.length) m.imgs = imgs;
  S.chat.push(m);
  if (S.chat.length > 300) S.chat = S.chat.slice(-300);
  let kept = 0;
  for (let i = S.chat.length - 1; i >= 0; i--) {
    const c = S.chat[i];
    if (!c.imgs) continue;
    kept += c.imgs.length;
    if (kept > CHAT_IMG_KEEP) { c.shed = c.imgs.length; delete c.imgs; }
  }
}

function toast({ t, s, cls = '', undo: canUndo = false, ms = 3600 }) {
  const el = document.createElement('div');
  el.className = `toast ${cls}`;
  el.innerHTML = `<div class="txt"><div class="t">${esc(t)}</div>${s ? `<div class="s">${esc(s)}</div>` : ''}</div>${canUndo ? '<button class="undo">Undo</button>' : ''}`;
  if (canUndo) el.querySelector('.undo').addEventListener('click', () => { undo(); kill(); });
  $('#toasts').appendChild(el);
  const kill = () => { el.classList.add('out'); setTimeout(() => el.remove(), 260); };
  el.addEventListener('click', (e) => { if (!e.target.closest('.undo')) kill(); });
  setTimeout(kill, ms);
}
