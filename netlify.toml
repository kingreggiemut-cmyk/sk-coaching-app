[build]
  functions = "netlify/functions"

# Supabase URL + anon key are PUBLIC client keys (they ship in the browser code by
# design; access is protected by row-level security). Tell Netlify's secret scanner
# not to flag them. The real secret, ANTHROPIC_API_KEY, is never in the code, so it
# stays fully scanned/protected.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,SUPABASE_ANON_KEY"

# ---------------------------------------------------------------------------
# ASSET CACHING. Netlify defaults every file to `max-age=0, must-revalidate`,
# so a repeat visit re-checks ~47 files before the playbook can paint - and the
# Squarespace iframe pays that on every page view. The art is large and changes
# rarely, so cache it for a week.
# Deliberately scoped to the ASSET FOLDERS only: the .html playbooks keep the
# default so a deploy is live immediately. A rule that fails to match simply
# does nothing, which is why these are listed explicitly rather than as a broad
# /playbooks/* rule that could pin stale HTML for a week.
# Both raw and %20 spellings are listed because the match runs against the URL.
# ---------------------------------------------------------------------------

[[headers]]
  for = "/playbooks/3d Stadium assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/playbooks/3d%20Stadium%20assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

