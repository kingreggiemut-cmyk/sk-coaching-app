const DB_INSTALL_CAP = DB_INSTALL_SECTIONS.reduce((n, s) => n + s.cap, 0);   // 25
function dbResolveChain(drive, path){
  let chain = drive.main;
  for(let k = 0; k < path.length; k += 2){ chain = chain[path[k]][path[k+1]]; }
  return chain;
}
function dbResolveNode(drive, nodePath){
  const chain = dbResolveChain(drive, nodePath.slice(0, -1));
  return chain[nodePath[nodePath.length - 1]];
}
const dbPathKey  = p => p.join(".");
const dbChainKey = p => "c:" + p.join(".");
const dbParseKey = k => k.replace(/^c:/, "").split(".").filter(s => s !== "")
                         .map(s => /^\d+$/.test(s) ? +s : s);

/* --- the build-mode web: recursive pan/zoom tree (ported verbatim) --- */
function dbLayoutSpine(chain, chainPath, sideClass, connectBase){
  const res = { nodes:[], strands:[], addSlots:[] };
  let spanMin = -DB_HALFW, spanMax = DB_HALFW, prevY = 0;
  const isTrunk = sideClass === "";
  chain.forEach((node, idx) => {
    const y = prevY - DB_ROW, path = [...chainPath, idx];
    const firstOfBranch = idx === 0 && !isTrunk;
    const goal     = isTrunk && idx === chain.length - 1;
    const chipCls  = goal ? "goal" : (firstOfBranch ? sideClass : "");
    const badge    = firstOfBranch ? (sideClass === "br-left" ? "★" : "↺") : String(idx + 1);
    const badgeCls = firstOfBranch ? sideClass : "";
    res.nodes.push({ x:0, y, path, name:dbPlayName(node.play), sub:dbPlaySub(node.play) || node.sit,
      sit:node.sit, play:node.play, chipCls, badge, badgeCls, roleTags:node.roleTags || [] });
    if(idx > 0 || connectBase)
      res.strands.push({ kind:"L", x1:0, y1:prevY, x2:0, y2:y, cls:"" });
    ["left","right"].forEach(side => {
      const br = node[side];
      if(br && br.length){
        const bCls = side === "left" ? "br-left" : "br-right";
        const sub = dbLayoutSpine(br, [...path, side], bCls, false);
        const offset = side === "left" ? spanMin - DB_GAP - sub.spanMax
                                       : spanMax + DB_GAP - sub.spanMin;
        sub.nodes.forEach(n    => res.nodes.push({ ...n, x:n.x + offset, y:n.y + y }));
        sub.strands.forEach(s  => res.strands.push(dbShiftStrand(s, offset, y)));
        sub.addSlots.forEach(a => res.addSlots.push({ ...a, x:a.x + offset, y:a.y + y }));
        const fy = y - DB_ROW;
        res.strands.push({ kind:"C", cls:bCls,
          x1:0, y1:y, c1x:offset * 0.45, c1y:y, c2x:offset, c2y:y - DB_ROW * 0.5, x2:offset, y2:fy });
        spanMin = Math.min(spanMin, offset + sub.spanMin);
        spanMax = Math.max(spanMax, offset + sub.spanMax);
      }
    });
    prevY = y;
  });
  const tipY = prevY - DB_ROW;
  res.addSlots.push({ x:0, y:tipY, chainPath });
  res.strands.push({ kind:"L", x1:0, y1:prevY, x2:0, y2:tipY, cls:"", stub:true });
  res.spanMin = spanMin; res.spanMax = spanMax;
  return res;
}
const dbShiftStrand = (s, dx, dy) => s.kind === "L"
  ? { ...s, x1:s.x1+dx, y1:s.y1+dy, x2:s.x2+dx, y2:s.y2+dy }
  : { ...s, x1:s.x1+dx, y1:s.y1+dy, c1x:s.c1x+dx, c1y:s.c1y+dy,
      c2x:s.c2x+dx, c2y:s.c2y+dy, x2:s.x2+dx, y2:s.y2+dy };
const dbStrandD = s => s.kind === "L"
  ? `M ${s.x1.toFixed(1)} ${s.y1.toFixed(1)} L ${s.x2.toFixed(1)} ${s.y2.toFixed(1)}`
  : `M ${s.x1.toFixed(1)} ${s.y1.toFixed(1)} C ${s.c1x.toFixed(1)} ${s.c1y.toFixed(1)}, ${s.c2x.toFixed(1)} ${s.c2y.toFixed(1)}, ${s.x2.toFixed(1)} ${s.y2.toFixed(1)}`;
function dbApplyTransform(){ dbEls.canvas.style.transform = `translate(${dbPanX}px, ${dbPanY}px) scale(${dbZoom})`; }
function dbFitWeb(ctx){
  const pts = ctx.nodes.map(n => ({ x:n.x, y:n.y })).concat(ctx.addSlots.map(s => ({ x:s.x, y:s.y })));
  if(!pts.length) pts.push({ x:0, y:0 });
  let minX=1e9, maxX=-1e9, minY=1e9, maxY=-1e9;
  pts.forEach(p => { minX=Math.min(minX,p.x); maxX=Math.max(maxX,p.x); minY=Math.min(minY,p.y); maxY=Math.max(maxY,p.y); });
  minX-=180; maxX+=180; minY-=80; maxY+=100;
  const L = 310, R = 320;                          // install sheet + play panel
  const W = Math.max(420, innerWidth - L - R), H = innerHeight;
  const treeW = Math.max(1, maxX-minX), treeH = Math.max(1, maxY-minY);
  dbZoom = clamp(Math.min((W*0.86)/treeW, (H*0.8)/treeH), 0.3, 1.12);
  dbPanX = L + W/2 - ((minX+maxX)/2) * dbZoom;
  dbPanY = H/2 - ((minY+maxY)/2) * dbZoom;
  dbApplyTransform();
}
function dbRenderWeb(){
  const main = dbCurrent().main;
  const ctx = dbLayoutSpine(main, [], "", true);
  dbEls.strands.innerHTML = ctx.strands.map(s => {
    const d = dbStrandD(s);
    const base = `<path class="db-tstrand ${s.cls}" d="${d}"/>`;
    return s.stub ? base
      : base + `<path class="db-tpulse ${s.cls}" pathLength="100" d="${d}"/>`;
  }).join("");
  let html = ctx.nodes.map(nd => {
    const key = dbPathKey(nd.path);
    return `<div class="db-tnode ${nd.chipCls} ${dbMenuKey===key ? "menu-open":""} ${dbTagKey===key ? "tags-open":""}"
        data-key="${key}" style="left:${nd.x.toFixed(1)}px; top:${nd.y.toFixed(1)}px">
        <span class="db-tnum ${nd.badgeCls}">${nd.badge}</span>
        <span class="db-tnm">${nd.name}</span>
        ${nd.sub ? `<span class="db-tsub">${nd.sub}</span>` : ""}
        ${nd.roleTags.map((t,i) => `<span class="db-ttag pos-${i}">${t}</span>`).join("")}
        <div class="db-tactions">
          <span class="db-tact pos" data-act="left"  data-key="${key}">＋ Counter</span>
          <span class="db-tact neg" data-act="right" data-key="${key}">＋ Fallback</span>
          <span class="db-tact run" data-act="run"   data-key="${key}">▶ Open</span>
          <span class="db-tact tag" data-act="tags"  data-key="${key}">Tags</span>
          <span class="db-tact rm"  data-act="rm"    data-key="${key}">Remove</span>
        </div>
        <div class="db-tagpicker">
          ${DB_ROLE_TAGS.map(t => `<button class="db-tagopt${nd.roleTags.includes(t) ? " on":""}" data-tagkey="${key}" data-tagval="${t}">${t}</button>`).join("")}
        </div>
      </div>`;
  }).join("");
  html += ctx.addSlots.map(sl => {
    const ck = dbChainKey(sl.chainPath);
    const isArmed = dbArmed && dbChainKey(dbArmed.chainPath) === ck;
    const label = (sl.chainPath.length === 0 && !main.length) ? "＋ Add the first call" : "＋ Add Call";
    return `<button class="db-tadd ${isArmed ? "armed":""}" data-chain="${ck}" style="left:${sl.x.toFixed(1)}px; top:${sl.y.toFixed(1)}px">${label}</button>`;
  }).join("");
  if(!main.length){
    html += `<div class="db-tempty" style="left:0px; top:${-DB_ROW*2}px">Pick a play on the right, then tap <strong style="color:#F5A623">＋</strong> to drop it in.</div>`;
  }
  dbEls.nodes.innerHTML = html;
  dbWireWeb();
  dbCapSet(dbPromptText());
  if(dbNeedsFit){ dbFitWeb(ctx); dbNeedsFit = false; } else { dbApplyTransform(); }
}
function dbPromptText(){
  if(dbArmed){
    const p = dbArmed.chainPath, last = p[p.length - 1];
    if(!p.length) return "Adding your next call - tap <strong style=\"color:#F5A623\">＋</strong> on a play.";
    if(last === "left")  return "Adding a <strong style=\"color:#7fe0a0\">counter</strong> (if they bite) - tap <strong style=\"color:#F5A623\">＋</strong> on a play.";
    if(last === "right") return "Adding a <strong style=\"color:#9ab4ff\">fallback</strong> (it stalled) - tap <strong style=\"color:#F5A623\">＋</strong> on a play.";
    return "Adding to this branch - tap <strong style=\"color:#F5A623\">＋</strong> on a play.";
  }
  if(dbDrive === null) return "King Reggie's recommended drive - tap any call to branch it, or ＋ a play to make it your own. Drag to pan, scroll to zoom.";
  return dbCurrent().main.length
    ? "Your drive - tap any call to branch a counter / fallback, or ＋ a play to extend it."
    : "Empty drive - pick a play and tap ＋ to start your script.";
}
function dbWireWeb(){
  dbEls.nodes.querySelectorAll(".db-tadd").forEach(b =>
    b.addEventListener("click", (e) => {
      e.stopPropagation();
      const cp = dbParseKey(b.dataset.chain);
      dbArmed = (dbArmed && dbChainKey(dbArmed.chainPath) === dbChainKey(cp)) ? null : { chainPath:cp };
      dbMenuKey = null; dbTagKey = null; dbRenderWeb();
    }));
  dbEls.nodes.querySelectorAll(".db-tnode").forEach(node =>
    node.addEventListener("click", (e) => {
      if(e.target.closest(".db-tact, .db-tagopt")) return;
      if(dbWasPanning) return;
      const key = node.dataset.key;
      dbMenuKey = (dbMenuKey === key) ? null : key;
      dbTagKey = null; dbArmed = null; dbRenderWeb();
    }));
  dbEls.nodes.querySelectorAll(".db-tagopt").forEach(b =>
    b.addEventListener("click", (e) => {
      e.stopPropagation();
      dbEnsureEditable();
      const node = dbResolveNode(dbDrive, dbParseKey(b.dataset.tagkey));
      if(!node) return;
      node.roleTags = node.roleTags || [];
      const i = node.roleTags.indexOf(b.dataset.tagval);
      if(i >= 0) node.roleTags.splice(i, 1);
      else if(node.roleTags.length < 3) node.roleTags.push(b.dataset.tagval);
      dbRenderWeb();
    }));
  dbEls.nodes.querySelectorAll(".db-tact").forEach(b =>
    b.addEventListener("click", (e) => {
      e.stopPropagation();
      const path = dbParseKey(b.dataset.key), act = b.dataset.act;
      if(act === "left" || act === "right"){
        dbArmed = { chainPath:[...path, act] };
        dbMenuKey = null; dbRenderWeb();
      } else if(act === "run"){
        const node = dbResolveNode(dbCurrent(), path);
        dbMenuKey = null; if(node) dbShowCard(node.play);
      } else if(act === "tags"){
        dbTagKey = (dbTagKey === b.dataset.key) ? null : b.dataset.key;
        dbMenuKey = null; dbRenderWeb();
      } else if(act === "rm"){
        dbEnsureEditable();
        const container = dbResolveChain(dbDrive, path.slice(0, -1));
        container.splice(path[path.length - 1], 1);
        dbMenuKey = null; dbArmed = null; dbRenderWeb();
      }
    }));
}
function dbAddCall(playId){
  dbEnsureEditable();
  const c = dcall(playId, DB_CATS[dbCat].btn, "");
  const path = (dbArmed && dbArmed.chainPath) ? dbArmed.chainPath : [];
  dbResolveChain(dbDrive, path).push(c);
  dbArmed = null;
  dbRenderWeb();
}
/* pan / zoom on the web canvas */
let dbPanning = false, dbWasPanning = false, dbSX = 0, dbSY = 0, dbSPX = 0, dbSPY = 0;
dbEls.webLayer.addEventListener("pointerdown", (e) => {
  if(dbMode !== 'build') return;
  dbWasPanning = false;
  if(e.target.closest(".db-tnode, .db-tadd, .db-tact")) return;
  dbPanning = true; dbSX = e.clientX; dbSY = e.clientY; dbSPX = dbPanX; dbSPY = dbPanY;
  dbEls.webLayer.classList.add("grabbing");
  try { dbEls.webLayer.setPointerCapture(e.pointerId); } catch(_){}
});
dbEls.webLayer.addEventListener("pointermove", (e) => {
  if(!dbPanning) return;
  const dx = e.clientX - dbSX, dy = e.clientY - dbSY;
  if(Math.abs(dx) + Math.abs(dy) > 4) dbWasPanning = true;
  dbPanX = dbSPX + dx; dbPanY = dbSPY + dy; dbApplyTransform();
});
const dbEndPan = ()=>{ if(!dbPanning) return; dbPanning = false; dbEls.webLayer.classList.remove("grabbing"); };
dbEls.webLayer.addEventListener("pointerup", dbEndPan);
dbEls.webLayer.addEventListener("pointercancel", dbEndPan);
dbEls.webLayer.addEventListener("wheel", (e) => {
  if(dbMode !== 'build') return;
  e.preventDefault();
  const mx = e.clientX, my = e.clientY;
  const old = dbZoom, vx = (mx - dbPanX) / old, vy = (my - dbPanY) / old;
  dbZoom = clamp(dbZoom * (e.deltaY < 0 ? 1.12 : 0.89), 0.35, 1.5);
  dbPanX = mx - vx * dbZoom; dbPanY = my - vy * dbZoom;
  dbApplyTransform();
}, { passive:false });
dbEls.webLayer.addEventListener("click", (e) => {
  if(dbMode !== 'build' || dbWasPanning) return;
  if(e.target.closest(".db-tnode, .db-tact, .db-tadd")) return;
  if(dbMenuKey !== null || dbArmed !== null || dbTagKey !== null){
    dbMenuKey = null; dbArmed = null; dbTagKey = null; dbRenderWeb();
  }
});

/* Save the built drive to the member's profile via the sealed auth/Supabase
   layer (window.ORPB.saveDrive). Free to browse; the sign-in modal pops on the
   first save only. Saves whatever is on screen — a custom script or King
   Reggie's recommended drive if they haven't edited it. */
let dbSaving = false;
async function dbSaveDrive(){
  if(dbSaving) return;
  const btn = document.getElementById('dbBtnSave');
  const bridge = window.ORPB;
  if(!bridge || typeof bridge.saveDrive !== 'function'){
    dbCapSet('Saving isn\'t available right now. Try reopening the playbook.'); return;
  }
  const drive = dbCloneDrive(dbCurrent());
  if(!drive.main || !drive.main.length){
    dbCapSet('Add at least one call to your drive before saving it.'); return;
  }
  const first = drive.main[0];
  const fp = first ? DB_PLAYS.find(p => p.id === first.play) : null;
  const title = (fp ? `${fp.name} Drive` : 'Drive') + ` · ${new Date().toLocaleDateString()}`;

  dbSaving = true;
  btn.classList.add('saving');
  btn.querySelector('.db-save-tx').textContent = 'Saving…';
  dbCapSet('Saving your drive to your profile…');

  const res = await bridge.saveDrive(drive, { title, reason:'save this drive' });

  dbSaving = false;
  btn.classList.remove('saving');
  const tx = btn.querySelector('.db-save-tx');
  if(res && res.ok){
    btn.classList.add('saved');
    tx.textContent = 'Saved';
    dbCapSet('Drive saved to your profile. It\'s in your coaching app under Play Library.');
    setTimeout(()=>{ btn.classList.remove('saved'); tx.textContent = 'Save Drive'; }, 2800);
  } else if(res && res.reason === 'cancelled'){
    tx.textContent = 'Save Drive';
    dbCapSet(dbPromptText());
  } else {
    tx.textContent = 'Save Drive';
    dbCapSet('Couldn\'t save the drive. Try again or check your connection.');
  }
}

/* THE WVU HUB IS THE FRONT DOOR: opening this file plainly lands you in the
   Morgantown street, no query string needed (?hub=1 still works for old links).
   Everything else is opt-in and takes the war-room path:
     ?field=1  the Drive Builder    ?sheet=1  the coaching app's call-sheet embed
     ?play=id  a play deep link     ?hub=0    the legacy war-room table
   One source of truth - the cover and init must never disagree about the mode. */
function wvIsHubMode(){
  const P = new URLSearchParams(location.search);
  return !(P.get('field') === '1' || P.has('sheet') || P.get('play') || P.get('hub') === '0');
}
let warReady = false, warPendingOpen = false;
function openWarRoom(){
  const b = document.getElementById('cvOpen');
  if(!warReady){ warPendingOpen = true; if(b) b.classList.add('warming'); return; }
  document.body.classList.remove('covering');
  const cover = document.getElementById('warCover');
  cover.classList.add('lift');
  setTimeout(() => cover.classList.add('hidden'), 520);
  const vid = document.getElementById('cv-vid'); if(vid){ try{ vid.pause(); }catch(e){} }
  document.body.classList.add('bhOn');                // the board is the room now
  /* the arrival ceremony runs ONCE: board drops, cards pin up after it. The
     class comes back off so backing out of a section lands on a settled board
     instead of replaying the whole entrance every time. */
  document.body.classList.add('bhIntro');
  setTimeout(() => document.body.classList.remove('bhIntro'), 1500);
}
function warCoverReady(){
  warReady = true;
  const b = document.getElementById('cvOpen'); if(b) b.classList.remove('warming');
  if(warPendingOpen) openWarRoom();
}
/* Boot stopped for a reason the user can't fix by waiting. Say it on the cover:
   #hud sits at z30 and the landing at z50, so a message written to the hud during
   boot is painted UNDERNEATH the landing and never seen. */
function coverFatal(html){
  const cover = document.getElementById('warCover');
  if(!cover){ hud.innerHTML = html; return; }
  cover.classList.remove('hidden', 'lift');
  const btn = document.getElementById('cvOpen'); if(btn) btn.remove();
  const box = document.createElement('div'); box.className = 'cv-fatal'; box.innerHTML = html;
  (cover.querySelector('.cv-in') || cover).appendChild(box);
}
function buildWarCover(){
  document.body.classList.add('covering');            // keep the deck hidden behind the landing
  const track = document.getElementById('cvTrack'), dotsW = document.getElementById('cvDots');
  const vid = document.getElementById('cv-vid');
  /* Ohio State has no stadium video rendered yet, so the hub cover shows the
     static placeholder image (set as the <video>'s poster, no src to play).
     The embed/field modes still use their loop. */
  if(vid){
    if(wvIsHubMode()){
      vid.poster = encodeURI('Bears Assets/Bears Stadium Background.jpg');
    } else if(WAR_ROOM.backdrop && WAR_ROOM.backdrop.loop){
      vid.src = encodeURI(WAR_ROOM.backdrop.loop); vid.play().catch(()=>{});
    }
  }
  const stamp = document.getElementById('cvStamp');
  if(stamp) stamp.innerHTML = CV_CROWN + '<span>Scheme Kings · Premium Playbook</span>';
  if(!track || !dotsW) return;
  track.innerHTML = WAR_COVER_TOUR.map((s,i) =>
    `<div class="cv-slide${i===0?' on':''}" data-i="${i}">
       <div class="cv-shot">${warMock(s.mock)}</div>
       <div class="cv-cap"><div class="cv-num">Feature ${i+1} / ${WAR_COVER_TOUR.length}</div>
         <div class="cv-title2">${s.title}</div><p class="cv-desc">${s.desc}</p></div>
     </div>`).join('');
  dotsW.innerHTML = WAR_COVER_TOUR.map((_,i) => `<button class="cv-dot${i===0?' on':''}" data-i="${i}" aria-label="Feature ${i+1}"></button>`).join('');
  const slides = [...track.querySelectorAll('.cv-slide')], dots = [...dotsW.querySelectorAll('.cv-dot')];
  let idx = 0, timer = null, stopped = false;
  const show = n => { n = (n+slides.length)%slides.length; slides.forEach((s,i)=>s.classList.toggle('on',i===n)); dots.forEach((d,i)=>d.classList.toggle('on',i===n)); idx = n; };
  const take = n => { stopped = true; clearInterval(timer); show(n); };
  if(!matchMedia('(prefers-reduced-motion: reduce)').matches) timer = setInterval(() => { if(!stopped) show(idx+1); }, 6500);
  document.getElementById('cvNext').addEventListener('click', () => take(idx+1));
  document.getElementById('cvPrev').addEventListener('click', () => take(idx-1));
  dots.forEach((d,i) => d.addEventListener('click', () => take(i)));
  document.getElementById('cvOpen').addEventListener('click', openWarRoom);
}

/* Grab one frame of the REAL 3D Autzen field (the same stadium the Drive Builder
   is built on) straight off the renderer, and use it as the cover's Drive Builder
   window. Runs once after the world loads, hidden behind the cover; snapToField /
   snapToRoom bracket it so the live scene is left exactly as it was. */
/* ============================================================================
   DIORAMA HUB  (prototype - open with ?hub=1)
   The next-generation navigation. A locked camera looks out across a coded
   grass field toward the REAL 3D Milan Puskar stadium far in the distance.
   Standing on the grass between us and the stadium: a midground "town" of
   upright WVU billboards (flat art that turns to face the camera), with
   background buildings + trees flanking the stadium. The section deck lies
   fanned out on the grass in front of us (Oregon cards for now). The WVU
   skyline video is the sky. The camera can't move or zoom yet - it just
   DRIFTS with the cursor for a parallax collage feel. Built additively; the
   classic table hub is untouched.
   ============================================================================ */
(async function init(){
  /* THE SLIM BOOT. The old boot built a full 3D world (room, table, deck,
     entrances, diorama town) before anyone could click a card. Now the cover
     paints, the board stands behind it, and Open Playbook just lifts the lid. */
  buildWarCover();
  if(location.protocol === 'file:'){
    coverFatal('<b>Start the server first</b>'
      + '<span>Browsers refuse to load this playbook\'s art from a '
      + '<code>file://</code> address. Open it through the launcher page instead.</span>');
    return;
  }
  buildBearsHome();
  warCoverReady();
})().catch(e=>{ hud.textContent = 'Load failed: ' + e.message; console.error(e); });

/* ==========================================================================
   ABOUT v4 - THE CASE BOARD. (ORPB-ABOUT-CSS)
   The board is an investigation wall: a pinned case-file card, every stat a
   physical piece of pinned evidence, red string tying it all together.
   The principle takeover: collage split banner (giant gold title left, the
   write-up right) with its proof pinned to the floating room below.
   ========================================================================== */
#takeover .ab2-card{ position:absolute; inset:0; width:auto; height:auto; max-height:none;
  padding:0; overflow:hidden; border-radius:0; border:none; background:#140707; }
#takeover .ab2-card .card-close{ position:absolute; top:18px; right:22px; z-index:40;
  width:40px; height:40px; border-radius:50%; border:2px solid rgba(214,0,0,.85);
  background:rgba(30,9,9,.78); color:#ffd9d9; font-size:24px; line-height:1;
  display:grid; place-items:center; box-shadow:0 6px 16px rgba(0,0,0,.5); }
#takeover .ab2-card .card-close:hover{ filter:brightness(1.25); }
/* one X at a time: the room close hides while the takeover is up */
#takeover .ab2-card:has(.rm-plaque.open) > .card-close{ display:none; }
/* pin the case-board canvas to the real window: the engine card can run
   ~60px taller than the viewport, which pushed bottom-anchored pieces (the
   philosophy index, the lowest evidence) below the fold */
#takeover .ab2-card:has(.rm-board), #takeover .ab2-card:has(.pv-wrap){ position:fixed; inset:0; animation:none; }

/* ==========================================================================
   PERSONNEL ON MOBILE - the room is a fixed landscape stage (standee left, TV
   right, bar pinned bottom), which collapses on a phone. Reflow it into one
   scrolling column and lift the scouting package OFF the television so the
   copy is readable at phone size instead of shrunk into a 200px screen.
   ========================================================================== */
@media (max-width:768px){
  #takeover .pv-wrap{ position:absolute; inset:0; overflow-y:auto; overflow-x:hidden;
    -webkit-overflow-scrolling:touch; display:flex; flex-direction:column;
    align-items:stretch; gap:12px; padding:56px 12px 28px; background:#150808; }
  /* room-only atmosphere + the TV cabinet itself: drop them */
  #takeover .pv-wallglow, #takeover .pv-spot, #takeover .pv-tape,
  #takeover .pv-dust, #takeover .pv-shadow, #takeover .pv-glare,
  #takeover .pv-tv, #takeover .pv-tvtag, #takeover .pv-live{ display:none !important; }

  /* 1 - the roster picker, four across */
  #takeover .pv-faces{ position:static !important; order:1;
    left:auto !important; top:auto !important; }
  #takeover .pv-faces-grid{ grid-template-columns:repeat(4,1fr) !important; gap:7px; }
  #takeover .pv-face{ width:100% !important; }
  #takeover .pv-fullbtn{ margin-top:10px; font-size:13px; padding:11px 12px 12px; }

  /* 2 - the player */
  #takeover .pv-standee{ position:static !important; order:2;
    width:auto !important; height:auto !important; display:flex; justify-content:center; }
  #takeover .pv-standee img{ position:static !important; max-height:32vh;
    width:auto; max-width:76%; }

  /* 3 - the scouting package as stacked cards (no TV frame) */
  #takeover .pv-tvbox{ position:static !important; order:3; width:100% !important;
    right:auto !important; top:auto !important; transform:none !important;
    aspect-ratio:auto !important; }
  #takeover .pv-screen{ position:static !important; width:100% !important;
    height:auto !important; overflow:visible !important; border-radius:10px;
    padding:13px 12px 15px; display:flex; flex-direction:column; gap:13px; }
  #takeover .pv-screen::before{ display:none; }
  #takeover .pv-screen .pv-seg{ position:static !important; opacity:1 !important;
    pointer-events:auto !important; padding:0; }

  /* 4 - controls ride at the end of the column */
  #takeover .pv-bar{ position:static !important; order:4; transform:none !important;
    left:auto !important; bottom:auto !important; flex-wrap:wrap;
    justify-content:center; gap:10px; }
  #takeover .pv-mid{ min-width:0; }
  /* the full-lineup popup must cover the viewport, not the scrolled column */
  #takeover .pv-lineup{ position:fixed !important; }

  /* 5 - ALL ON SCREEN is the only channel here, so the mode pills go. The
     presenter grid is 2x2 with vw-clamped type: on 414px every size lands

     type, nothing measured off the viewport width. */
  #takeover .pv-modes{ display:none !important; }

  #takeover .pv-screen.presenter .pv-want1{ padding:.6em 1em .85em !important; }
  #takeover .pv-screen.presenter .pv-want1 b{ font-size:20px !important; }

/* ---- ABOUT case board - MOBILE: the collage becomes a document ----
   The board is a spatial map on desktop: everything pinned by absolute %,
   tied with string, with tape and pins that deliberately overhang the
   card edges. None of that survives a 390px column, so on phones the map
   is retired outright and the same evidence is re-laid as a read-down
   document: story pieces full width, stat tiles two across, hardware off. */
@media (max-width:768px){
  #takeover .ab2-card:has(.rm-board){ display:flex !important; flex-direction:column;
    overflow-y:auto; -webkit-overflow-scrolling:touch; align-items:stretch;
    padding:56px 12px 30px; gap:14px; }
  /* .card sets `will-change: transform, opacity`, which makes it the
     containing block for fixed children - so the room photo scrolled with the
     column and ran out partway down. Drop the hint and it pins to the glass. */
  #takeover .ab2-card:has(.rm-board){ will-change:auto !important; }
  #takeover .rm-bg, #takeover .rm-vig{ position:fixed !important; }
  /* room props (tape strips + stick-on logo) are pinned to the desktop wall;
     over a scrolling column they just float across whatever is under them */
  #takeover .rm-deco{ display:none !important; }
  /* nothing lifts off the board on a phone, so do not promise it */
  #takeover .cb-cue{ display:none !important; }
  #takeover .rm-board{ position:static !important; right:auto !important; top:auto !important;
    bottom:auto !important; width:100% !important; height:auto !important; order:1;
    display:flex; flex-direction:column; }
  #takeover .ab2-head-hint{ display:none !important; }
  /* the desktop rule nudges this +28% of the board to sit on the viewport
     centre; in the stacked column that just shoves it off the right edge */
  #takeover .ab2-head{ left:auto !important; width:auto !important; max-width:100%; }

  /* THE BOARD: a two-up evidence grid. Story pieces (the stadium, the case
     file, the quote, the streak polaroid, the playbook) span the full width;
     the single-number stat tiles pair up instead of eating a screen each. */
  #takeover .cb-wall{ position:static !important; height:auto !important; min-height:0 !important;
    overflow:visible !important; display:grid !important; grid-template-columns:1fr 1fr;
    gap:10px; align-items:start; }
  #takeover .cb-wall > svg{ display:none !important; }
  #takeover .cbi, #takeover .cbx, #takeover .cb-source{
    position:static !important; inset:auto !important; left:auto !important; top:auto !important;
    right:auto !important; bottom:auto !important; width:auto !important; margin:0 !important;
    transform:none !important; }
  #takeover .cb-source, #takeover .cbi.cb-case, #takeover .cbi.cb-pbk,
  #takeover .cbi.cb-streak, #takeover .cbx{ grid-column:1 / -1; }

  /* pins and tape are collage hardware: they hang outside the card box on
     purpose, which in a grid means they land on the neighbour */
  #takeover .cb-pin{ display:none !important; }
  #takeover .cb-case::before, #takeover .cb-case::after{ display:none !important; }
  #takeover .cb-case-tab{ position:static !important; display:inline-block; top:auto; right:auto;
    margin:0 0 10px; border-radius:5px; border-bottom:2px solid rgba(199,203,208,.5); }
  #takeover .cb-case{ padding:16px 16px 14px; }
  #takeover .cb-source img{ border-radius:8px; }
  #takeover .cb-source-lab{ position:static !important; transform:none !important;
    display:block; margin-top:7px; text-align:center; }
  /* loose marker art with nowhere to sit once the map is gone */
  #takeover .cbx.cb-scribble{ display:none !important; }
  #takeover .cbx.cb-quote{ padding:15px 16px 13px; }

  /* stat tiles: compact, two across, numbers scaled to the half-width box */
  #takeover .cbi{ padding:13px 9px 10px; }
  #takeover .cbi .ab2-val{ font-size:29px !important; }
  #takeover .cbi[data-sid="titles"] .ab2-val{ font-size:34px !important; }
  #takeover .cbi .ab2-lab{ font-size:9px !important; letter-spacing:.13em; }
  #takeover .cb-shot, #takeover .cbi img{ max-width:100% !important; }
  #takeover .m-pola{ padding:10px 10px 8px; }
  /* the streak polaroid has no photo yet, so it falls back to the big logo:
     a 3/4.5 portrait of that is 600px of empty frame */
  #takeover .cb-streak .cb-shot-portrait{ aspect-ratio:16/7 !important; }
  #takeover .cb-streak .cb-shot-fb img{ width:20% !important; }
  /* the playbook card is the one thing still tappable, so it stays a card
     rather than a full-bleed panel */
  #takeover .cbi.cb-pbk{ justify-self:center; max-width:74%; }

  #takeover .ab2-hero{ position:static !important; left:auto !important; top:auto !important;
    bottom:auto !important; width:62% !important; height:auto !important; margin:4px auto 0; order:2; }
  #takeover .ab2-hero-glow{ display:none !important; }
  #takeover .cb-phil{ position:static !important; left:auto !important; top:auto !important;
    bottom:auto !important; width:100% !important; order:3; }
  /* on a phone the popups get lost, so the board is just static evidence:
     philosophy buttons grayed off, nothing pops up EXCEPT the Utah Playbook */
  #takeover .cb-phil-row{ opacity:.5; pointer-events:none; filter:grayscale(.35); }
  #takeover .cb-phil-row .cb-phil-go{ opacity:.4; }
  #takeover .cbi, #takeover .rm-hot{ pointer-events:none !important; cursor:default !important; }
  #takeover .cbi.cb-pbk{ pointer-events:auto !important; cursor:pointer !important; }
}

/* ==========================================================================
   GAME PLAN BUILDER v2 (ORPB-GP-CSS) - THE PAPER CALL SHEET.
   The sheet is an actual piece of paper: smaller, printed header, taped
   corners, no enamel frame, no glow (the design system bans glow anyway).
   Sections are PRINTED color-coded boxes like a real coordinator sheet,
   and every pick is a STICKY NOTE in that section's color - play name
   bold with its formation under it. Controls live on the tray, not the
   paper. Per-section colors ride --ink / --stick custom props.
   ========================================================================== */
/* pin to the real window (same fix as personnel / dna) */
#takeover .ab2-card:has(.gp-wrap){ position:fixed; inset:0; animation:none; }
#takeover .gp-wrap{ position:absolute; inset:0; z-index:2; }

/* quiet room life: dust drifting in the side gutters (never over the paper) */
#takeover .gp-motes{ position:absolute; inset:0; z-index:1; pointer-events:none;
  overflow:hidden; opacity:.5; }
#takeover .gp-motes::before, #takeover .gp-motes::after{ content:''; position:absolute;
  top:0; bottom:0; width:15%;
  background-image:
    radial-gradient(1.6px 1.6px at 20% 30%, rgba(255,248,220,.7), transparent),
    radial-gradient(1.4px 1.4px at 70% 60%, rgba(255,248,220,.55), transparent),
    radial-gradient(1.8px 1.8px at 40% 80%, rgba(255,248,220,.6), transparent),
    radial-gradient(1.3px 1.3px at 85% 20%, rgba(255,248,220,.5), transparent);
  background-size:100% 260px;
  animation:gpMotes 26s linear infinite; }
#takeover .gp-motes::before{ left:0; }
#takeover .gp-motes::after{ right:0; animation-duration:34s; animation-direction:reverse; }
@keyframes gpMotes{ from{ background-position:0 0; } to{ background-position:0 -520px; } }

/* mode swap: the whole panel crossfades + drifts between GAME PLAN / FORMATIONS */
#takeover .gp-wrap{ transition:opacity .2s ease, transform .26s cubic-bezier(.16,1,.3,1); }
#takeover .gp-wrap.gp-fade{ opacity:0; transform:translateY(12px) scale(.99); }

/* the stage holds the sheet; entrance beat drops it in */
#takeover .gp-stage{ position:absolute; inset:0; z-index:2; }
#takeover .gp-stage.gp-enter .gp-sheet{ opacity:0;
  transform:translateX(-50%) rotate(-.35deg) translateY(-26px) scale(.985); }
#takeover .gp-sheet{ transition:opacity .34s ease, transform .42s cubic-bezier(.16,1,.3,1); }

/* light sweep crossing the header like a window reflection */

/* the 3 keys for offense, printed across the title block */

#takeover .gp-key-i{ display:flex; align-items:center; gap:7px;

#takeover .gp-sec[data-sec="beatZone"]{ --ink:#1f6e66; --stick:#c2e4de; }

#takeover .gp-knob.on{ color:#ffe98a; border-color:#c9a222;

#takeover .gp-knob.on .gp-knob-dot{ background:radial-gradient(circle at 40% 35%, #ffe98a, #c9971b);

#takeover .gp-tik{ position:relative; flex:1 1 0; max-width:172px; min-width:0;

#takeover .gp-tik-save.saved b{ color:#123f1c; }
/* SHEET-ONLY MODE (?sheet=1): the coaching app iframes just the call sheet, so strip
   the war-room chrome + the builder-only controls and present it read-only. The host
   overlay supplies its own close button; editing stays in the full War Room. */
body.sheetOnly #orpbBack,
body.sheetOnly #fsBtn,
body.sheetOnly #helpBar,
body.sheetOnly #takeover .gp-tik,
body.sheetOnly #takeover .gp-add,
body.sheetOnly #takeover .gp-sec-q,
body.sheetOnly #takeover .gp-howto,
body.sheetOnly #takeover .gp-clear-wrap,
body.sheetOnly #takeover .gp-knob{ display:none !important; }
body.sheetOnly #takeover .gp-sec-h{ pointer-events:none; }
/* iframed by the coaching app: skip the landing cover AND the whole 3D scene so the
   saved sheet pops straight up on a clean backdrop (no "Open Playbook" gate, no flash). */
body.sheetOnly{ background:#0b120c !important; }
body.sheetOnly #warCover,
body.sheetOnly #gl{ display:none !important; }
/* BARE SHEET (?sheet=1&bare=1): the coaching app embeds the sheet INSIDE its own
   scene, so drop the war-room render (no room photo, no vignette) and paint the
   coaching app's dark backdrop instead. Deliberately OPAQUE - a transparent
   iframe compositing over the app's videos can crash the host tab. */
html:has(body.sheetBare){ background:#0a0e1a !important; }
body.sheetBare, body.sheetBare #takeover{
  background:radial-gradient(120% 90% at 50% 30%, #141d3a 0%, #0a0e1a 68%) !important; }
body.sheetBare #takeover .rm-bg,
body.sheetBare #takeover .rm-vig{ display:none !important; }
/* the landing cover rides ABOVE the whole hub (grade z60, deck z70, JUMP z72)
   until Open Playbook lifts it into the diorama */
body.dioramaMode #warCover{ z-index:95; }
@keyframes dioDeckArrive{ from{ opacity:0; transform:translateY(26px); } to{ opacity:1; transform:none; } }
@media (prefers-reduced-motion:reduce){ body.dioramaMode:not(.covering) #dioDeck{ animation:none; } }
body.dioramaMode #deckUI,
body.dioramaMode #helpBar,
body.dioramaMode #hud,
body.dioramaMode #neonBreath,
body.dioramaMode #fieldBack{ display:none !important; }
.dio-dive-veil.on{ background:rgba(4,8,16,.58); }
@keyframes dioCtaRock{ from{ rotate:-1.4deg; } to{ rotate:-.4deg; } }
@media (prefers-reduced-motion:reduce){ #dioCta{ animation:none; } }
#gdMeter.on{ display:block; }
@keyframes gmScrim{ from{ opacity:0; } to{ opacity:1; } }
@keyframes gmShoot{ 0%{ transform:translateX(-50%) translateY(112vh); }
  70%{ transform:translateX(-50%) translateY(-2.4vh); }
  100%{ transform:translateX(-50%) translateY(0); } }
@keyframes gmKick{ 0%{ transform:translateX(-50%); }
  35%{ transform:translateX(-50%) translateY(-16px) scale(1.025,1.012); }
  100%{ transform:translateX(-50%) translateY(0) scale(1); } }
#gdMeter .gm-tape.br{ bottom:-11px; right:-16px; transform:rotate(-27deg); }
@keyframes gmHdrIn{ from{ opacity:0; transform:translateX(-50%) translateY(-46px) rotate(-2deg) scale(.8); }
  to{ opacity:1; transform:translateX(-50%) translateY(0) rotate(-2deg) scale(1); } }
@keyframes gmReady{ 0%{ transform:scale(1);} 45%{ transform:scale(1.08);} 100%{ transform:scale(1);} }
@keyframes gmFlash{ 0%{ box-shadow:inset 0 3px 8px rgba(0,0,0,.55), 0 0 0 0 rgba(255,60,60,0); }
  30%{ box-shadow:inset 0 3px 8px rgba(0,0,0,.55), 0 0 34px 8px rgba(255,60,60,.85); }
  100%{ box-shadow:inset 0 3px 8px rgba(0,0,0,.55), 0 0 0 0 rgba(255,60,60,0); } }
@keyframes gmPunch{ 0%{ transform:scale(1); } 34%{ transform:scale(1.35); color:#ff5c5c; } 100%{ transform:scale(1); } }
#gdMeter .gm-pop.go{ animation:gmPop .9s cubic-bezier(.2,1.3,.35,1) both; }
@keyframes gmPop{ 0%{ opacity:0; scale:.22; rotate:-5deg; } 20%{ opacity:1; scale:1.14; rotate:1.5deg; }
  38%{ scale:.97; rotate:0deg; } 62%{ opacity:1; scale:1; } 100%{ opacity:0; scale:1.08; } }
@keyframes gmStamp{ 0%{ opacity:0; transform:translate(-50%,-50%) rotate(-12deg) scale(2.6); }
  62%{ opacity:1; transform:translate(-50%,-50%) rotate(-12deg) scale(.94); }
  100%{ opacity:.94; transform:translate(-50%,-50%) rotate(-12deg) scale(1); } }
@media (prefers-reduced-motion:reduce){
  #gdMeter .gm-card, #gdMeter .gm-card.gm-in, #gdMeter .gm-card.gm-kick, #gdMeter .gm-scrim,
  #gdMeter .gm-fill, #gdMeter .gm-pct.gm-punch, #gdMeter .gm-bar.gm-flash,
  #gdMeter .gm-pop.go{ animation:none; transition:none; } }
@keyframes lnFlick{ 0%{ filter:brightness(.4); } 60%{ filter:brightness(1.7); } 100%{ filter:brightness(1); } }
@keyframes lnBlaze{ from{ filter:brightness(.9); } to{ filter:brightness(1.7); } }
@keyframes lnHero{ 0%{ scale:1; } 22%{ scale:1.16; rotate:2.6deg; }
  55%{ scale:.98; rotate:-1.8deg; } 100%{ scale:1; } }
@keyframes lnGlow{ 0%{ opacity:0; scale:.4; } 18%{ opacity:1; } 100%{ opacity:0; scale:1.5; } }
body.presenting #dioDeck .dio-card .ln-tag.on{ display:block; translate:-50% 0;
  animation:lnTag .7s cubic-bezier(.24,1.3,.4,1) both; }
@keyframes lnTag{ 0%{ opacity:0; rotate:-14deg; translate:-50% -8px; }
  100%{ opacity:1; rotate:-3deg; translate:-50% 0; } }
#dioLine .ln-ballm.show{ opacity:1; }
#dioLine .ln-count2.tick{ animation:lnTick .45s cubic-bezier(.2,1.5,.4,1); }
@keyframes lnTick{ 0%{ scale:1; } 40%{ scale:1.35; } 100%{ scale:1; } }
#dioLine .ln-gday.on{ display:block; animation:lnGday .55s cubic-bezier(.22,1,.36,1) both; }
@keyframes lnGday{ from{ opacity:0; scale:2.2; } to{ opacity:1; scale:1; } }
@keyframes lnGate{ 0%{ opacity:0; scale:.5; } 20%{ opacity:1; } 100%{ opacity:0; scale:1.35; } }
@media (prefers-reduced-motion:reduce){
  .ln-bulb.flick, .ln-bulbs.blaze .ln-bulb.lit, #dioDeck .dio-card.ln-hero,
  body.presenting #dioDeck .dio-card .ln-tag.on, #dioLine .ln-gate, .ln-glow,
  #dioLine .ln-stripe.blaze .ln-seg.on .ln-paint, #dioLine .ln-count2.tick,
  #dioLine .ln-gday.on{ animation:none; }
  #dioLine .ln-paint, #dioLine .ln-ballm, #dioLine .ln-lbl{ transition:none; } }
body.dioramaMode #dioChains.on{ display:block; }
@keyframes chHi{ from{ opacity:0; translate:0 26px; } to{ opacity:1; translate:0 0; } }
#dioChains .ch-wash.instant{ transition:none; }
@keyframes chBlaze{ 0%{ filter:brightness(1); } 22%{ filter:brightness(2.1); } 100%{ filter:brightness(1); } }
#dioChains .ch-rig.instant{ transition:none; }
@keyframes chPlant{ 0%{ transform:translateY(-.5em); } 55%{ transform:translateY(.12em); } 100%{ transform:translateY(0); } }
@keyframes chFlut{ from{ scale:1 1; rotate:0deg; } to{ scale:.94 1.05; rotate:2.5deg; } }
#dioChains .ch-box.ready{ background:linear-gradient(168deg, #ffd94a, #d9a812 80%); }
#dioChains .ch-tag.stamp{ animation:chStamp .38s cubic-bezier(.2,1.4,.4,1) both; }
@keyframes chStamp{ from{ scale:1.7; opacity:0; } to{ scale:1; opacity:1; } }
@keyframes chBit{ from{ opacity:.95; translate:0 0; rotate:0deg; }
  to{ opacity:0; translate:var(--bx) var(--by); rotate:var(--br); } }
@keyframes chLeaf{ 0%{ opacity:0; translate:0 -.5em; rotate:0deg; } 12%{ opacity:1; }
  100%{ opacity:0; translate:var(--lx) var(--ly); rotate:var(--lr); } }
@keyframes chFlash{ 0%{ opacity:0; scale:.3; } 12%{ opacity:1; } 100%{ opacity:0; scale:1.6; } }
@media (prefers-reduced-motion:reduce){
  #dioChains .ch-par, #dioChains .ch-pen, #dioChains .ch-tag.stamp,
  #dioChains .ch-box.ready .ch-rdy{ animation:none; }
  #dioChains .ch-rig, #dioChains .ch-wash, #dioChains .ch-edge, #dioChains .ch-num{ transition:none; }
}
#dioDeck .bunt-rope.bounce{ animation:ropeDip .7s cubic-bezier(.3,1.6,.4,1); }
@keyframes ropeDip{ 0%,100%{ transform:translateY(0); } 30%{ transform:translateY(1.3px); }
  62%{ transform:translateY(-.4px); } }
#dioDeck .dio-card.instant{ transition:none !important; }
@keyframes buntSway{ from{ transform:translate(-50%,-2px) rotate(calc(var(--r) - 2.4deg)); }
  to{ transform:translate(-50%,2px) rotate(calc(var(--r) + 2.4deg)); } }
@keyframes buntLand{ 0%{ transform:translateX(-50%) rotate(calc(var(--r) + 10deg)); }
  38%{ transform:translateX(-50%) rotate(calc(var(--r) - 7deg)); }
  70%{ transform:translateX(-50%) rotate(calc(var(--r) + 3deg)); }
  100%{ transform:translateX(-50%) rotate(var(--r)); } }
@keyframes dcBit{ 0%{ transform:translate(0,0) rotate(0); opacity:1; }
  100%{ transform:translate(var(--bx),var(--by)) rotate(220deg); opacity:0; } }
@keyframes dioMiniPulse{ 0%,100%{transform:scale(1)} 50%{transform:scale(1.2)} }
/* the war-room card ceremony, reused in the hub: lift it above everything.
   Both close choices stay (OPEN SECTION dives in, PLACE CARD DOWN lays the
   card into the ground row), and the whole rig is re-skinned to WVU's collage
   fall art: gold + navy torn-paper sunburst instead of the green lightning. */
body.dioramaMode #cardStage{ z-index:180 !important; }
body.dioramaMode .cs-ring.r2.go{ border-color:rgba(226,230,234,.92);
  box-shadow:0 0 24px rgba(190,196,202,.7); }
@keyframes csLeafFall{
  0%{ opacity:0; transform:translate(0,0) rotate(0deg) scale(var(--ls,1)); }
  14%{ opacity:1; }
  100%{ opacity:0; transform:translate(var(--lx,0),var(--ly,60vh)) rotate(var(--lr,220deg)) scale(var(--ls,1)); } }
body.dioramaMode #cardActions .ca.ghost{ border-color:rgba(215,219,222,.55);
  box-shadow:0 0 12px rgba(220,30,30,.26), 0 12px 26px rgba(0,0,0,.55),
    inset 0 3px 5px rgba(255,255,255,.2), inset 0 -7px 14px rgba(45,4,4,.7); }
/* mid-dive: every hub overlay clears the shot while the camera flies at the bowl */
body.dioJumping #dioDeck, body.dioJumping #dioCta, body.dioJumping #dioMiniBtn,
body.dioJumping #gdMeterBtn, body.dioJumping #helpBar, body.dioJumping #dioLine,
body.dioJumping #fsBtn{ opacity:0 !important; transition:opacity .35s ease; pointer-events:none !important; }
/* (the field side's dark arrival plate lives in the <head> - html.dbDiving::before -
   so it is up before the body ever paints) */
#dioLeave.on{ opacity:1; }
@keyframes dioGrain{ 0%{transform:translate(0,0)} 25%{transform:translate(-6px,4px)}
  50%{transform:translate(5px,-5px)} 75%{transform:translate(-4px,-3px)} 100%{transform:translate(3px,5px)} }
body.dioEditing #dioGizmo.on{ display:flex; }
/* "reset here" sticky note pointing at the clear button */
#takeover .gp-clear-wrap{ display:inline-flex; align-items:center; gap:7px; }
#takeover .gp-clear-note{ position:relative; padding:5px 10px 6px; border-radius:3px;
  transform:rotate(-2deg); white-space:nowrap;
  background:linear-gradient(180deg,#fff2b0,#f4d95a); color:#3a3208;
  font-family:var(--font-marker,'Permanent Marker'),cursive; font-size:12px;
  box-shadow:0 3px 8px rgba(0,0,0,.3); }
#takeover .gp-clear-note::after{ content:''; position:absolute; right:-7px; top:50%;
  transform:translateY(-50%); width:0; height:0;
  border-top:6px solid transparent; border-bottom:6px solid transparent; border-left:8px solid #f4d95a; }
/* the "how it works" sticky note pinned in the open left margin */
#takeover .gp-howto{ position:absolute; left:16px; top:50%; z-index:4;
  transform:translateY(-50%) rotate(-1.6deg); width:min(15vw,220px); padding:16px 17px 18px;
  background:linear-gradient(180deg,#fff6c8,#f4e08e); color:#3a3208;
  border:1px solid rgba(150,120,40,.5); border-radius:3px;
  box-shadow:0 14px 32px rgba(0,0,0,.45); }
#takeover .gp-howto-tape{ position:absolute; top:-11px; left:50%; width:82px; height:22px;
  transform:translateX(-50%) rotate(-3deg); border-radius:2px;
  background:linear-gradient(180deg,rgba(240,230,184,.9),rgba(216,202,148,.72)); box-shadow:0 2px 4px rgba(0,0,0,.28); }
#takeover .gp-howto-h{ display:block; font-family:var(--font-marker,'Permanent Marker'),cursive;
  font-size:18px; line-height:1.05; color:#a0342e; margin-bottom:10px; }
#takeover .gp-howto ol{ margin:0; padding-left:17px; display:flex; flex-direction:column; gap:8px; }
#takeover .gp-howto li{ font-family:var(--font-body); font-size:11.5px; line-height:1.42; color:#3a3208; }
#takeover .gp-howto em{ font-style:normal; font-weight:800; color:#1b3a6b; }
@media (max-width:1650px){ #takeover .gp-howto{ display:none; } }
/* CONSTRAINT PAIRS - build your own */
#takeover .gp-con-premade{ display:flex; flex-direction:column; gap:8px; }
#takeover .gp-con-build{ margin-top:12px; padding:12px 13px 13px; border-radius:5px;
  border:1.5px dashed rgba(120,100,58,.55); background:rgba(255,251,240,.55); }
#takeover .gp-con-build-h{ font-family:var(--font-display); font-weight:900; font-size:12px;
  letter-spacing:.1em; color:#a0342e; margin-bottom:9px; }
#takeover .gp-con-build-row{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
#takeover .gp-con-sel{ flex:1 1 130px; min-width:118px; padding:7px 9px; border-radius:4px;
  border:1.5px solid rgba(120,100,58,.4); background:#fbf6e4; color:#33301f;
  font-family:var(--font-body); font-size:13px; }
#takeover .gp-con-buildarrow{ color:#a0342e; font-size:17px; font-weight:900; flex:0 0 auto; }
#takeover .gp-con-add{ flex:0 0 auto; padding:8px 15px; border-radius:5px; cursor:pointer;
  border:1px solid rgba(96,74,30,.5); background:linear-gradient(180deg,#e8b64e,#c78a15);
  font-family:var(--font-display); font-weight:900; font-size:12px; letter-spacing:.06em; color:#241a06; }
#takeover .gp-con-add:hover{ filter:brightness(1.07); }
#takeover .gp-con-mine{ display:flex; flex-wrap:wrap; gap:7px; margin-top:11px; }
#takeover .gp-con-chip{ display:inline-flex; align-items:center; gap:7px; padding:5px 8px 6px 12px;
  border-radius:999px; background:color-mix(in srgb,#1b3a6b 13%,#f7eecf);
  border:1px solid rgba(27,58,107,.4); font-family:var(--font-body); font-size:12px; color:#1c2438; }
#takeover .gp-con-chip b{ font-weight:800; }
#takeover .gp-con-rm{ width:17px; height:17px; border-radius:50%; cursor:pointer; border:none;
  background:rgba(160,52,46,.9); color:#fff; font-size:12px; line-height:1; display:grid; place-items:center; }
#takeover .gp-con-rm:hover{ filter:brightness(1.1); }

/* THE FORMATIONS TAB: same paper, a look per ticket on the tray */
#takeover .gpf-count{ margin-left:auto; padding:7px 16px; border-radius:999px;
  background:linear-gradient(180deg,#f6efd8,#e5d9b6);
  border:2px solid rgba(120,100,58,.35);
  font-family:var(--font-marker,'Permanent Marker'),cursive;
  font-size:clamp(12px,1vw,16px); color:#143726; white-space:nowrap;
  box-shadow:inset 0 2px 3px rgba(255,255,255,.7), 0 3px 7px rgba(0,0,0,.25); }
#takeover .gpf-body{ position:absolute; inset:56px 0 0; padding:18px 22px 16px;
  display:grid; grid-template-columns:1.7fr .82fr; gap:22px; }
/* big polaroid = the 16:9 field screenshot, sized so the WHOLE formation is
   visible (no tall crop); it centers in the column instead of stretching. */
#takeover .gpf-shot{ position:relative; min-height:0; padding:12px 12px 14px; border-radius:4px;
  transform:rotate(-.4deg); align-self:center; width:100%; aspect-ratio:16/9;
  background:linear-gradient(180deg,#fbf6e4,#efe6cd);
  border:1.5px solid rgba(120,100,58,.35);
  box-shadow:0 12px 30px rgba(0,0,0,.34); }
#takeover .gpf-shot::before{ content:''; position:absolute; top:-10px; left:50%;
  width:88px; height:22px; transform:translateX(-50%) rotate(-2deg); border-radius:2px;
  background:linear-gradient(180deg, rgba(240,230,184,.9), rgba(216,202,148,.72));
  box-shadow:0 2px 4px rgba(0,0,0,.28); z-index:2; }
#takeover .gpf-shot img{ display:block; width:100%; height:100%;
  object-fit:cover; border-radius:2px; }
#takeover .gpf-side{ display:flex; flex-direction:column; gap:11px; min-width:0;
  min-height:0; overflow:hidden; }
/* the "why this look is a problem" newsprint card - fills the open sidebar */
#takeover .gpf-desc{ padding:12px 15px; border-radius:3px; transform:rotate(.4deg);
  background:
    repeating-linear-gradient(0deg, rgba(0,0,0,.025) 0 2px, rgba(0,0,0,0) 2px 5px),
    linear-gradient(180deg,#f2ecd8,#e7dfc6);
  border:1.5px solid rgba(120,100,58,.3); box-shadow:0 8px 18px rgba(0,0,0,.25); }
#takeover .gpf-desc p{ margin:0; font-family:var(--font-body); font-weight:600;
  font-size:clamp(12px,1vw,15px); line-height:1.5; color:#33301f; }
#takeover .gpf-diagram{ position:relative; width:58%; padding:9px; border-radius:4px;
  transform:rotate(.6deg);
  background:linear-gradient(180deg,#fbf6e4,#efe6cd);
  border:1.5px solid rgba(120,100,58,.35);
  box-shadow:0 8px 18px rgba(0,0,0,.28); }
#takeover .gpf-diagram::before{ content:''; position:absolute; top:-8px; left:50%;
  width:56px; height:15px; transform:translateX(-50%) rotate(2deg); border-radius:2px;
  background:linear-gradient(180deg, rgba(240,230,184,.9), rgba(216,202,148,.72));
  box-shadow:0 1px 3px rgba(0,0,0,.25); z-index:2; }
#takeover .gpf-diagram img{ display:block; width:100%; height:auto; border-radius:2px; }
#takeover .gpf-pt{ display:flex; gap:9px; align-items:baseline; }
#takeover .gpf-pt i{ font-style:normal; color:#b8322c; font-size:.85em; }
#takeover .gpf-pt span{ font-family:var(--font-marker,'Permanent Marker'),cursive;
  font-size:clamp(13px,1.05vw,17px); line-height:1.35; color:#143726; }
#takeover .gpf-callab{ font-family:var(--font-display); font-weight:900;
  font-size:11px; letter-spacing:.26em; color:#6b5a33;
  border-bottom:2px solid rgba(120,100,58,.3); padding-bottom:5px; }
#takeover .gpf-calls{ display:flex; flex-wrap:wrap; gap:9px; }
#takeover .gpf-call{ --stick:#e4dbc4; }
#takeover .gpf-rail .gp-tik{ flex:1 1 0; max-width:340px; padding:17px 20px 15px; }
#takeover .gpf-rail .gp-tik b{ font-size:clamp(14px,1.25vw,19px); }
#takeover .gpf-rail .gp-tik span{ font-size:clamp(11px,.92vw,14px); }
#takeover .gp-tik.on{ transform:rotate(0deg) translateY(-10px); border-color:#c9a222;
  box-shadow:0 0 16px rgba(201,162,34,.45), 0 14px 24px rgba(0,0,0,.5),
    inset 0 2px 2px rgba(255,255,255,.6); }

/* the page-pull: one sheet lifts off as the next rises out of the tray */
#takeover .gpf-sheet{ transition:transform .44s cubic-bezier(.5,0,.2,1), opacity .38s ease; }
#takeover .gpf-out-up{ transform:translateX(-50%) rotate(2deg) translateY(-70vh); opacity:0; }
#takeover .gpf-out-dn{ transform:translateX(-50%) rotate(-2deg) translateY(70vh); opacity:0; }
#takeover .gpf-in-up{ transform:translateX(-50%) rotate(-2deg) translateY(70vh); opacity:0; }
#takeover .gpf-in-dn{ transform:translateX(-50%) rotate(2deg) translateY(-70vh); opacity:0; }
#takeover .gpf-in-up.go, #takeover .gpf-in-dn.go{
  transform:translateX(-50%) rotate(-.35deg); opacity:1; }

/* the sticky menu: look at the play / pin tags */
#takeover .gp-smenu{ position:absolute; z-index:26; width:250px;
  display:flex; flex-direction:column; gap:6px; padding:12px 12px 11px;
  border-radius:6px; background:linear-gradient(180deg,#fdf8e8,#efe6cd);
  border:2px solid rgba(120,100,58,.5); box-shadow:0 14px 34px rgba(0,0,0,.45);
  opacity:0; transform:translateY(-5px); transition:opacity .2s ease, transform .2s ease; }
#takeover .gp-smenu.in{ opacity:1; transform:none; }
#takeover .gp-sm-nm{ font-family:var(--font-display); font-weight:900;
  font-size:14px; letter-spacing:.04em; color:#143726;
  border-bottom:2px solid rgba(120,100,58,.3); padding-bottom:6px; }
#takeover .gp-sm-look, #takeover .gp-sm-tags{ display:flex; align-items:center;
  padding:8px 10px; cursor:pointer; text-align:left; border-radius:4px;
  background:rgba(255,255,255,.35); border:1.5px solid rgba(120,100,58,.35);
  font-family:var(--font-display); font-weight:900; font-size:11px;
  letter-spacing:.14em; color:#143726; transition:filter .12s ease; }
#takeover .gp-sm-look:hover, #takeover .gp-sm-tags:hover{ filter:brightness(1.06); }
#takeover .gp-sm-rm{ display:flex; align-items:center; padding:8px 10px; cursor:pointer;
  text-align:left; border-radius:4px; background:rgba(184,50,44,.1);
  border:1.5px solid rgba(184,50,44,.4);
  font-family:var(--font-display); font-weight:900; font-size:11px;
  letter-spacing:.14em; color:#a0342e; transition:filter .12s ease, background .15s ease; }
#takeover .gp-sm-rm:hover{ background:rgba(184,50,44,.2); }
#takeover .gp-sm-cap{ font-family:var(--font-display); font-weight:800; font-size:8.5px;
  letter-spacing:.2em; color:#8a744a; }
#takeover .gp-sm-list{ display:flex; flex-wrap:wrap; gap:6px; }
#takeover .gp-sm-t{ padding:5px 11px; border-radius:999px; cursor:pointer;
  border:1.5px solid rgba(120,100,58,.4); background:rgba(255,255,255,.35);
  font-family:var(--font-display); font-weight:800; font-size:9.5px;
  letter-spacing:.1em; color:#33301f; transition:filter .12s ease, border-color .15s ease; }
#takeover .gp-sm-t:hover{ filter:brightness(1.06); }
#takeover .gp-sm-t.on{ border-color:#1d7a44; background:#e4f0d8; color:#143726;
  box-shadow:0 0 0 1.5px rgba(29,122,68,.25); }
#takeover .gp-sm-done{ align-self:flex-end; padding:7px 16px; border-radius:999px;
  cursor:pointer; border:2px solid #c9a222;
  background:linear-gradient(180deg,#e9c93f,#c9a222);
  font-family:var(--font-display); font-weight:900; font-size:10px;
  letter-spacing:.14em; color:#2e2408; }

/* THE BUILDER POPUP: a paper card */
#takeover .gp-pop{ position:absolute; inset:0; z-index:30; display:none; }
#takeover .gp-pop.on{ display:block; }
#takeover .gp-b-dim{ position:absolute; inset:0; background:rgba(2,10,5,.55);
  opacity:0; transition:opacity .24s ease; }
#takeover .gp-pop.go .gp-b-dim{ opacity:1; }
#takeover .gp-b-card{ position:absolute; left:50%; top:50%; width:min(940px,74vw);
  max-height:82vh; display:flex; flex-direction:column;
  transform:translate(-50%,-50%) translateY(9vh) scale(.9); opacity:0;
  border-radius:8px; overflow:hidden;
  background:linear-gradient(180deg,#f6efd8,#e7dcbb);
  border:2px solid rgba(120,100,58,.5);
  box-shadow:0 34px 80px rgba(0,0,0,.7);
  transition:transform .32s cubic-bezier(.16,1,.3,1), opacity .26s ease; }
#takeover .gp-pop.go .gp-b-card{ transform:translate(-50%,-50%); opacity:1; }
#takeover .gp-b-head{ position:relative; padding:16px 56px 12px 20px;

/* ==========================================================================
   THE FILM ROOM v1 (ORPB-FILM-CSS).
   v3: THE MODERN FILM ROOM. The projector is retired (static art, fake
   beam); the room is built around a wall-mounted CSS TV that is SELF-LIT -
   its glow washes the wall and pools on the shelf, no light geometry to
   fake. PICKER: the TV idles up top showing the unit title as a broadcast
   graphic (breathing O screensaver), reel-box shelves below; picking a play
   FLIES the box up into the TV, the screen catches the play, and the room
   pushes in. BREAKDOWN: zoomed on the TV, screenshot big + centered with a
   broadcast lower-third, collage notes flanking on both sides. Still the
   fixed 1600x900 design canvas (--fbs) so every screen sees the same room.
   The TV screen is a plain rect region - swapping in real 4K TV art later
   is a frame swap, not a layout change.
   ========================================================================== */
/* ---- the room itself (shared by both screens) ---- */
#takeover .fr-card, #takeover .fb-card{ width:100vw; height:100vh; max-width:none;
  max-height:none; display:block; position:relative; overflow:hidden; padding:0;
  background:none; }
#takeover:has(.fr-card), #takeover:has(.fb-card){ padding:0; }
#takeover:has(.fr-card) #scroll-cue, #takeover:has(.fb-card) #scroll-cue{ display:none; }
#takeover .film-room{ position:absolute; inset:0; overflow:hidden;
  --primary:#0a2748; --secondary:#eab804; --fr-acc:#1f4f8a; --paper:#efe8d4; }
#takeover .film-bg{ position:absolute; inset:-3.5%;
  background:url("Bears Assets/Bears Office background.jpg") center/cover;
  filter:brightness(.42) saturate(.85);
  animation:rmKen 26s ease-in-out infinite alternate; }
#takeover .film-room::before{ content:''; position:absolute; inset:0; z-index:1;
  background:
    radial-gradient(120% 90% at 50% 36%, rgba(0,0,0,0) 38%, rgba(2,6,3,.78) 100%),
    linear-gradient(180deg, rgba(3,8,4,.4), rgba(3,8,4,.12) 30%, rgba(2,5,3,.55) 88%); }

/* THE DESIGN CANVAS - fixed 1600x900, scaled as one object to the window */
#takeover .film-fit{ position:absolute; left:50%; top:50%; width:1600px; height:900px;
  z-index:2; transform:translate(-50%,-50%) scale(var(--fbs,1)); transform-origin:center; }

/* ---- THE TV (pure CSS; the screen is a clean rect for a future art swap) ---- */
#takeover .film-tv{ position:absolute; }
/* the light it throws: wall wash behind + pool below (self-lit, honest) */
#takeover .tv-wallglow{ position:absolute; inset:-70px -90px -60px;
  background:radial-gradient(58% 58% at 50% 46%,
    color-mix(in srgb, var(--secondary) 13%, rgba(210,230,200,.11)), rgba(0,0,0,0) 72%);
  filter:blur(14px); pointer-events:none;
  animation:tvGlowBreathe 6.5s ease-in-out infinite; }
@keyframes tvGlowBreathe{ 0%,100%{ opacity:.8; } 50%{ opacity:1; } }
#takeover .tv-frame{ position:relative; padding:11px 11px 15px; border-radius:10px;
  background:linear-gradient(180deg,#181c19,#0a0d0b 70%,#060807);

const takeover = $("#takeover");
const inner = $("#takeover-inner");

// Lazy-load: fill every <img data-src> inside the freshly-rendered card.
function loadCardImages(){
  inner.querySelectorAll("img[data-src]").forEach(img => {
    img.addEventListener("load", () => img.closest(".imgslot")?.classList.add("loaded"));
    img.addEventListener("error", () => img.closest(".imgslot")?.classList.add("img-missing"));
    img.loading = 'lazy'; img.decoding = 'async';   // never fetch off-screen art eagerly
    img.src = img.dataset.src;
    img.removeAttribute("data-src");
  });
}

const prefersReducedMotion = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;

// Stagger the inner content blocks - each container's direct children rise in
// one after another, so the card lays itself out in sequence after it lands.
function staggerReveal(root){
  if(prefersReducedMotion()) return;
  root.querySelectorAll(".card-right, .card-left, .overlay-list, .menu-list, .pillars, .card-grid, .form-list, .team-list")
    .forEach(group => Array.from(group.children).forEach((el, i) => {

// Records where the user last clicked a pill/row so the takeover can "whoosh"
// out of that exact spot. Capture phase runs before the open handler fires.
let lastClickOrigin = null;
document.addEventListener("click", (e) => {
  const el = e.target.closest(".patch, .play-item, .callsheet-pill, .bh-card");
  if(el){ const r = el.getBoundingClientRect();
    lastClickOrigin = { x:r.left + r.width/2, y:r.top + r.height/2, t:Date.now() }; }
}, true);

// "There's more below" cue - a bouncing chevron pill that appears when the open
// card's scroll container has content past the fold, and hides near the bottom.
// Wired generically to whatever element actually scrolls in the current view.
let _cueScroller = null;
function _cueUpdate(){
  const cue = takeover.querySelector("#scroll-cue");
  if(!cue || !_cueScroller) return;
  const el = _cueScroller;
  const overflow = el.scrollHeight - el.clientHeight;
  const remaining = overflow - el.scrollTop;
  cue.classList.toggle("show", overflow > 56 && remaining > 56);
}
function setupScrollCue(){
  let cue = takeover.querySelector("#scroll-cue");
  if(!cue){
    cue = document.createElement("div");
    cue.id = "scroll-cue"; cue.setAttribute("aria-hidden", "true");
    cue.innerHTML = `<span>Scroll for more</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>`;
    takeover.appendChild(cue);
  }
  cue.classList.remove("show");
  if(_cueScroller){ _cueScroller.removeEventListener("scroll", _cueUpdate); _cueScroller = null; }
  const card = inner.querySelector(".card");
  if(!card) return;
  // the scroller = the descendant (or the card) with real overflow-y scroll
  const cands = [card, ...card.querySelectorAll("*")].filter(el => {
    const oy = getComputedStyle(el).overflowY;
    return (oy === "auto" || oy === "scroll") && (el.scrollHeight - el.clientHeight) > 56;
  });
  _cueScroller = cands.sort((a, b) =>
    (b.scrollHeight - b.clientHeight) - (a.scrollHeight - a.clientHeight))[0] || null;
  if(!_cueScroller) return;
  _cueScroller.addEventListener("scroll", _cueUpdate, { passive:true });
  _cueUpdate();
}

// enter: "scale" (play card, default) | "left" | "right" | "bottom" (panels)
function openTakeover(html, enter){
  inner.innerHTML = html;
  const card = inner.querySelector(".card");
  if(card){
    // if this open came from a fresh pill/row click, balloon out of that spot;
    // otherwise use the directional entrance.
    const o = lastClickOrigin;
    // 700ms, not 450: a board card runs a 300ms dive before it opens, and the
    // section should still balloon out of the card the dive came from.
    if(o && Date.now() - o.t < 700 && !prefersReducedMotion()){
      const r = card.getBoundingClientRect();
      card.style.transformOrigin = `${(o.x - r.left).toFixed(0)}px ${(o.y - r.top).toFixed(0)}px`;
      card.classList.add("in-morph");
    } else {
      card.classList.add("in-" + (enter || "scale"));
    }
  }
  lastClickOrigin = null;
  loadCardImages();
  staggerReveal(inner);
  takeover.classList.add("open");
  document.body.classList.add("overlay-on");        // hide the field banner behind
  document.removeEventListener("keydown", onKey);   // never stack listeners
  document.addEventListener("keydown", onKey);
  // let layout + images settle, then check whether to show the "scroll for more" cue
  setTimeout(setupScrollCue, 300);
}

/* ---- BACK NAVIGATION ----------------------------------------------------
   X / Esc returns to the PREVIOUS screen instead of jumping to the hub.
   Each opener records the screen it's leaving; closeTakeover pops it. ------ */
/* the section/play view state - its old declaration lived in the cut 3D web */
let state = { view:null, list:[] };
let navStack = [];
let navReplaying = false;
function navMaybePush(incomingKind){
  // skip on a back-replay, when coming from the hub, or on a lateral move
  // (prev/next, sibling, tab - same kind doesn't create a new history level)
  if(navReplaying) return;
  const v = state.view;
  if(!v || v.kind === incomingKind) return;
  navStack.push(v);
}
function navReopen(v){
  navReplaying = true;
  try{
    if(v.kind === "category")       openCategory(v.type);
    else if(v.kind === "play")      openPlay(v.id);
    else if(v.kind === "section")   openSection(v.key);
    else hardCloseTakeover();
  } finally { navReplaying = false; }
}
function closeTakeover(){
  if(!navReplaying && navStack.length){ navReopen(navStack.pop()); return; }
  hardCloseTakeover();
}
function hardCloseTakeover(){
  navStack = [];
  const card = inner.querySelector(".card");
  if(card){ card.style.animation = ""; card.classList.add("out"); }  // play exit anim
  takeover.classList.remove("open");
  document.body.classList.remove("overlay-on");      // restore the field banner
  if(window.WR_GL_WAKE) window.WR_GL_WAKE();  // apply a rotation deferred while covered
  document.removeEventListener("keydown", onKey);
  state.view = null;
}

function onKey(e){
  // On the web play screen, Esc collapses an open node panel before closing.
  const pw = inner.querySelector(".play-web");
  if(e.key === "Escape" && pw && pw.pwIsPanelOpen && pw.pwIsPanelOpen()){ pw.pwClosePanel(); return; }
  if(e.key === "Escape") closeTakeover();
  else if(e.key === "ArrowRight" && state.view?.kind==="play") stepPlay(1);
  else if(e.key === "ArrowLeft"  && state.view?.kind==="play") stepPlay(-1);
}

/* ----- PLAY CARD ----- */
// mode: undefined (grow from center) | "next" (slide in from right) | "prev" (from left)
function openPlay(id, mode){
  const p = PLAYS.find(x => x.id === id);
  if(!p) return;
  // prev/next cycles the list the play actually belongs to
  if(!state.list.includes(id)) state.list = PLAYS.map(x=>x.id);
  navMaybePush("play");
  state.view = { kind:"play", id };
  const enter = mode === "next" ? "right" : mode === "prev" ? "left" : "scale";
  openFilmBreakdown(p, enter);   // every play opens in the film room
}
function stepPlay(dir){
  if(!state.view || state.view.kind!=="play" || stepping) return;
  const list = state.list.length ? state.list : PLAYS.map(p=>p.id);
  let i = list.indexOf(state.view.id);
  i = (i + dir + list.length) % list.length;

  const card = inner.querySelector(".card");
  stepping = true;
  if(card){
    card.style.animation = "none";          // cancel the entrance animation
    card.classList.add("stepping");
    // next → old slides left; prev → old slides right
    card.style.transform = `translateX(${dir>0 ? -64 : 64}px) scale(.98)`;
    card.style.opacity = "0";
  }
  setTimeout(() => {
    openPlay(list[i], dir>0 ? "next" : "prev");   // new card enters from opposite side
    stepping = false;
  }, 165);
}

/* the animated viz for a stat (shared by wall pieces, lifts, and takeover) */
function ab2VizHTML(s){
  if(s.kind === 'ring')
    return `<div class="ab2-ringbox">
        <svg viewBox="0 0 72 72" aria-hidden="true">
          <circle class="ab2-rbg" cx="36" cy="36" r="30"/>
          <circle class="ab2-rfg" cx="36" cy="36" r="30" pathLength="100"/>
        </svg>
        <div class="ab2-val">0</div>
      </div>`;
  if(s.kind === 'chart'){
    const hi = s.max || Math.max(...s.series.map(x=>x[1]));
    return `<div class="ab2-val">0</div>
      <div class="ab2-chart">${s.series.map((x, k)=>
        `<div class="ab2-cb" style="--v:${Math.round(x[1]/hi*100)}%;--d:${(k*0.12).toFixed(2)}s">
           <i></i><b>${x[0]}</b>
         </div>`).join('')}</div>`;
  }
  if(s.kind === 'trend'){
    const vs = s.series.map(x=>x[1]);
    const lo = Math.min(...vs), hi = Math.max(...vs), span = (hi - lo) || 1;
    const pts = s.series.map((x, k)=>{
      const px2 = 10 + k*(100/(s.series.length - 1));
      const py2 = 36 - ((x[1] - lo)/span)*26;
      return [px2.toFixed(1), py2.toFixed(1)];
    });
    return `<div class="ab2-val">0</div>
      <svg class="ab2-trend" viewBox="0 0 120 44" aria-hidden="true">
        <polyline class="ab2-tl" points="${pts.map(p=>p.join(',')).join(' ')}"/>
        ${pts.map(p=>`<circle class="ab2-td" cx="${p[0]}" cy="${p[1]}" r="3.2"/>`).join('')}
      </svg>`;
  }
  if(s.kind === 'pips'){
    const n = +s.max || +s.value;
    return `<div class="ab2-pips">${Array.from({length:n}, ()=>
      `<img src="${assetUrl(ABOUT2.logo)}" alt="" loading="lazy" decoding="async">`).join('')}</div>`;

  let out = `<div class="ab2-val">${s.kind === 'stamp' ? s.value : '0'}</div>`;
  if(s.kind === 'bar') out += `<div class="ab2-barbox"><div class="ab2-barfill"></div></div>`;
  return out;
}

function gpLoad(){
  try{
    const raw = localStorage.getItem(GP_STORE);
    if(raw){
      const s = Object.assign(gpBlankSheet(), JSON.parse(raw));
      if(!s.formations || !s.formations.length)
        s.formations = (GP.recommended.formations || []).slice();
      if(!s.stickyTags) s.stickyTags = {};
      /* The X-Factor is stored by NAME, so a sheet saved before a roster change
         keeps showing a guy who is no longer on the team (DJ Moore). Drop any
         pick whose player is off the current roster and fall back to the
         recommended one - the sheet heals itself instead of needing a reset. */
      if(s.xFactor && s.xFactor.player){
        const roster = ((typeof PERSONNEL4 !== 'undefined' && PERSONNEL4.players) || [])
          .map(p => p.name);
        if(roster.length && roster.indexOf(s.xFactor.player) === -1)
          s.xFactor = Object.assign({}, GP.recommended.xFactor);
      }
      return s;
    }

}

/* Push the current call sheet to Supabase `saved_sheets` - ONE row per member+scheme,
   upserted, the SAME auth the coaching app reads. Its Call Sheets tab iframes this
   sheet back (/playbooks/<scheme>.html?sheet=1). Gated on sign-in (free to build,
   the modal pops only on save); never throws so the ticket can just read the result.
   returns Promise<{ ok, reason?, message? }>. */
async function saveSheetRemote(){
  try{
    if(!(typeof SK_AUTH !== 'undefined' && SK_AUTH && SK_AUTH.client))
      return { ok:false, reason:'unavailable' };
    const ok = await skRequireLogin('save your call sheet');
    if(!ok) return { ok:false, reason:'cancelled' };
    /* ship a RESOLVED copy of the constraint pairs alongside the raw sheet -
       index entries point into this playbook's GP.constraintOptions, which the
       coaching app can't see. constraintsResolved is what game mode reads to
       fire "they'll jump that now - here's your counter" contextually. */
    const sheetOut = Object.assign({}, gpSheet, {
      constraintsResolved: (gpSheet.constraints || []).map(ci =>
        (typeof ci === 'number') ? (GP.constraintOptions[ci] || null) : ci).filter(Boolean)
    });
    const { error } = await SK_AUTH.client.from('saved_sheets')
      .upsert({ member_id: SK_AUTH.memberId, scheme_key: SCHEME_CONFIG.schemeKey,
                data: sheetOut, updated_at: new Date().toISOString() },
              { onConflict: 'member_id,scheme_key' });
    if(error) throw error;
    return { ok:true };
  }catch(e){ return { ok:false, reason:'error', message: e && e.message }; }
}
/* Pull the member's saved call sheet back (used by the ?sheet= iframe view). Returns
   the raw gpSheet object or null when signed-out / no row / table missing. */
async function loadSheetRemote(){
  try{
    if(!(typeof SK_AUTH !== 'undefined' && SK_AUTH && SK_AUTH.client && SK_AUTH.signedIn))
      return null;
    const { data, error } = await SK_AUTH.client.from('saved_sheets')
      .select('data').eq('member_id', SK_AUTH.memberId)
      .eq('scheme_key', SCHEME_CONFIG.schemeKey).maybeSingle();
    if(error || !data) return null;
    return data.data || null;
  }catch(e){ return null; }
}

          `<span class="gp-key-i"><i>&#10003;</i>${pr.title}</span>`).join('')}</div>
        <span class="gp-sweep" aria-hidden="true"></span>
