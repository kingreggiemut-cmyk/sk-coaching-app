<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>War Room Hub · Scheme Kings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700;800;900&family=Permanent+Marker&display=swap" rel="stylesheet">
<link rel="preload" href="West%20Virginia%20Assets/WVU%20Stadium%20Poster.jpg" as="image">
<!-- Supabase client — SAME project + default session storage as the coaching app,
     so a member signed into the app is already signed in here (no second login),
     and Save Drive writes to their profile's saved_drives. Degrades silently to
     anonymous browsing if it fails to load. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* arriving MID-DIVE from the hub's jump: blacken the frame from the <head>, BEFORE
   the body ever paints. The old plate lived in the bottom scripts, so the browser
   painted the raw cover (the "loading screen" flash) while the huge file parsed. */
if(/[?&]field=1/.test(location.search) && /[?&]dive=1/.test(location.search))
  document.documentElement.classList.add('dbDiving');
</script>
<style>
  html.dbDiving::before{ content:''; position:fixed; inset:0; z-index:400; background:#05070a;
    pointer-events:none; transition:opacity .85s ease; }
  html.dbDiving.dbLanded::before{ opacity:0; }
  html.dbDiving #warCover{ display:none !important; }
  /* the wait has a voice: gold BUILDING THE STADIUM + a sweeping bar on the plate,
     pure CSS so it animates even while the huge body is still parsing */
  html.dbDiving::after{ content:'BUILDING THE STADIUM'; position:fixed; left:50%; top:50%;
    transform:translate(-50%,-50%); z-index:401; pointer-events:none; white-space:nowrap;
    font:900 clamp(20px,2.6vw,36px)/1 'Barlow Condensed','Arial Narrow',sans-serif;
    letter-spacing:.34em; text-indent:.34em; color:#EAAA00; text-align:center;
    padding-bottom:24px; transition:opacity .4s ease;
    background:linear-gradient(90deg, rgba(255,210,60,0) 0%, #ffd23c 30%, #ffd23c 70%, rgba(255,210,60,0) 100%)
      no-repeat bottom center / 34% 4px;
    animation:dbLoadBar 1.15s ease-in-out infinite; }
  @keyframes dbLoadBar{ 0%{ background-position:-40% 100%; } 100%{ background-position:140% 100%; } }
  html.dbDiving.dbLanded::after{ opacity:0; }
  :root{
    --primary:#154733;
    --accent:#FEE123;
    --string:#c0242c;
    --paper:#efe8d4;
    --ink:#17251d;
  }
  html,body{ margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#0b1510;
    font-family:'Arial Narrow', Arial, sans-serif; }

  /* ---------- layer stack ---------- */
  #room{ position:fixed; inset:0; perspective:1500px; }
  #stage{ position:absolute; inset:0; transform-origin:50% 50%;
    transition:transform 1.1s cubic-bezier(.6,.05,.2,1); }

  #backdrop{ position:absolute; inset:0; overflow:hidden; }
  @keyframes mistA{ 0%,100%{ transform:translate(0,0) scale(1);} 50%{ transform:translate(9%,-6%) scale(1.15);} }
  @keyframes mistB{ 0%,100%{ transform:translate(0,0) scale(1.1);} 50%{ transform:translate(-11%,-4%) scale(.95);} }
  @keyframes breath{ 0%,100%{ opacity:.55;} 50%{ opacity:1;} }
  #boardWrap.swing{ animation:swing 1.15s cubic-bezier(.34,1.3,.42,1) both; }
  @keyframes swing{
    0%   { transform:rotateX(-102deg); }
    62%  { transform:rotateX(6.5deg); }
    82%  { transform:rotateX(-2.2deg); }
    100% { transform:rotateX(0deg); }
  }
  #boardWrap.hidden{ transform:rotateX(-102deg); }

  /* mounting hardware: rail + straps, visible above the top edge */
  #rail{ position:absolute; left:6%; right:6%; top:-52px; height:10px; border-radius:5px;
    background:linear-gradient(#8a6b31,#5e4517 60%,#3c2c0e);
    box-shadow:0 3px 6px rgba(0,0,0,.55); }

  #board{ position:absolute; inset:0; border-radius:10px;
    border:14px solid transparent;
    border-image:linear-gradient(160deg,#7c5a28,#4a3413 38%,#8f6c34 62%,#3c2a0e) 1;
    box-shadow:0 34px 60px rgba(0,0,0,.62), inset 0 0 0 3px #c9a044, inset 0 0 90px rgba(0,0,0,.55);
    background:#1b3f2f; overflow:hidden;
  }
  /* key light from above (matches the room's neon + ceiling spots) */
  #board::after{ content:''; position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(180deg, rgba(255,244,170,.13), rgba(0,0,0,0) 34%, rgba(0,0,0,.28) 100%); }
  @keyframes stringPulse{ 0%,100%{ stroke:var(--string);} 45%{ stroke:#ff5a4a; stroke-width:3.4; } }

  /* ---------- cards ---------- */
  .slot{ position:absolute; width:15.5%; aspect-ratio:0.78; transform:translate(-50%,-50%);
    z-index:2; }
  .slot .ghost{ position:absolute; inset:0; border:2px dashed rgba(240,232,212,.28); border-radius:4px;
    background:rgba(0,0,0,.14); }
  .slot.next .ghost{ border-color:rgba(254,225,35,.4); background:rgba(254,225,35,.05); }
  @keyframes tackPulse{ 0%,100%{ box-shadow:inset 0 1px 2px #000, 0 0 0 0 rgba(254,225,35,.4);} 55%{ box-shadow:inset 0 1px 2px #000, 0 0 12px 4px rgba(254,225,35,.45);} }

  .card{ position:absolute; inset:0; background:var(--paper); border-radius:3px;
    box-shadow:0 8px 16px rgba(0,0,0,.55), 0 1px 3px rgba(0,0,0,.6);
    padding:6.5% 6.5% 4%; cursor:pointer; transform:rotate(var(--rot,0deg));
    transition:transform .28s ease, box-shadow .28s ease;
    background-image:linear-gradient(160deg, rgba(255,255,255,.55), rgba(255,255,255,0) 40%, rgba(120,100,60,.18));
  }
  .card:hover{ transform:rotate(var(--rot,0deg)) translateY(-5px) scale(1.045);
    box-shadow:0 18px 30px rgba(0,0,0,.6), 0 2px 5px rgba(0,0,0,.55); z-index:9; }
  .card .art{ width:100%; aspect-ratio:1.25; background:#10281c center/cover no-repeat;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.35), inset 0 0 26px rgba(0,0,0,.35); }
  .card .ttl{ margin-top:6%; font:900 clamp(9px,1.05vw,15px)/1.04 'Arial Narrow', Arial, sans-serif;
    letter-spacing:.05em; color:var(--ink); text-transform:uppercase; }
  .card .sub{ margin-top:2%; font:700 clamp(7px,0.72vw,10.5px)/1 'Arial Narrow', Arial, sans-serif;
    letter-spacing:.16em; color:#8a2b22; text-transform:uppercase; }
  .card .pin{ position:absolute; left:50%; top:-7px; width:16px; height:16px; border-radius:50%;
    transform:translate(-50%,0);
    background:radial-gradient(circle at 34% 28%, #ffe9a8, #c9a044 55%, #6e5423);
    box-shadow:0 3px 4px rgba(0,0,0,.55); }
  .card.done .pin{ box-shadow:0 3px 4px rgba(0,0,0,.55), 0 0 10px 2px rgba(254,225,35,.5); }
  #board.celebrate .card .pin{ animation:pinGlow 1.6s ease-in-out; }
  @keyframes pinGlow{ 50%{ box-shadow:0 3px 4px rgba(0,0,0,.55), 0 0 18px 6px rgba(254,225,35,.8);} }

  .card.dropping{ animation:slap .6s cubic-bezier(.3,1.35,.45,1) both; }
  @keyframes slap{
    0%  { transform:rotate(calc(var(--rot,0deg) - 7deg)) translateY(-90px) scale(1.1); opacity:0; }
    55% { transform:rotate(calc(var(--rot,0deg) + 1.5deg)) translateY(4px) scale(1.01); opacity:1; }
    100%{ transform:rotate(var(--rot,0deg)) translateY(0) scale(1); opacity:1; }
  }
  .card .ttl .stamp{ display:inline-block; animation:stamp .45s cubic-bezier(.25,1.4,.5,1) both; animation-delay:.5s; }
  @keyframes stamp{ 0%{ transform:scale(1.9); opacity:0; } 100%{ transform:scale(1); opacity:1; } }
  /* one Drive Builder button only: the tag at the stadium (enterDB retired) */
  @keyframes fadeUp{ from{ opacity:0; transform:translate(-50%,14px);} to{ opacity:1; transform:translate(-50%,0);} }

  /* both back buttons share one look — top-left, collage chrome */
  #fieldBack, #dbBack{ position:fixed; left:16px; top:16px; z-index:30; display:none; align-items:center; gap:7px;
    font:900 12px/1 'Barlow Condensed','Arial Narrow',sans-serif; letter-spacing:.16em; text-transform:uppercase;
    color:var(--paper); background:rgba(9,14,26,.85); border:1.5px solid rgba(255,154,82,.55);
    border-radius:999px; padding:11px 20px 11px 15px; cursor:pointer; backdrop-filter:blur(4px);
    box-shadow:0 8px 24px rgba(0,0,0,.5); transition:background .14s, border-color .14s, transform .14s; }
  #fieldBack:hover, #dbBack:hover{ background:rgba(16,26,46,.97); border-color:#ff9a52; transform:translateX(-2px); }
  .db-back-arrow{ font-size:16px; line-height:1; margin-top:-1px; }
  /* the builder's one exit: back to the board home (ESC does the same) */
  body.dbBuild #dbBack{ display:flex; }

  #hud{ position:fixed; left:16px; bottom:16px; z-index:30; pointer-events:none;
    font:700 10.5px/1 Arial, sans-serif; letter-spacing:.14em; text-transform:uppercase;
    color:rgba(255,170,110,.9); background:rgba(6,10,20,.6);
    border:1px solid rgba(255,154,82,.3); border-radius:999px; padding:9px 16px;
    backdrop-filter:blur(4px); }
  @keyframes twink{ 0%,100%{ opacity:.08; } 50%{ opacity:.85; } }
  @keyframes webFlow{ to{ stroke-dashoffset:-126; } }
  .wtag.on{ opacity:1; }
  .wsub.on, .wsub.reveal{ opacity:1; }
  #deckUI.gone{ opacity:0; pointer-events:none; }

  #cardStage{ position:fixed; inset:0; z-index:70; display:none; }
  #cardStage.on{ display:block; }
  @keyframes csStamp{ 0%{ opacity:0; transform:translate(-50%,-50%) scale(3.1) rotate(-14deg); }
    30%{ opacity:.3; } 100%{ opacity:.14; transform:translate(-50%,-50%) scale(1.55) rotate(0deg); } }
  .cs-ring.go{ animation:csRingOut .9s cubic-bezier(.15,.6,.3,1) both; }
  .cs-ring.r2.go{ animation-duration:1.15s; animation-delay:.1s;
    border-color:rgba(255,232,120,.9); box-shadow:0 0 24px rgba(255,220,90,.7); }
  @keyframes csRingOut{ 0%{ opacity:.95; width:8vmin; height:8vmin; }
    100%{ opacity:0; width:150vmin; height:150vmin; } }
  .cs-flash.go{ animation:csFlash .62s ease-out both; }
  @keyframes csFlash{ 0%{ opacity:0; } 10%{ opacity:1; } 100%{ opacity:0; } }
  #cardTitle{ position:absolute; left:50%; top:44%; transform:translate(-50%,-50%);
    pointer-events:none; text-align:center; white-space:nowrap; opacity:0; }
  #cardTitle.on{ animation:csTitle 1s cubic-bezier(.2,.85,.3,1) both; opacity:.22; }
  @keyframes csTitle{ 0%{ opacity:0; transform:translate(-50%,-50%) scale(1.5); }
    35%{ opacity:.34; } 100%{ opacity:.22; transform:translate(-50%,-50%) scale(1); } }
  #cardFly{ position:absolute; left:50%; top:44%; width:min(560px,55vh); aspect-ratio:2/3;
    transform:translate(-50%,-50%) translate(var(--tx,0px),var(--ty,0px))
      rotate(var(--rot,0deg)) scale(var(--sc,1));
    transition:transform .68s cubic-bezier(.22,.75,.24,1), opacity .38s ease;
    will-change:transform; }
  #cardKick{ position:absolute; inset:0; transform-style:preserve-3d; }
  @keyframes csJolt{ 0%{ transform:translate(0,0); }
    15%{ transform:translate(-11px,6px) rotate(-1.1deg); }
    30%{ transform:translate(10px,-7px) rotate(1deg); }
    45%{ transform:translate(-7px,4px) rotate(-.6deg); }
    62%{ transform:translate(5px,-3px) rotate(.4deg); }
    80%{ transform:translate(-3px,2px); } 100%{ transform:translate(0,0); } }
  .cs-charge.go{ animation:csCharge .68s ease-in both; }
  @keyframes csCharge{ 0%{ opacity:0; transform:scale(1.5); }
    100%{ opacity:.95; transform:scale(1); } }
  #cardInner{ position:absolute; inset:0; transform-style:preserve-3d;
    transform:rotateY(var(--flip,180deg));
    transition:transform .6s cubic-bezier(.3,.7,.25,1); }
  #cardInner img{ position:absolute; inset:0; width:100%; height:100%;
    backface-visibility:hidden; }
  @keyframes cardShine{ from{ left:-80%; } to{ left:135%; } }
  /* the choice buttons: built to the Drive Builder button - neon green glass
     pill, torn-collage fill, gold gradient lettering, duck badge on the CTA */
  #cardActions{ position:absolute; left:50%; bottom:4.5vh;
    transform:translateX(-50%) translateY(30px); display:flex; gap:26px; align-items:center;
    opacity:0; pointer-events:none;
    transition:opacity .4s ease .12s, transform .5s cubic-bezier(.2,.8,.3,1.2) .12s; }
  #cardStage.choices #cardActions{ opacity:1; pointer-events:auto;
    transform:translateX(-50%) translateY(0); }
  .ca.ghost{ border-color:rgba(63,212,101,.5);
    box-shadow:0 0 12px rgba(74,255,120,.22), 0 12px 26px rgba(0,0,0,.55),
      inset 0 3px 5px rgba(255,255,255,.22), inset 0 -7px 14px rgba(0,42,16,.7); }
  @media (max-width:768px){
    /* TRANSPARENT on purpose: the live 3D diorama (#gl, z1) is the background,
       exactly like desktop. dioCoverFit() makes it fill the portrait screen. */
    #mobileHome{ display:flex; position:fixed; inset:0; z-index:35;
      flex-direction:column; align-items:stretch; overflow-y:auto; -webkit-overflow-scrolling:touch;
      padding:104px 15px 150px; gap:8px; background:transparent; }
    /* just enough wash to hold the header type and settle the scene. Kept LIGHT
       through the middle: a flat mid-tone haze is what made the dark card art
       read gray, while a lit scene behind them reads the way desktop does. */
    #mobileHome::after{ content:''; position:fixed; inset:0; z-index:-1; pointer-events:none;
      background:linear-gradient(180deg, rgba(8,4,4,.6) 0%, rgba(8,4,4,.34) 20%,
        rgba(6,3,3,.16) 46%, rgba(6,3,3,.3) 78%, rgba(5,2,2,.52) 100%); }
    body.fieldMode #mobileHome, body.dbBuild #mobileHome, body.dbOn #mobileHome{ display:none; }
    body:has(#takeover.open) #mobileHome{ display:none; }
    #deckUI{ display:none !important; }
    /* the hub's own deck rig (#dioDeck, z70) sits ABOVE #mobileHome (z35): it
       duplicated the mobile pack and drew its bunting rope across the card grid.
       On phones the mh-deck grid IS the nav, so drop the whole rig. The mobile
       draw path (mhNodes/addMhCard) does not touch any of it. */
    #dioDeck{ display:none !important; }
    /* the JUMP placard ran off the right edge and the meter is presenter-only */
    #dioMiniBtn, #gdMeterBtn{ display:none !important; }
    /* keep the membership ticket, just sized so it clears the header */
    #dioCta{ width:172px !important; left:12px !important; top:10px !important; }
    #dioCta .cta-main{ font-size:15px !important; }
    #dioCta .cta-sub{ display:none !important; }
    #mh-header{ text-align:center; margin-bottom:0; }
    #mobileHome .mh-logo{ width:42px; height:42px; object-fit:contain; margin:0 auto 4px; display:block;
      filter:drop-shadow(0 3px 8px rgba(0,0,0,.6)); }
    #mobileHome .mh-eyebrow{ font:800 10px/1 'Barlow Condensed','Arial Narrow',sans-serif;
      letter-spacing:.24em; text-transform:uppercase; color:#ff8f8f;
      text-shadow:0 2px 8px rgba(0,0,0,.9); }
    #mobileHome .mh-title{ font:900 25px/1 'Barlow Condensed','Arial Narrow',sans-serif;
      text-transform:uppercase; letter-spacing:.02em; color:#F0EAD0; margin:3px 0 2px;
      text-shadow:0 2px 10px rgba(0,0,0,.7); }
    #mobileHome .mh-sub{ font:600 11px/1.3 'Barlow',system-ui,sans-serif; color:rgba(240,231,203,.86);
      text-shadow:0 2px 7px rgba(0,0,0,.9); margin:0; }
    /* the deck grid: always present; cards drop in as they're drawn */
    #mobileHome .mh-deck{ display:grid; grid-template-columns:repeat(2,1fr); gap:11px; margin-top:6px;
      align-content:start; }
    #mobileHome .mh-card{ position:relative; aspect-ratio:512/768; border:0; padding:0; background:none;
      cursor:pointer; -webkit-tap-highlight-color:transparent;
      animation:mhDraw .52s cubic-bezier(.3,1.25,.5,1) both; transition:transform .14s ease; }
    #mobileHome .mh-card img{ width:100%; height:100%; object-fit:contain; display:block;
      filter:saturate(1.12) contrast(1.04) drop-shadow(0 8px 18px rgba(0,0,0,.8)); }
    #mobileHome .mh-card:active{ transform:scale(.96); }
    @keyframes mhDraw{ 0%{ opacity:0; transform:translateY(-64px) scale(1.06) rotate(-2.5deg); }
      58%{ opacity:1; transform:translateY(4px) scale(1) rotate(1deg); } 100%{ opacity:1; transform:none; } }
    /* the deck pack, floating bottom-right: tap it to draw one card, or open the full deck */
    #mobileHome .mh-pack{ position:fixed; right:12px; bottom:14px; z-index:7;
      display:flex; flex-direction:column; align-items:center; gap:6px; }
    #mobileHome .mh-pack-img{ width:min(21vw,86px); height:auto; cursor:pointer; display:block;
      filter:saturate(1.12) contrast(1.04) drop-shadow(0 10px 22px rgba(0,0,0,.8));
      animation:mhPackBob 3s ease-in-out infinite; }
    @keyframes mhPackBob{ 0%,100%{ transform:translateY(0) rotate(-2deg); } 50%{ transform:translateY(-6px) rotate(2deg); } }
    #mobileHome .mh-pack-count{ font:800 9px/1 'Barlow Condensed',sans-serif; letter-spacing:.13em;
      text-transform:uppercase; color:rgba(240,231,203,.75); text-shadow:0 1px 3px rgba(0,0,0,.8); text-align:center; }
    #mobileHome .mh-pack-open{ font:900 10.5px/1 'Barlow Condensed',sans-serif; letter-spacing:.1em;
      text-transform:uppercase; color:#ffffff; background:linear-gradient(180deg,#e85d1a,#8c2d02);
      padding:8px 15px; border-radius:999px; border:0; cursor:pointer;
      box-shadow:0 5px 13px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.5); }
    /* the pack keeps its full color once the deck is out. The only grayed
       control on the phone home is the desktop-only Drive Builder. */
    #mobileHome .mh-pack.mh-drained{ opacity:1; }
    /* the normal Drive Builder button, grayed out, floating bottom-left */
    #mobileHome .mh-db{ position:fixed; left:12px; bottom:16px; z-index:6; display:block;
      border:0; background:none; padding:0; cursor:default; text-align:left; }
    /* the dock the two floating controls sit on, so they stop reading as
       something dropped on top of a card. Hung off .mh-db because it is the
       later of the pair in the DOM; .mh-pack is lifted to z7 to clear it. */
    #mobileHome .mh-db::before{ content:''; position:fixed; left:0; right:0; bottom:0;
      height:124px; z-index:-1; pointer-events:none;
      background:linear-gradient(180deg, rgba(5,2,2,0) 0%, rgba(5,2,2,.5) 52%, rgba(4,2,2,.88) 100%); }
    #mobileHome .mh-db-pill{ display:inline-flex; align-items:center; gap:8px;
      padding:9px 15px 9px 11px; border-radius:999px; opacity:.75;
      background:linear-gradient(180deg, rgba(150,20,20,.85), rgba(70,8,8,.9));
      border:1.5px solid rgba(215,219,222,.5);
      box-shadow:0 5px 13px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.22); }
    #mobileHome .mh-db-pill img{ width:22px; height:22px; object-fit:contain; display:block; }
    #mobileHome .mh-db-tx{ display:flex; flex-direction:column; gap:1px; text-align:left; }
    #mobileHome .mh-db-tx b{ font:900 13px/1 'Barlow Condensed','Arial Narrow',sans-serif;
      letter-spacing:.08em; text-transform:uppercase; color:#fff; }
    #mobileHome .mh-db-tx i{ font:700 8px/1 'Barlow Condensed',sans-serif; font-style:normal;
      letter-spacing:.14em; text-transform:uppercase; color:rgba(255,255,255,.62); }
    #mobileHome .mh-db-note{ display:block; margin-top:3px; font:800 8.5px/1 'Barlow Condensed',sans-serif;
      letter-spacing:.14em; text-transform:uppercase; color:rgba(240,231,203,.5); }
    @media (prefers-reduced-motion:reduce){ #mobileHome .mh-card{ animation:none; } #mobileHome .mh-pack-img{ animation:none; } }
  }
  #readyBar.on{ display:flex; }
  #installSheet.open{ transform:translateY(0); }
  #installSheet .is-sheet{ pointer-events:auto; width:100%; max-width:1220px;
    --primary:#154733; --secondary:#FEE123; --cream:#F0EAD0; --gold:#F5A623;
    --font-display:"Barlow Condensed","Oswald","Arial Narrow",sans-serif;
    --font-body:"Barlow",system-ui,sans-serif;
    --font-marker:"Permanent Marker",cursive; --ease:cubic-bezier(.2,.75,.2,1);
    background:var(--cream); border:3px solid #f6e04a; border-radius:22px;
    box-shadow:0 0 0 2px rgba(21,71,51,.9), 0 0 26px rgba(254,225,35,.4),
      0 0 60px rgba(254,225,35,.14), 0 24px 55px rgba(0,0,0,.62);
    overflow:hidden; }
  .is-top{ display:flex; align-items:center; gap:16px; padding:13px 22px; cursor:pointer;
    position:relative;
    background:linear-gradient(158deg,
      color-mix(in srgb, var(--primary) 70%, white 30%), var(--primary) 58%,
      color-mix(in srgb, var(--primary) 76%, black 24%));
    border-bottom:3px solid var(--secondary); }
  .is-top::after{ content:''; position:absolute; left:1.5%; right:1.5%; top:5%; height:44%;
    border-radius:12px; pointer-events:none;
    background:linear-gradient(180deg, rgba(255,255,255,.28), rgba(255,255,255,0)); }
  .is-crest{ width:50px; height:50px; border-radius:50%; flex:0 0 auto; overflow:hidden;
    background:radial-gradient(circle at 50% 32%, color-mix(in srgb, var(--primary) 55%, white 15%), var(--primary) 78%);
    border:3px solid var(--gold); display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 0 2px rgba(0,0,0,.35), inset 0 2px 6px rgba(255,255,255,.25); }
  .is-crest img{ width:72%; height:72%; object-fit:contain; }
  .is-eyebrow{ font-family:var(--font-display); font-weight:800; font-size:11px; letter-spacing:.24em;
    text-transform:uppercase; color:var(--secondary); }
  .is-title{ font-family:var(--font-display); font-weight:900; font-size:25px; letter-spacing:.01em;
    text-transform:uppercase; color:var(--cream); line-height:1.05; text-shadow:0 2px 3px rgba(0,0,0,.4); }
  .is-ready{ margin-left:auto; min-width:300px; }
  .is-ready-label{ text-align:right; font-family:var(--font-display); font-weight:800; font-size:10.5px;

  /* the room recedes to a whisper: the table floats in darkness and mist */
  /* the landscape lives INSIDE the 3D scene now (the sky wall plane). The DOM
     backdrop behind the canvas is the color of dark night AIR, never pure
     black - empty frame corners read as atmosphere, not a rendering hole */
  #backdrop{ background:radial-gradient(120% 100% at 50% 40%, #0a1a20 0%, #071219 55%, #040b10 100%); }

  /* ==========================================================================
     DRIVE BUILDER — ported from the playbook Drive Builder (GoGo), living on
     the 3D field after the dive. Scoped: GoGo's palette kept via local vars.
     ========================================================================== */
  /* the Drive Builder entry: a gameday pill planted under midfield; JS projects
     it onto the field each frame so it always faces the camera. Lets you look
     around the stadium first, then start building when you're ready. */
  #dbOpen{ position:fixed; left:50%; top:60%; transform:translate(-50%,-50%);
    z-index:12; display:none; padding:0; background:none; border:none; cursor:pointer;
    filter:drop-shadow(0 10px 22px rgba(0,0,0,.55)); transition:filter .16s ease, opacity .25s ease;
    -webkit-tap-highlight-color:transparent; }
  #dbOpen .dbo-in{ display:inline-flex; align-items:center; gap:11px; padding:12px 22px 12px 13px; border-radius:999px;
    background:linear-gradient(180deg,#c81a1a,#7a0000); border:2.5px solid #d7dbde;
    box-shadow:inset 0 2px 4px rgba(255,255,255,.2), 0 4px 0 rgba(0,0,0,.35);
    animation:dbOpenBob 2.6s ease-in-out infinite; }
  #dbOpen .dbo-duck{ width:34px; height:34px; object-fit:contain; filter:drop-shadow(0 1px 2px rgba(0,0,0,.4)); }
  #dbOpen .dbo-in > span{ font:900 17px/1 'Barlow Condensed','Arial Narrow',sans-serif; letter-spacing:.06em;
    text-transform:uppercase; color:#ffffff; text-shadow:0 1px 2px rgba(0,0,0,.5); white-space:nowrap; }
  #dbOpen:hover{ filter:drop-shadow(0 14px 28px rgba(0,0,0,.65)) brightness(1.06); }
  #dbOpen:active{ filter:brightness(.97); }
  @keyframes dbOpenBob{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-6px); } }
  @media (prefers-reduced-motion: reduce){ #dbOpen .dbo-in{ animation:none; } }
  /* WAS field-only. With the stadium gone there is no field to stand in, so
     the builder's only door has to live on the room screen itself. */
  #dbOpen{ display:block; top:auto; bottom:7%; transform:translate(-50%,0); }
  body.covering #dbOpen, body.dbOn #dbOpen, body.dbBuild #dbOpen,
  body:has(#takeover.open) #dbOpen{ display:none; }
  #dbBg{ position:fixed; inset:0; z-index:4; display:none; pointer-events:none;
    background:url("Bears Assets/Bears Office background.jpg") center/cover no-repeat;
    filter:blur(7px) brightness(.44) saturate(.9);
    /* --px/--py are the window-wide pointer position the app already publishes.
       scale 1.12 gives more overhang than the drift can ever use, so no edge
       can show. The long transition makes it lag, which is what reads as depth. */
    translate:calc(var(--px,0) * -30px) calc(var(--py,0) * -20px);
    transform:scale(1.12);
    transition:translate 1s cubic-bezier(.2,.8,.3,1);
    animation:dbBgDrift 30s ease-in-out infinite; }
  @keyframes dbBgDrift{ 0%,100%{ transform:scale(1.12); } 50%{ transform:scale(1.16); } }
  #dbBgVig{ position:fixed; inset:0; z-index:5; display:none; pointer-events:none;
    background:radial-gradient(125% 95% at 50% 45%, rgba(0,0,0,0) 34%, rgba(0,0,0,.74) 100%); }
  body.dbBuild #dbBg, body.dbBuild #dbBgVig, body.dbOn #dbBg, body.dbOn #dbBgVig{ display:block; }
  @media (prefers-reduced-motion:reduce){ #dbBg{ animation:none; translate:none; } }

  .db-web{ --gold:#f07a2e; --cream:#f3ecd8; --font-display:'Arial Narrow', Arial, sans-serif; --font-body:Arial, sans-serif;

    transition:opacity .35s ease, transform .5s cubic-bezier(.2,.85,.3,1.03); }

  .db-tadd{ position:absolute; transform:translate(-50%,-50%); cursor:pointer; white-space:nowrap;

    color:#ffd9b8; padding:10px 19px; border-radius:30px;

    transition:border-color .14s, color .14s, border-style .14s; }

    border-radius:12px; padding:14px 18px; box-shadow:0 12px 30px rgba(0,0,0,.55); }

    display:none; gap:7px; padding:9px; border-radius:14px; white-space:nowrap;

  .db-tnode.menu-open .db-tactions{ display:flex; }

    border:1.5px solid rgba(255,255,255,.16); transition:background .12s, border-color .12s; }

  /* play picker panel (build mode) */
  /* ===== DRIVE BUILDER — collage reskin: taped paper, sticky notes, kraft tabs.
     Same physical-artifact language as the Game Plan call sheet + Full Offense
     cutouts. No glass, no neon; cream paper, athletic tape, printed ink. ===== */
  /* the play rail is a real piece of paper taped to the field, not a glass panel */
  #dbPlays{ position:fixed; right:18px; top:8%; bottom:13%; width:298px; z-index:25; display:none;
    flex-direction:column; gap:11px; padding:21px 15px 15px; border-radius:5px; transform:rotate(.45deg);
    background:
      radial-gradient(120% 80% at 30% 6%, rgba(255,255,252,.6), rgba(0,0,0,0) 55%),
      repeating-linear-gradient(0deg, rgba(120,100,58,.03) 0 2px, rgba(0,0,0,0) 2px 5px),
      linear-gradient(165deg, #f6f1de 0%, #efe8d0 55%, #e7dec2 100%);
    box-shadow:0 6px 14px rgba(0,0,0,.32), 0 28px 60px rgba(0,0,0,.55), inset 0 0 50px rgba(122,98,52,.08); }
  body.dbBuild #dbPlays{ display:flex; animation:dbSlideR .46s cubic-bezier(.2,.85,.3,1.02) .12s both; }
  @keyframes dbSlideR{ from{ opacity:0; translate:38px 0; } to{ opacity:1; translate:0 0; } }
  /* athletic-tape corners */
  #dbPlays::before, #dbPlays::after{ content:''; position:absolute; top:-11px; width:82px; height:25px; z-index:6;
    border-radius:2px; background:linear-gradient(180deg, rgba(240,230,184,.9), rgba(214,198,138,.7));
    box-shadow:0 2px 5px rgba(0,0,0,.3); }
  #dbPlays::before{ left:9%; transform:rotate(-3deg); }
  #dbPlays::after{ right:9%; transform:rotate(2.6deg); }
  /* category file-folder tabs */
  #dbPlays .db-cats{ display:flex; gap:5px; flex-wrap:wrap; }
  .db-cat{ font:900 10.5px/1 'Barlow Condensed','Arial Narrow',sans-serif; letter-spacing:.09em;
    text-transform:uppercase; color:#6b5a33; cursor:pointer; padding:7px 10px 8px; border-radius:8px 8px 3px 3px;
    background:linear-gradient(180deg,#e9dfc2,#d9cca6); border:1.5px solid rgba(120,100,58,.4); border-bottom:none;
    box-shadow:inset 0 2px 2px rgba(255,255,255,.5), 0 2px 5px rgba(0,0,0,.2);
    transition:transform .16s ease, filter .16s ease; }
  .db-cat:hover{ filter:brightness(1.05); }
  .db-cat.on{ transform:translateY(-2px); color:#9c3202; background:linear-gradient(180deg,#f6efd8,#e9dfc2);
    border-color:rgba(156,50,2,.5); }
  /* printed ink heading */
  #dbPlays .db-phead{ font:900 12px/1 'Barlow Condensed','Arial Narrow',sans-serif; letter-spacing:.15em;
    text-transform:uppercase; color:#9c3202; margin:1px 2px -3px; padding-bottom:6px;
    border-bottom:2px dashed rgba(156,50,2,.32); }
  #dbPlays .db-list{ flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:12px; padding:7px 4px 4px 2px; }
  #dbPlays .db-list::-webkit-scrollbar{ width:5px; }
  #dbPlays .db-list::-webkit-scrollbar-thumb{ background:rgba(11,22,42,.45); border-radius:3px; }
  /* play chips are STICKY NOTES tinted by type — the Game Plan language */
  .db-pill{ position:relative; display:flex; align-items:center; gap:9px; width:100%; text-align:left;
    padding:10px 13px 11px; cursor:pointer; transform:rotate(var(--r,-.6deg));
    background:linear-gradient(180deg, rgba(255,255,255,.5), rgba(255,255,255,0) 30%), var(--stick,#e4dbc4);
    box-shadow:0 3px 7px rgba(0,0,0,.25), 0 1px 2px rgba(0,0,0,.18);
    transition:transform .15s ease, box-shadow .15s ease, filter .15s ease; }
  .db-pill:nth-child(even){ --r:.7deg; }
  .db-pill::after{ content:''; position:absolute; right:0; bottom:0; width:0; height:0; border-style:solid;
    border-width:0 0 11px 11px; border-color:transparent transparent rgba(0,0,0,.14) transparent; }
  .db-pill:hover{ transform:rotate(var(--r,-.6deg)) translateY(-3px) scale(1.02); box-shadow:0 8px 16px rgba(0,0,0,.3); }
  .db-t-run{ --stick:#cfe6c4; } .db-t-pass{ --stick:#c5dcef; } .db-t-star{ --stick:#f7e08a; } .db-t-other{ --stick:#e4dbc4; }

    border-width:14px 14px 0 0; border-color:#c9a222 transparent transparent transparent; }
  /* the add ＋ is a small hand-drawn ink circle */

    display:flex; align-items:center; justify-content:center; font-weight:900; font-size:15px; line-height:1;

  /* control bar + caption + play card */

  #dbCap{ position:fixed; left:50%; bottom:calc(4.5% + 62px); transform:translateX(-50%); z-index:26;

  /* the docked drive-builder call sheet - Bears navy/orange */
  .db-install{
    --primary:#0B162A; --secondary:#C83803; --cream:#F0EAD0; --gold:#f07a2e;
    --font-display:"Barlow Condensed","Oswald","Arial Narrow",sans-serif;
    --font-body:"Barlow",system-ui,sans-serif;
    --font-marker:"Permanent Marker",cursive;
    --ease:cubic-bezier(.2,.75,.2,1);
    position:fixed; left:20px; top:6%; bottom:8%; width:322px; z-index:25; display:none;
    border-radius:5px; overflow:visible; flex-direction:column; transform:rotate(-.5deg);
    background:
      radial-gradient(120% 80% at 30% 6%, rgba(255,255,252,.6), rgba(0,0,0,0) 55%),
      repeating-linear-gradient(0deg, rgba(120,100,58,.03) 0 2px, rgba(0,0,0,0) 2px 5px),
      linear-gradient(165deg, #f6f1de 0%, #efe8d0 55%, #e7dec2 100%);
    box-shadow:0 6px 14px rgba(0,0,0,.32), 0 28px 60px rgba(0,0,0,.55), inset 0 0 50px rgba(122,98,52,.08);
  }
  /* the sheet slides in off the left edge, the rail off the right, the tray up
     from the floor - translate (not transform) so their paper rotation holds */
  body.dbOn .db-install{ display:flex; animation:dbSlideL .46s cubic-bezier(.2,.85,.3,1.02) .06s both; }
  @keyframes dbSlideL{ from{ opacity:0; translate:-38px 0; } to{ opacity:1; translate:0 0; } }
  /* athletic-tape corners, same as the play rail */
  .db-install::before, .db-install::after{ content:''; position:absolute; top:-11px; width:82px; height:25px; z-index:6;
    border-radius:2px; background:linear-gradient(180deg, rgba(240,230,184,.9), rgba(214,198,138,.7));
    box-shadow:0 2px 5px rgba(0,0,0,.3); }
  .db-install::before{ left:9%; transform:rotate(-2.6deg); }
  .db-install::after{ right:9%; transform:rotate(3deg); }
  /* printed title block on the paper — O badge + green ink, double-rule under */
  .db-install-head{
    position:relative; padding:16px 16px 11px; flex:0 0 auto; display:grid;
    grid-template-columns:auto 1fr; grid-template-areas:'crest eyebrow' 'crest title'; gap:0 12px;
    align-items:center; background:transparent; border-bottom:3px double rgba(199,138,21,.55);
  }
  .db-install-crest{
    grid-area:crest; width:40px; height:40px; margin:0; border-radius:50%; overflow:hidden;
    background:radial-gradient(circle at 50% 32%, color-mix(in srgb, var(--primary) 55%, white 15%), var(--primary) 78%);
    border:2.5px solid var(--gold);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 0 1.5px rgba(0,0,0,.3), inset 0 2px 6px rgba(255,255,255,.25), inset 0 -4px 8px rgba(0,0,0,.35);
    transform:rotate(-4deg);
  }
  .db-install-crest img{ width:72%; height:72%; object-fit:contain; }
  .db-install-eyebrow{
    grid-area:eyebrow; align-self:end;
    font-family:var(--font-display); font-weight:800; font-size:10.5px; letter-spacing:.2em;
    text-transform:uppercase; color:#9c3202; margin-bottom:2px;
  }
  .db-install-title{
    grid-area:title; align-self:start;
    font-family:var(--font-display); font-weight:900; font-size:21px; letter-spacing:.01em;
    text-transform:uppercase; color:#12325e; line-height:1.05;
  }
  .db-install-mode-btn{
    position:absolute; top:9px; right:11px; width:9px; height:9px; margin:0; padding:0;
    border:none; border-radius:50%; cursor:pointer;
    background:rgba(255,255,255,.16);
    transition:background .15s ease, transform .15s ease;
  }
  .db-install-mode-btn:hover{ background:rgba(255,255,255,.4); transform:scale(1.4); }
  .db-install.presenter-mode .db-install-mode-btn{
    background:var(--secondary);
    box-shadow:0 0 5px color-mix(in srgb, var(--secondary) 70%, transparent);
  }
  .db-install-body{ flex:1; overflow-y:auto; padding:18px 20px; }
  .db-install-notes{ display:flex; flex-direction:column; }
  .db-install-note{ padding:13px 0; }
  .db-install-note + .db-install-note{
    border-top:1.5px dashed color-mix(in srgb, var(--primary) 30%, transparent);
  }
  .db-install-note-top{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:7px; }
  .db-install-note-label{
    font-family:var(--font-marker); font-size:19px; line-height:1.2; color:var(--primary);
    display:inline-block; transform:rotate(-1.2deg); white-space:nowrap; overflow:hidden;
    border-bottom:2px solid var(--secondary); padding-bottom:3px;
    clip-path:inset(0 100% 0 0); animation:dbInstallStroke .65s steps(20) forwards;
    animation-delay:var(--rd,0s);
  }
  .db-install-note-right{ flex:0 0 auto; display:flex; align-items:center; gap:8px; }
  .db-install-note-stat{
    font-family:var(--font-display); font-weight:800; font-size:11px; letter-spacing:.03em; white-space:nowrap;
    color:var(--primary); background:color-mix(in srgb, var(--secondary) 20%, transparent);
    border:1.5px solid color-mix(in srgb, var(--secondary) 55%, transparent); border-radius:20px; padding:3px 10px;
    opacity:0; transform:translateY(3px) scale(.9);
    animation:dbInstallFade .4s ease forwards; animation-delay:calc(var(--rd,0s) + .55s);
  }
  .db-install-note-check{
    flex:0 0 auto; display:inline-flex; color:var(--secondary);
    opacity:0; transform:scale(.5) rotate(-6deg);
    animation:dbInstallCheckPop .4s var(--ease) forwards; animation-delay:calc(var(--rd,0s) + 1s);
  }
  .db-install-note-check svg{ width:34px; height:28px; overflow:visible; }
  .db-install-note-text{
    font-family:var(--font-body); font-weight:600; font-size:13.5px; line-height:1.5; margin:0;
    color:color-mix(in srgb, var(--primary) 72%, #241f0d 28%);
    opacity:0; transform:translateY(4px);
    animation:dbInstallFade .5s ease forwards; animation-delay:calc(var(--rd,0s) + .3s);
  }
  @keyframes dbInstallStroke{ from{ clip-path:inset(0 100% 0 0); } to{ clip-path:inset(0 0% 0 0); } }
  @keyframes dbInstallFade{ from{ opacity:0; transform:translateY(4px); } to{ opacity:1; transform:translateY(0); } }
  @keyframes dbInstallCheckPop{ 0%{ opacity:0; transform:scale(.5) rotate(-6deg); } 60%{ opacity:1; transform:scale(1.2) rotate(-6deg); } 100%{ opacity:1; transform:scale(1) rotate(-6deg); } }
  @keyframes dbInstallCheckDraw{ to{ stroke-dashoffset:0; } }
  .db-install.presenter-mode .db-install-note-label{ animation:none; clip-path:inset(0 100% 0 0); }
  .db-install.presenter-mode .db-install-note-text{ animation:none; opacity:0; transform:translateY(4px); }
  .db-install.presenter-mode .db-install-note-stat{ animation:none; opacity:0; transform:translateY(3px) scale(.9); }
  .db-install.presenter-mode .db-install-note-check{ animation:none; opacity:0; transform:scale(.5) rotate(-6deg); }
  .db-install.presenter-mode .db-install-note{ cursor:pointer; border-radius:8px; transition:background .15s ease; }
  .db-install.presenter-mode .db-install-note:hover{ background:color-mix(in srgb, var(--secondary) 10%, transparent); }
  .db-install.presenter-mode .db-install-note.revealed .db-install-note-label{
    animation:dbInstallStroke .5s steps(20) forwards; animation-delay:0s;
  }
  .db-install.presenter-mode .db-install-note.revealed .db-install-note-text{
    animation:dbInstallFade .45s ease forwards; animation-delay:.2s;
  }
  .db-install.presenter-mode .db-install-note.revealed .db-install-note-stat{
    animation:dbInstallFade .35s ease forwards; animation-delay:.4s;
  }
  .db-install.presenter-mode .db-install-note.revealed .db-install-note-check{
    animation:dbInstallCheckPop .4s var(--ease) forwards; animation-delay:.55s;
  }
  .db-install-foot{
    flex:0 0 auto; padding:14px 20px 18px;
    border-top:3px solid var(--secondary);
    background:linear-gradient(0deg, color-mix(in srgb, var(--primary) 12%, var(--cream)), var(--cream));
  }
  .db-install-meter-label{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:8px; }
  .db-install-meter-eyebrow{
    font-family:var(--font-display); font-weight:800; font-size:11px; letter-spacing:.2em;
    text-transform:uppercase; color:var(--primary); opacity:.75;
  }
  .db-install-meter-count{ font-family:var(--font-marker); font-size:15px; color:var(--primary); }
  .db-install-meter-track{
    height:14px; border-radius:8px; overflow:hidden; position:relative;
    background:color-mix(in srgb, var(--primary) 16%, transparent);
    border:2px solid color-mix(in srgb, var(--primary) 40%, transparent);
  }
  .db-install-meter-fill{
    height:100%; width:100%; border-radius:6px;
    background:linear-gradient(90deg, var(--secondary), color-mix(in srgb, var(--secondary) 70%, white 30%));
    box-shadow:0 0 10px color-mix(in srgb, var(--secondary) 60%, transparent);
    transition:width .4s var(--ease);
  }

  /* left panel, Drive Builder mode: a skinny read-only mirror of the saved
     Oregon call sheet (Scheme DNA). Just the play calls — no formations,
     x-factor, tags, or tempo header. Click a call to drop it on the drive. */
  .db-cs-body{ padding:15px 15px; display:flex; flex-direction:column; gap:16px; }
  .db-cs-sec{ display:flex; flex-direction:column; gap:8px; }
  /* printed ink section header, like a real call sheet's section box */
  .db-cs-lbl{ align-self:flex-start; padding:4px 12px 5px; border-radius:0 0 4px 0;
    font-family:var(--font-display); font-weight:900; font-size:10.5px; letter-spacing:.13em;
    text-transform:uppercase; color:#f6f1de; background:#0B162A; box-shadow:0 2px 5px rgba(0,0,0,.22); }
  /* each saved call is a mini sticky note */
  .db-cs-play{ position:relative; display:flex; align-items:center; gap:9px; width:100%; text-align:left;

  .db-cs-play:nth-child(even){ --r:.6deg; }
  .db-cs-play::after{ content:''; position:absolute; right:0; bottom:0; width:0; height:0; border-style:solid;
    border-width:0 0 9px 9px; border-color:transparent transparent rgba(0,0,0,.13) transparent; }
  .db-cs-dot{ width:11px; height:11px; border-radius:50%; flex:0 0 auto;
    background:radial-gradient(circle at 35% 30%, #f07a2e, #9c3202); border:1.5px solid rgba(156,50,2,.5); }
  .db-cs-dot.star{ background:radial-gradient(circle at 35% 30%, #ffb27a, #c9a222); border-color:#c9a222; }
  .db-cs-txt{ display:flex; flex-direction:column; line-height:1.05; min-width:0; }
  .db-cs-txt b{ font-family:var(--font-display); font-weight:900; font-size:12.5px; letter-spacing:.02em;
    text-transform:uppercase; color:#232012; }
  .db-cs-txt i{ font-family:var(--font-display); font-weight:800; font-size:8.5px; font-style:normal;
    letter-spacing:.1em; text-transform:uppercase; color:rgba(35,32,18,.58); margin-top:2px; }
  .db-cs-empty{ font-family:var(--font-body); font-weight:600; font-size:12.5px; line-height:1.55;

  .db-cs-foot{ display:flex; align-items:baseline; justify-content:space-between;
    padding:12px 16px; border-top:3px double rgba(156,50,2,.5); background:transparent; }
  .db-cs-foot-lbl{ font-family:var(--font-display); font-weight:800; font-size:11px; letter-spacing:.18em;
    text-transform:uppercase; color:#9c3202; opacity:.8; }
  .db-cs-foot-count{ font-family:var(--font-marker,'Permanent Marker'),cursive; font-size:15px; color:#9c3202; }
  /* presenter states: the Scheme Kings unlock CTA, ghost prompts, presenter chip */
  .db-cs-cta{ position:relative; display:flex; align-items:center; gap:12px; margin:2px 2px 10px;
    padding:12px 13px; transform:rotate(-.6deg);
    background:linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,0) 40%), #eef3ff;
    border:2px solid #2b4f76; box-shadow:0 3px 9px rgba(0,0,0,.28); }
  .db-cs-cta::before{ content:''; position:absolute; top:-10px; left:16px; width:64px; height:22px; transform:rotate(-6deg);
    background:linear-gradient(180deg, rgba(96,134,222,.85), rgba(58,98,188,.72)); box-shadow:0 2px 4px rgba(0,0,0,.25); }
  .db-cs-cta-logo{ flex:0 0 auto; width:54px; height:54px; object-fit:contain; transform:rotate(-3deg);
    filter:drop-shadow(0 2px 4px rgba(0,0,0,.3)); }
  .db-cs-cta-txt{ display:flex; flex-direction:column; gap:3px; min-width:0; }
  .db-cs-cta-txt > b{ font:900 14px/1.02 'Barlow Condensed','Arial Narrow',sans-serif; letter-spacing:.02em;
    text-transform:uppercase; color:#0B162A; }
  .db-cs-cta-txt span{ font:600 11px/1.38 'Barlow',system-ui,sans-serif; color:#3a4636; }
  .db-cs-cta-txt span b{ color:#2b4f76; font-weight:800; }
  .db-cs-ghost{ align-self:flex-start; padding:6px 12px; border:2px dashed rgba(11,22,42,.45); border-radius:3px;
    background:rgba(255,255,255,.25); font:900 9.5px/1 'Barlow Condensed','Arial Narrow',sans-serif;
    letter-spacing:.09em; text-transform:uppercase; color:#5c6b4f; }
  /* presenter video sheet: calls hidden until revealed, then a quick pop-in */
  .db-cs-play.db-cs-hide{ display:none; }
  .db-cs-play.db-cs-reveal{ animation:dbCsReveal .4s cubic-bezier(.2,.9,.3,1.15) both; }
  @keyframes dbCsReveal{ from{ opacity:0; transform:translateY(12px) scale(.9) rotate(var(--r,-.5deg)); }
    to{ opacity:1; transform:rotate(var(--r,-.5deg)); } }
  @media (prefers-reduced-motion: reduce){ .db-cs-play.db-cs-reveal{ animation:none; } }
  .db-cs-mode-chip{ position:absolute; top:-11px; right:16px; z-index:7; padding:4px 11px 5px; border-radius:3px;
    background:#a0342e; color:#fff; font:900 8.5px/1 'Barlow Condensed','Arial Narrow',sans-serif;
    letter-spacing:.13em; text-transform:uppercase; box-shadow:0 2px 6px rgba(0,0,0,.3); transform:rotate(2deg); }
  /* Run Drive is retired for now */
  #dbBtnRun{ display:none !important; }
  /* clean scrolling: no classic bars, never a horizontal bar; a soft paper fade
     at the bottom edge signals there's more below */

  /* PHONES: the drive fills the screen; CALL SHEET and PLAYS are big tabs

      text-transform:uppercase; color:#3f351f; cursor:pointer; padding:12px 16px 13px; border-radius:9px;
      background:linear-gradient(172deg,#f2e9d2,#e2d4ae); border:1.5px solid rgba(120,100,58,.55);
      box-shadow:0 8px 16px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.55); }
    #dbMob button.on{ color:#fdf6e6; background:linear-gradient(180deg,#e85d1a,#8c2d02);
      border-color:rgba(255,214,183,.65); }
    body.dbSheet.dbOn .db-install{ display:flex !important; position:fixed;
      left:8px; right:8px; top:104px; bottom:8px; width:auto; z-index:40; transform:none; }
    body.dbRail.dbBuild #dbPlays{ display:flex !important; position:fixed;
      left:8px; right:8px; top:auto; bottom:8px; height:54vh; width:auto; z-index:40; transform:none; }
    /* tighter nodes so the fitted tree reads bigger on a phone */
    .db-tnode{ min-width:104px; max-width:150px; padding:8px 12px 9px; }
    .db-tnm{ font-size:14px; }
    .db-tsub{ font-size:9px; }

    #dbBack{ left:10px; top:10px; }
    #hud{ display:none !important; }
    #dbBar{ left:8px; right:8px; bottom:10px; transform:none; flex-wrap:wrap;

    .db-dtool{ padding:8px 11px; font-size:10.5px; }
    #dbCap{ left:8px; right:8px; bottom:96px; transform:none; max-width:none; font-size:11.5px; }

  }

  /* ============================================================================
     WAR COVER — the landing / loading gate. Shows instantly over the skyline
     video while the heavy 3D world builds behind it; "Open Playbook" lifts it.
     Ported from the Alabama cover, reskinned to Oregon. ============================ */
  #warCover{ --cvg:#0B162A; --cvg2:#1d3a5f; --cvy:#ff8a3d; --cvc:#F0EAD0; --cvgold:#ff7a2e;
    --cve:cubic-bezier(.22,1,.36,1);
    position:fixed; inset:0; z-index:50; display:flex; flex-direction:column;
    align-items:center; justify-content:center; padding:24px 20px; overflow:hidden;
    background:#070b14; transition:opacity .5s ease, transform .5s ease; }
  #warCover.lift{ opacity:0; transform:scale(1.04); pointer-events:none; }
  #warCover.hidden{ display:none; }
  #cv-vid{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:0;
    filter:brightness(.66) saturate(1.05); animation:cvZoom 34s ease-in-out infinite alternate; }
  @keyframes cvZoom{ from{ transform:scale(1); } to{ transform:scale(1.1); } }
  #cv-veil{ position:absolute; inset:0; z-index:1; pointer-events:none;
    background:
      radial-gradient(120% 90% at 50% 12%, rgba(0,0,0,0) 40%, rgba(3,10,6,.7) 100%),
      linear-gradient(180deg, rgba(3,10,6,.5), rgba(3,10,6,.2) 32%, rgba(3,10,6,.72) 100%); }
  #warCover > .cv-in{ position:relative; z-index:2; display:flex; flex-direction:column;
    align-items:center; width:100%; max-width:940px; }
  .cv-logo{ width:124px; height:124px; margin-bottom:8px; filter:drop-shadow(0 6px 16px rgba(0,0,0,.6)); }
  .cv-logo img{ width:100%; height:100%; object-fit:contain; }
  /* carousel */
  .cv-tour{ width:min(900px,94vw); margin:6px 0 2px; }
  .cv-eyebrow{ font:800 12px/1 'Barlow Condensed','Arial Narrow',sans-serif; letter-spacing:.22em;
    text-transform:uppercase; color:var(--cvy); opacity:.9; margin-bottom:14px; text-align:center; }
  .cv-stage{ position:relative; display:flex; align-items:center; justify-content:center; gap:14px; }
  .cv-track{ position:relative; flex:1 1 auto; min-width:0; height:clamp(210px,34vh,290px); }
  .cv-slide{ position:absolute; inset:0; display:flex; gap:22px; align-items:center; text-align:left;
    opacity:0; pointer-events:none; transform:translateX(16px) scale(.99);

  .cv-slide.on{ opacity:1; pointer-events:auto; transform:none; }
  .cv-shot{ flex:0 0 auto; height:100%; aspect-ratio:16/10; border-radius:12px; overflow:hidden; position:relative;
    background:linear-gradient(150deg,#0c1526,#060a14); border:2px solid rgba(215,219,222,.38);

  .cv-cap{ flex:1; min-width:0; }
  .cv-num{ font:800 9px/1 'Barlow Condensed',sans-serif; letter-spacing:.2em; text-transform:uppercase;
    color:var(--cvy); opacity:.75; margin-bottom:8px; }
  .cv-title2{ font:900 clamp(22px,2.5vw,30px)/1 'Barlow Condensed','Arial Narrow',sans-serif;
    letter-spacing:.01em; text-transform:uppercase; color:var(--cvc); margin-bottom:8px; }
  .cv-desc{ font:500 13.5px/1.5 'Barlow',system-ui,sans-serif; color:rgba(240,231,203,.82); margin:0; max-width:38ch; }
  .cv-arrow{ position:static; flex:0 0 auto; z-index:4; width:40px; height:40px;

    font-size:20px; cursor:pointer; display:flex; align-items:center; justify-content:center;

  .cv-arrow:hover{ background:rgba(12,26,50,.95); border-color:var(--cvy); transform:scale(1.08); }
  .cv-dots{ display:flex; justify-content:center; gap:8px; margin-top:18px; }

  .cv-dot.on{ background:var(--cvy); transform:scale(1.25); }
  /* title block */
  .cv-series{ font:800 11px/1 'Barlow Condensed',sans-serif; letter-spacing:.24em; text-transform:uppercase;
    color:var(--cvy); opacity:.85; margin:18px 0 6px; }
  .cv-title{ font:900 clamp(38px,6vw,74px)/.94 'Barlow Condensed','Arial Narrow',sans-serif;

    text-shadow:0 4px 22px rgba(0,0,0,.6); margin:0; }
  .cv-sub{ font:700 13px/1 'Barlow Condensed',sans-serif; letter-spacing:.16em; text-transform:uppercase;
    color:rgba(240,231,203,.7); margin-top:12px; }
  .cv-open{ margin-top:22px; display:inline-flex; align-items:center; gap:9px; cursor:pointer;
    font:900 15px/1 'Barlow Condensed','Arial Narrow',sans-serif; letter-spacing:.12em; text-transform:uppercase;
    color:#ffffff; background:linear-gradient(180deg,#e85d1a,#8c2d02); border:none; border-radius:999px;
    padding:15px 40px; box-shadow:0 10px 26px rgba(0,0,0,.5), 0 0 0 2px rgba(255,255,255,.15) inset;
    transition:transform .16s var(--cve), filter .16s, box-shadow .3s; }
  .cv-open:hover{ transform:translateY(-3px); filter:brightness(1.06); }

  .cv-open .cv-open-dot{ width:9px; height:9px; border-radius:50%; background:#ffffff; opacity:.55;
    animation:cvPulse 1s ease-in-out infinite; display:none; }
  .cv-open.warming .cv-open-dot{ display:inline-block; }
  @keyframes cvPulse{ 0%,100%{ opacity:.25; } 50%{ opacity:.8; } }
  /* boot stopped: the reason, stated on the cover where it can actually be seen */
  /* .cv-in is a centring flex COLUMN: max-width alone lets this shrink to

  .cv-fatal{ margin-top:22px; width:min(540px, 92vw); text-align:center;

    background:rgba(8,18,38,.82); border:1.5px solid rgba(234,184,4,.5);
    box-shadow:0 12px 30px rgba(0,0,0,.5); }
  .cv-fatal b{ display:block; font:900 17px/1.2 'Barlow Condensed','Arial Narrow',sans-serif;

  .cv-fatal span{ display:block; font:500 13px/1.5 'Barlow',system-ui,sans-serif;
    color:rgba(240,231,203,.82); }

    background:rgba(255,255,255,.1); border-radius:3px; padding:1px 5px; }
  .cv-fatal a{ display:inline-block; margin-top:12px; word-break:break-all;

    padding:9px 18px; border-radius:999px; text-decoration:none; }
  .cv-fatal a:hover{ filter:brightness(1.08); }
  .cv-stamp{ display:inline-flex; align-items:center; gap:6px; margin-top:16px;
    font:800 9.5px/1 'Barlow Condensed',sans-serif; letter-spacing:.18em; text-transform:uppercase;
    color:rgba(254,225,35,.75); }
  .cv-stamp svg{ width:15px; height:15px; }
  /* entrance choreography */
  @keyframes cvRise{ from{ opacity:0; transform:translateY(24px); } to{ opacity:1; transform:none; } }
  @keyframes cvFade{ from{ opacity:0; } to{ opacity:1; } }
  #warCover:not(.lift) .cv-logo{ animation:cvRise .7s var(--cve) .05s both; }
  #warCover:not(.lift) .cv-tour{ animation:cvFade .8s var(--cve) .2s both; }
  #warCover:not(.lift) .cv-series{ animation:cvRise .7s var(--cve) .34s both; }
  #warCover:not(.lift) .cv-title{ animation:cvRise .8s var(--cve) .42s both; }
  #warCover:not(.lift) .cv-sub{ animation:cvRise .7s var(--cve) .56s both; }
  #warCover:not(.lift) .cv-open{ animation:cvFade .7s var(--cve) .66s both; }
  #warCover:not(.lift) .cv-stamp{ animation:cvRise .7s var(--cve) .8s both; }
  /* ===== section mock-ups inside each window (real Oregon sections in code) ===== */
  .cv-mk{ position:absolute; inset:0; width:100%; height:100%; }
  .cv-slide:not(.on) .cv-mk, .cv-slide:not(.on) .cv-mk *{ animation-play-state:paused; }
  /* Scheme DNA — the real call sheet: printed header (O + title + keys) then section boxes */
  .cv-mk-sheet{ background:linear-gradient(165deg,#f6f1de,#eae1c8); display:flex; flex-direction:column; overflow:hidden; }
  .cvs-head{ display:flex; align-items:center; gap:8px; padding:9px 12px 8px; flex:0 0 auto;
    border-bottom:3px double rgba(11,22,42,.55); }
  .cvs-o{ height:20px; width:auto; }
  .cvs-title{ font:900 12px/1 'Barlow Condensed',sans-serif; letter-spacing:.04em; text-transform:uppercase; color:#0B162A; white-space:nowrap; }
  .cvs-keys{ margin-left:auto; display:flex; gap:9px; }
  .cvs-keys i{ font-style:normal; display:flex; align-items:center; gap:3px;
    font:900 6.5px/1 'Barlow Condensed',sans-serif; letter-spacing:.06em; text-transform:uppercase; color:#0B162A; white-space:nowrap; }
  .cvs-keys i::before{ content:'✓'; display:grid; place-items:center; width:9px; height:9px; border-radius:2px;
    border:1.5px solid rgba(11,22,42,.6); font-size:6px; color:#b8322c; }
  .cvs-body{ flex:1; display:flex; gap:9px; padding:10px 12px; min-height:0; }
  .cvs-sec{ flex:1 1 0; min-width:0; display:flex; flex-direction:column; gap:6px; padding:8px;
    border:1.5px solid color-mix(in srgb, var(--ink,#21683c) 55%, transparent); border-top:none; position:relative;
    background:color-mix(in srgb, var(--ink,#21683c) 4%, transparent); }
  .cvs-sec::before{ content:''; position:absolute; top:0; left:0; right:0; height:3px; background:var(--ink,#21683c); opacity:.85; }
  .cvs-lbl{ align-self:flex-start; margin:-8px 0 1px -8px; padding:3px 9px 4px; border-radius:0 0 3px 0;

  .cvs-note{ padding:6px 9px 7px; transform:rotate(var(--r,-1deg));
    background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,0) 30%),var(--s,#cfe6c4);
    box-shadow:0 2px 6px rgba(0,0,0,.22); opacity:0; animation:cvDeal 5.5s ease-in-out infinite; animation-delay:var(--d); }
  .cvs-note b{ display:block; font:900 9.5px/1.02 'Barlow Condensed',sans-serif; text-transform:uppercase;
    color:#232012; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cvs-note span{ font:800 6px/1 'Barlow Condensed',sans-serif; letter-spacing:.08em; text-transform:uppercase; color:rgba(35,32,18,.55); }
  @keyframes cvDeal{ 0%{ opacity:0; transform:rotate(var(--r,-1deg)) translateY(12px) scale(.9); }
    16%,86%{ opacity:1; transform:rotate(var(--r,-1deg)); } 100%{ opacity:0; transform:rotate(var(--r,-1deg)) translateY(12px) scale(.9); } }
  /* Personnel Breakdown — a pulled collector card + a few breakdown points beside it */
  .cv-mk-card{ background:radial-gradient(120% 100% at 72% 0%, #101b30, #04060c); display:flex;
    align-items:center; gap:13px; padding:11px 14px; }
  .cvc-card{ flex:0 0 auto; height:90%; width:auto; filter:drop-shadow(0 10px 20px rgba(0,0,0,.65));
    transform:rotate(-2deg); animation:cvCardIn 6s ease-in-out infinite; }
  @keyframes cvCardIn{ 0%{ opacity:0; transform:rotate(-2deg) translateY(12px) scale(.96); }

  .cvc-info{ flex:1; min-width:0; display:flex; flex-direction:column; gap:3px; }

  .cvc-name{ font:900 16px/1 'Barlow Condensed',sans-serif; letter-spacing:.02em; text-transform:uppercase; color:#f0ead0; margin-bottom:4px; }

    opacity:0; animation:cvPop 6s ease-in-out infinite; animation-delay:var(--d); }

  @keyframes cvDrawL{ 0%,4%{ stroke-dashoffset:150; } 44%,86%{ stroke-dashoffset:0; } 100%{ stroke-dashoffset:150; } }
  .cvdr-node{ position:absolute; transform:translate(-50%,-50%); padding:4px 8px; border-radius:5px;
    background:#f3ecd8; border:1.5px solid #0B162A; box-shadow:0 3px 7px rgba(0,0,0,.5);
    font:900 8px/1 'Barlow Condensed',sans-serif; letter-spacing:.02em; text-transform:uppercase; color:#0B162A;
    white-space:nowrap; opacity:0; animation:cvPop 5s ease-in-out infinite; animation-delay:var(--d); }
  .cvdr-node.br{ border-color:#C83803; color:#9c3202; }
  /* Full Offense — the bloodline map over the real backdrop, stadium cutouts by the pins */
  .cv-mk-map{ background:#0a101e; }
  .cv-mk-mapbg{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:.45; filter:brightness(.7); }
  .cv-mk-mapus{ position:absolute; inset:0; width:100%; height:100%; object-fit:contain; padding:6px; }

    background:var(--pc,var(--cvy)); box-shadow:0 0 0 0 var(--pc,var(--cvy)); animation:cvPin 2.6s ease-out infinite; animation-delay:var(--d); }
  @keyframes cvPin{ 0%{ box-shadow:0 0 0 0 rgba(254,225,35,.5); } 70%,100%{ box-shadow:0 0 0 15px rgba(254,225,35,0); } }
  /* Film Room — the play up on the board (chalk diagram) with the reads pinned around it */
  .cv-mk-film{ background:#070b16; padding:10px; }

<body>

<!-- ===== WAR COVER: landing + loading gate (shows over the streaming skyline
     video while the 3D world builds behind it) ===== -->
<section id="warCover">
  <video id="cv-vid" autoplay muted loop playsinline></video>
  <div id="cv-veil"></div>
  <div class="cv-in">
    <div class="cv-logo"><img src="Bears Assets/Bears Logo 1.webp" alt="Chicago Bears"></div>
    <div class="cv-tour" id="cvTour">
      <div class="cv-eyebrow">What's Inside &middot; flip through</div>
      <div class="cv-stage">
        <button class="cv-arrow prev" id="cvPrev" aria-label="Previous">&#8249;</button>
        <div class="cv-track" id="cvTrack"></div>
        <button class="cv-arrow next" id="cvNext" aria-label="Next">&#8250;</button>
      </div>
      <div class="cv-dots" id="cvDots"></div>
    </div>
    <div class="cv-series">Young Gun Offense Series</div>
    <h1 class="cv-title">The Bears Ben Johnson Offense</h1>
    <div class="cv-sub">Chicago Bears &middot; Madden 27</div>
    <button class="cv-open" id="cvOpen"><span class="cv-open-dot"></span><span class="cv-open-lbl">Open Playbook</span></button>
    <div class="cv-stamp" id="cvStamp"></div>
  </div>
</section>

<!-- ==========================================================================
     THE BOARD HOME. The front page is a cork board with the six section cards
     pinned to it, standing on the painted Soldier Field backdrop. No deck, no
     draw ceremony, no 3D - a card is a door, nothing more.
     ========================================================================== -->
<section id="bearsHome" aria-label="Bears Offense sections">
  <div id="bhBg"></div>
  <div id="bhVig"></div>
  <div class="bh-board">
    <img class="bh-face" src="Bears Assets/Bears Board.webp" alt="" draggable="false">
    <div id="bhCards"></div>
  </div>
  <div id="bhTools">
    <span class="bht-ttl">Edit Board</span>
    <button class="bht-btn" data-act="board-">Board &minus;</button>
    <button class="bht-btn" data-act="board+">Board +</button>
    <button class="bht-btn" data-act="cards-">Cards &minus;</button>
    <button class="bht-btn" data-act="cards+">Cards +</button>
    <button class="bht-btn" data-act="copy">Copy Layout</button>
    <button class="bht-btn" data-act="reset">Reset</button>
    <button class="bht-btn bht-done" data-act="done">Done</button>
    <span class="bht-hint">drag to move &middot; scroll on a card to size it &middot; saves on this device</span>
  </div>
</section>
<style id="bears-home-css">
  #bearsHome{ position:fixed; inset:0; z-index:6; display:none; }
  body.bhOn #bearsHome{ display:block; }
  /* the hud is the drive builder's hint bar now; off the board it only ever
     holds stale boot text ("Loading...") that sits on the Edit button */
  body.bhOn:not(.dbOn) #hud{ display:none; }
  body.dbOn #bearsHome, body.dbBuild #bearsHome{ display:none; }
  /* the painted stadium: overscanned so the parallax can never show an edge,
     drifting on its own so the page is never dead still */
  #bhBg{ position:absolute; inset:0; z-index:0;
    background:url("Bears Assets/Bears Stadium Background.jpg") center/cover no-repeat;
    translate:calc(var(--px,0) * -44px) calc(var(--py,0) * -28px);
    transform:scale(1.12);
    transition:translate .9s cubic-bezier(.2,.8,.3,1);
    animation:bhDrift 32s ease-in-out infinite; }
  @keyframes bhDrift{ 0%,100%{ transform:scale(1.12); } 50%{ transform:scale(1.16); } }

  /* THE ENTRANCE. Keyed to body.bhIntro, set the moment the cover lifts and
     dropped once the ceremony is done - so the board drops in in front of the
     viewer on the way in, but backing out of a section returns to a settled

  body.bhIntro .bh-board{ animation:bhBoardIn .62s cubic-bezier(.18,.9,.28,1.06) both; }

  .bh-card img{ display:block; width:100%; height:auto; pointer-events:none; }
  .bh-card::before{ content:''; position:absolute; left:50%; top:-7px; translate:-50% 0; z-index:2;
    width:6.5%; aspect-ratio:1; border-radius:50%;   /* % of the card, so it scales with the board */

    box-shadow:0 3px 5px rgba(0,0,0,.5); }

  .bh-card:active{ scale:.97; }
  @keyframes bhPinIn{ from{ opacity:0; translate:-50% calc(-50% - 26px); scale:1.05; }
    to{ opacity:1; translate:-50% -50%; scale:1; } }

     board falls away behind it, so the section arrives from somewhere instead

function buildBearsHome(){
  const holder = document.getElementById('bhCards');
  if(!holder) return;
  holder.innerHTML = '';
  BEARS_CARDS.forEach(c => {
    const b = document.createElement('button');
    b.className = 'bh-card';
    b.dataset.id = c.id;
    b.style.cssText = `left:${c.x}%; top:${c.y}%; --r:${c.r}deg; --d:${c.d}s`;
    b.innerHTML = `<img src="${encodeURI(c.art)}" alt="" draggable="false">`;
    b.addEventListener('click', () => {
      if(document.body.classList.contains('bhEdit')) return;
      if(document.getElementById('takeover')?.classList.contains('open')) return;
      if(document.body.classList.contains('bhDive')) return;   // mid-dive, ignore
      const go = () => { if(c.id === 'drive') dbGoBuild(); else openSection(c.id); };
      /* the dive: the card comes at the viewer, the board drops away, then the
         section lands. Skipped entirely for reduced motion. */
      if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){ go(); return; }
      b.classList.add('diving');
      document.body.classList.add('bhDive');
      setTimeout(() => {
        go();
        /* clear once the section is covering, so the board is settled on return */
        setTimeout(() => {
          document.body.classList.remove('bhDive');
          b.classList.remove('diving');
        }, 90);
      }, 300);
    });
    holder.appendChild(b);
  });
  bhApplyLayout();
  bhWireEdit();
  /* the parallax feed: the whole page reads --px/--py off the root */
  if(!window.__bhPointer){
    window.__bhPointer = true;
    window.addEventListener('pointermove', e => {
      document.documentElement.style.setProperty('--px', (e.clientX / innerWidth - 0.5).toFixed(3));
      document.documentElement.style.setProperty('--py', (e.clientY / innerHeight - 0.5).toFixed(3));
    }, { passive:true });
  }
}
/* ---- BOARD EDIT MODE ----------------------------------------------------
   The owner presses EDIT BOARD, drags cards around, sizes the board and the
   cards, and the layout sticks (localStorage, this browser only). COPY drops
   the layout JSON on the clipboard so the new default can be baked in. */
const BH_LAYOUT_KEY = 'bearsBoardLayout.v1';
const BH_DEFAULT = { scale:1.12, cardW:16.5 };    // the shipped layout's sizing
function bhLoadLayout(){
  try{ return JSON.parse(localStorage.getItem(BH_LAYOUT_KEY)) || {}; }
  catch(e){ return {}; }
}
function bhSaveLayout(){ try{ localStorage.setItem(BH_LAYOUT_KEY, JSON.stringify(bhLayout)); }catch(e){} }
let bhLayout = bhLoadLayout();
function bhApplyLayout(){
  const home = document.getElementById('bearsHome');
  if(!home) return;
  home.querySelector('.bh-board').style.setProperty('--bhScale', bhLayout.scale || BH_DEFAULT.scale);
  document.getElementById('bhCards').style.setProperty('--bhCardW', (bhLayout.cardW || BH_DEFAULT.cardW) + '%');
  document.querySelectorAll('#bhCards .bh-card').forEach(b => {
    const p = bhLayout.pos && bhLayout.pos[b.dataset.id];
    if(p && p.x != null){ b.style.left = p.x + '%'; b.style.top = p.y + '%'; }
    b.style.width = (p && p.w) ? p.w + '%' : '';
  });
}
function bhWireEdit(){
  const home = document.getElementById('bearsHome');
  const editBtn = document.getElementById('bhEdit');
  const tools = document.getElementById('bhTools');
  if(!home || !editBtn || !tools || editBtn.dataset.wired) return;
  editBtn.dataset.wired = '1';
  editBtn.addEventListener('click', () => document.body.classList.add('bhEdit'));
  tools.addEventListener('click', e => {
    const act = e.target.dataset && e.target.dataset.act;
    if(!act) return;
    if(act === 'done'){ document.body.classList.remove('bhEdit'); return; }
    if(act === 'reset'){
      bhLayout = {}; try{ localStorage.removeItem(BH_LAYOUT_KEY); }catch(err){}
      document.querySelectorAll('#bhCards .bh-card').forEach(b => {
        const c = BEARS_CARDS.find(k => k.id === b.dataset.id);
        if(c){ b.style.left = c.x + '%'; b.style.top = c.y + '%'; }
      });
      bhApplyLayout(); return;
    }
    if(act === 'copy'){
      const out = { scale: bhLayout.scale || BH_DEFAULT.scale, cardW: bhLayout.cardW || BH_DEFAULT.cardW, pos: {} };
      document.querySelectorAll('#bhCards .bh-card').forEach(b => {
        out.pos[b.dataset.id] = { x:+parseFloat(b.style.left).toFixed(1), y:+parseFloat(b.style.top).toFixed(1) };
        if(b.style.width) out.pos[b.dataset.id].w = +parseFloat(b.style.width).toFixed(1);
      });
      const txt = JSON.stringify(out);
      (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject())
        .then(()=>{ e.target.textContent = 'Copied'; setTimeout(()=>{ e.target.textContent = 'Copy Layout'; }, 1600); })
        .catch(()=>{ window.prompt('Copy the layout:', txt); });
      return;
    }
    const step = { 'board-':-.04, 'board+':.04, 'cards-':-.8, 'cards+':.8 }[act];
    if(step === undefined) return;
    if(act.startsWith('board')){
      bhLayout.scale = Math.min(1.35, Math.max(.55, +((bhLayout.scale || BH_DEFAULT.scale) + step).toFixed(2)));
    } else {
      bhLayout.cardW = Math.min(32, Math.max(7, +((bhLayout.cardW || BH_DEFAULT.cardW) + step).toFixed(1)));
    }
    bhSaveLayout(); bhApplyLayout();
  });
  /* drag a card: % of the live board box, clamped so a card can't fall off */
  let drag = null;
  home.addEventListener('pointerdown', e => {
    if(!document.body.classList.contains('bhEdit')) return;
    const card = e.target.closest('.bh-card');
    if(!card) return;
    e.preventDefault();
    drag = { card, moved:false, box: home.querySelector('.bh-board').getBoundingClientRect() };
    card.classList.add('dragging');
    card.setPointerCapture(e.pointerId);
  });
  home.addEventListener('pointermove', e => {
    if(!drag) return;
    const x = Math.min(98, Math.max(2, (e.clientX - drag.box.left) / drag.box.width * 100));
    const y = Math.min(97, Math.max(3, (e.clientY - drag.box.top) / drag.box.height * 100));
    drag.card.style.left = x.toFixed(1) + '%';
    drag.card.style.top = y.toFixed(1) + '%';
    drag.moved = true;
  });
  const bhDrop = e => {
    if(!drag) return;
    drag.card.classList.remove('dragging');
    if(drag.moved){
      bhLayout.pos = bhLayout.pos || {};
      bhLayout.pos[drag.card.dataset.id] = Object.assign(bhLayout.pos[drag.card.dataset.id] || {}, {
        x:+parseFloat(drag.card.style.left).toFixed(1),
        y:+parseFloat(drag.card.style.top).toFixed(1) });
      bhSaveLayout();
    }
    drag = null;
  };
  home.addEventListener('pointerup', bhDrop);
  home.addEventListener('pointercancel', bhDrop);
  /* scroll on a card = size THAT card alone (the toolbar sizes all six) */
  home.addEventListener('wheel', e => {
    if(!document.body.classList.contains('bhEdit')) return;
    const card = e.target.closest('.bh-card');
    if(!card) return;
    e.preventDefault();
    const cur = parseFloat(card.style.width) || (bhLayout.cardW || BH_DEFAULT.cardW);
    const w = Math.min(34, Math.max(6, +(cur + (e.deltaY < 0 ? 1 : -1)).toFixed(1)));
    card.style.width = w + '%';
    bhLayout.pos = bhLayout.pos || {};
    bhLayout.pos[card.dataset.id] = Object.assign(bhLayout.pos[card.dataset.id] || {}, { w });
    bhSaveLayout();
  }, { passive:false });
}

/* The Drive Builder's left panel = a skinny, read-only mirror of the Oregon
   call sheet the user builds in Scheme DNA (auto-saved to localStorage). Only
   the play calls carry over — formations, x-factor, constraint pairs, sticky
   tags and the tempo header are all dropped. The sheet lives in the sealed
   engine scope, so we read it through the ORPB.callSheet() bridge. */
/* The Drive Builder's left panel has three faces. 'normal' is what ships — the
   viewer's saved call sheet mirrored from Scheme DNA. 'empty' and 'video' are
   PRESENTER ONLY (toggled with the P key while in the Drive Builder): the blank
   intro template and the 8-play video install. Normal users only ever see
   'normal'; nothing here is persisted, so a reload starts clean. */
let dbCsMode = 'normal';                                  // 'normal' | 'empty' | 'video'
let dbVideoShown = 0, dbVideoCap = 7;                    // presenter 'video' reveal state
function dbRenderCallSheet(){
  const root = document.getElementById('dbInstall');
  if(!root) return;
  const cs = (window.ORPB && typeof window.ORPB.callSheet === 'function')
    ? window.ORPB.callSheet(dbCsMode) : { mode:'normal', total:0, cap:24, sections:[] };
  // dbCsMode is the source of truth. The bridge only supplies DATA for normal/empty
  // (the saved sheet); the 'video' sheet is self-contained here (DB_VIDEO_INSTALL),
  // so it must NOT depend on cs.mode - the bridge echoes 'normal' for video.
  const mode = dbCsMode;
  const O = encodeURI('Bears Assets/Bears Logo 1.webp');
  const SK = encodeURI('Assets/scheme kings logo.png');

  const head = mode === 'empty'
    ? `<div class="db-install-head">
         <div class="db-install-crest"><img src="${O}" alt=""></div>
         <div class="db-install-eyebrow">The Call Sheet</div>
         <div class="db-install-title">Build Your Own</div>
       </div>`
    : `<div class="db-install-head">
         <div class="db-install-crest"><img src="${O}" alt=""></div>
         <div class="db-install-eyebrow">${mode === 'video' ? "This Video's Install" : 'Your Game Plan'}</div>
         <div class="db-install-title">Bears Call Sheet</div>
       </div>`;

  const cta = mode === 'empty'
    ? `<div class="db-cs-cta">
         <img class="db-cs-cta-logo" src="${SK}" alt="Scheme Kings">
         <div class="db-cs-cta-txt"><b>Fill out your call sheet</b>
           <span>Unlock the full sheet on <b>Scheme Kings</b> and build your own, up to ${cs.cap} calls.</span></div>
       </div>` : '';

  /* VIDEO / INSTALL: the real call-sheet layout, but it only holds this
     video's 8 plays (one per heading), each HIDDEN until I click the sheet to
     reveal it (script order via data-vi). Every heading shows "+ N more" open
     slots so the viewer sees 8 of 25 filled and plenty of room to install. */
  if(mode === 'video'){
    dbVideoShown = 0; dbVideoCap = DB_INSTALL_CAP;
    const body = DB_INSTALL_SECTIONS.map(sec => {
      const mine = DB_VIDEO_INSTALL
        .map((v, i) => ({ v, i }))
        .filter(o => o.v.bucket === sec.label);
      const rows = mine.map(({ v, i }) => {
        const p = DB_PLAYS.find(x => x.id === v.id) || { name:v.id };
        return `<div class="db-cs-play db-cs-hide" data-vi="${i}">
          <span class="db-cs-dot${p.type === 'Star Play' ? ' star' : ''}"></span>
          <span class="db-cs-txt"><b>${p.name}</b>${p.formation ? `<i>${p.formation}</i>` : ''}</span>
        </div>`;
      }).join('');
      const remaining = Math.max(0, sec.cap - mine.length);
      const ghost = remaining > 0
        ? `<div class="db-cs-ghost">+ ${remaining} more ${sec.ghost}</div>` : '';
      return `<div class="db-cs-sec"><div class="db-cs-lbl">${sec.label}</div>${rows}${ghost}</div>`;
    }).join('');
    root.innerHTML = `${head}
      <div class="db-install-body db-cs-body">${body}</div>
      <div class="db-install-foot db-cs-foot">
        <span class="db-cs-foot-lbl">Installed</span>
        <span class="db-cs-foot-count" id="dbVidCount">0 / ${DB_INSTALL_CAP}</span>
      </div>`;
    const bodyElV = root.querySelector('.db-install-body');
    const moreV = document.createElement('div');
    moreV.className = 'db-cs-more'; moreV.textContent = '▾ Scroll';
    root.appendChild(moreV);
    const updV = () => { const room = bodyElV.scrollHeight - bodyElV.clientHeight;
      moreV.classList.toggle('hide', room < 8 || bodyElV.scrollTop >= room - 6); };
    bodyElV.addEventListener('scroll', updV, { passive:true });
    requestAnimationFrame(updV);
    return;
  }

  let vi = 0;
  const secHTML = cs.sections.map(sec => {
    if(mode === 'normal' && !sec.plays.length) return '';
    const filled = sec.plays.map(p => {
      const vid = mode === 'video';                       // presenter: start hidden, reveal on click
      return `<div class="db-cs-play${vid ? ' db-cs-hide' : ''}"${vid ? ` data-vi="${vi++}"` : ''}>
        <span class="db-cs-dot${p.star ? ' star' : ''}"></span>
        <span class="db-cs-txt"><b>${p.name}</b>${p.formation ? `<i>${p.formation}</i>` : ''}</span>
      </div>`;
    }).join('');
    let ghost = '';
    if(mode === 'empty'){
      ghost = `<div class="db-cs-ghost">Pick ${sec.cap} &middot; fill this in yourself</div>`;
    } else if(mode === 'video'){
      const left = sec.cap - sec.plays.length;
      if(left > 0) ghost = `<div class="db-cs-ghost">+ ${left} more &middot; fill out the rest</div>`;
    }
    return `<div class="db-cs-sec"><div class="db-cs-lbl">${sec.label}</div>${filled}${ghost}</div>`;
  }).join('');

  const bodyInner = mode === 'normal'
    ? (cs.total ? secHTML : `<div class="db-cs-empty">Build your call sheet in <b>Scheme DNA</b> and every call you pick lands here as the sheet you're calling from.</div>`)
    : cta + secHTML;

  const foot = mode === 'empty'
    ? `<span class="db-cs-foot-lbl">Your Sheet</span><span class="db-cs-foot-count">0 / ${cs.cap}</span>`
    : mode === 'video'
    ? `<span class="db-cs-foot-lbl">Installed</span><span class="db-cs-foot-count" id="dbVidCount">0 / ${cs.cap}</span>`
    : `<span class="db-cs-foot-lbl">On the Sheet</span><span class="db-cs-foot-count">${cs.total} ${cs.total === 1 ? 'Call' : 'Calls'}</span>`;

  root.innerHTML = `${head}
    <div class="db-install-body db-cs-body">${bodyInner}</div>
    <div class="db-install-foot db-cs-foot">${foot}</div>`;

  // clean scroll cue: an inked chevron that hides at the bottom / when nothing overflows
  const bodyEl = root.querySelector('.db-install-body');
  const more = document.createElement('div');
  more.className = 'db-cs-more'; more.textContent = '▾ Scroll';
  root.appendChild(more);
  const updMore = () => {
    const room = bodyEl.scrollHeight - bodyEl.clientHeight;
    more.classList.toggle('hide', room < 8 || bodyEl.scrollTop >= room - 6);
  };
  bodyEl.addEventListener('scroll', updMore, { passive:true });
  requestAnimationFrame(updMore);
}

/* presenter video sheet: the 8 calls start hidden and reveal one at a time,
   with a quick animation, each time I click the sheet (on camera). */
function dbVideoAdvance(){
  if(dbCsMode !== 'video') return;
  const root = document.getElementById('dbInstall');
  if(!root) return;
  const hidden = [...root.querySelectorAll('.db-cs-play.db-cs-hide')];
  if(!hidden.length) return;
  // reveal in script order (lowest data-vi first), wherever its heading sits
  const next = hidden.reduce((a, b) => (+a.dataset.vi <= +b.dataset.vi ? a : b));
  next.classList.remove('db-cs-hide');
  next.classList.add('db-cs-reveal');
  next.scrollIntoView({ block:'nearest', behavior:'smooth' });
  dbVideoShown++;
  const cnt = document.getElementById('dbVidCount');
  if(cnt) cnt.textContent = dbVideoShown + ' / ' + dbVideoCap;
}
