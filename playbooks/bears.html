/* ---- wiring ---- */
function wireGp7(){
  const rm = prefersReducedMotion();
  gpSheet = gpLoad();
  gpEnsurePlays();
  const root = inner.querySelector('#gpRoot');

  /* subtle cursor parallax on the big folders - the call-sheet buckets and the
     formation exhibit get a little depth as you move over the sheet. Re-queries
     each move so it works across the GAME PLAN <-> FORMATIONS view swap. */
  if(!rm){
    const stage = root.closest('.gp-stage') || root;
    let raf = 0, nx = 0, ny = 0;
    const apply = ()=>{ raf = 0;
      stage.querySelectorAll('.gp-sec').forEach((f, i)=>{ const d = 3 + (i % 4) * 1.4;
        f.style.translate = (nx * -d).toFixed(1) + 'px ' + (ny * -d).toFixed(1) + 'px'; });
      stage.querySelectorAll('.gpf-shot').forEach(f=>{
        f.style.translate = (nx * 7).toFixed(1) + 'px ' + (ny * 7).toFixed(1) + 'px'; });
      stage.querySelectorAll('.gpf-diagram').forEach(f=>{
        f.style.translate = (nx * -4).toFixed(1) + 'px ' + (ny * -4).toFixed(1) + 'px'; });
    };
    stage.addEventListener('pointermove', e=>{
      const r = stage.getBoundingClientRect();
      nx = ((e.clientX - r.left) / r.width - .5) * 2;
      ny = ((e.clientY - r.top) / r.height - .5) * 2;
      if(!raf) raf = requestAnimationFrame(apply);
    });
  }

  const render = ()=>{ root.innerHTML = gpViewHTML(); wirePlan(); };
  /* clean crossfade + drift when flicking between GAME PLAN and FORMATIONS */
  function switchMode(to){
    if(rm){ to === 'forms' ? showFormations() : render(); return; }
    root.classList.add('gp-fade');
    setTimeout(()=>{
      to === 'forms' ? showFormations() : render();
      root.classList.add('gp-fade');
      requestAnimationFrame(()=>requestAnimationFrame(()=>root.classList.remove('gp-fade')));
    }, 200);
  }

  const stamp = (secId)=>{
    const sec = root.querySelector(`.gp-sec[data-sec="${secId}"]`);
    if(!sec || rm) return;
    sec.classList.remove('gp-stamp'); void sec.offsetWidth; sec.classList.add('gp-stamp');
    const cards = Array.from(sec.querySelectorAll('.gp-sticky'));   // slap the new picks in
    cards.forEach((c, i)=>{ c.classList.add('gp-deal'); c.style.setProperty('--dl', i*55 + 'ms'); });
    requestAnimationFrame(()=>requestAnimationFrame(()=>cards.forEach(c=>c.classList.remove('gp-deal'))));
  };

  function openBuilder(secId){
    const sec = GP_SECTIONS.find(s=>s.id === secId);
    if(!sec) return;
    const pop = root.querySelector('#gpPop');
    pop.innerHTML = `<div class="gp-b-dim"></div><div class="gp-b-card">${gpBuilderHTML(sec)}</div>`;
    pop.classList.add('on');
    requestAnimationFrame(()=>requestAnimationFrame(()=>pop.classList.add('go')));
    const card = pop.querySelector('.gp-b-card');
    const count = pop.querySelector('#gpBCount');
    let picks;
    if(sec.kind === 'plays') picks = (gpSheet[sec.id] || []).slice();
    else if(sec.id === 'formations') picks = gpSheet.formations.slice();
    else if(sec.id === 'constraints') picks = gpSheet.constraints.slice();
    else picks = null; /* xfactor tracked separately */
    let xf = sec.id === 'xfactor' ? Object.assign({ player:null, play:null }, gpSheet.xFactor || {}) : null;
    const max = sec.id === 'constraints' ? 2 : sec.n;
    const syncCount = ()=>{
      if(sec.id === 'xfactor'){ count.textContent = (xf.player ? xf.player : 'pick the guy') + (xf.play ? ' + the call' : ''); return; }
      count.textContent = picks.length + ' / ' + max;
    };
    syncCount();
    card.querySelectorAll('.gp-opt').forEach(b=>b.addEventListener('click', ()=>{
      if(sec.id === 'xfactor'){
        if(b.dataset.player){ xf.player = b.dataset.player;
          card.querySelectorAll('[data-player]').forEach(x=>x.classList.toggle('on', x === b)); }
        else { xf.play = b.dataset.play2;
          card.querySelectorAll('[data-play2]').forEach(x=>x.classList.toggle('on', x === b)); }
        syncCount(); return;
      }
      const id = sec.id === 'formations' ? b.dataset.form
        : sec.id === 'constraints' ? +b.dataset.id : b.dataset.id;
      const at = picks.indexOf(id);
      if(at >= 0){ picks.splice(at, 1); b.classList.remove('on'); }
      else if(picks.length < max){ picks.push(id); b.classList.add('on'); }
      syncCount();
    }));
    /* BUILD YOUR OWN constraint pairs: custom pairs live in picks as objects
       (pre-made ones are numeric indexes); both count toward the max of 2. */
    if(sec.id === 'constraints'){
      const mine = card.querySelector('#gpConMine');
      const renderMine = ()=>{
        const customs = picks.filter(x=>typeof x !== 'number');
        mine.innerHTML = customs.map((c, k)=>{
          const b = gpPlay(c.base), o = gpPlay(c.off);
          return `<span class="gp-con-chip"><b>${b?b.name:c.base}</b> &#10132; <b>${o?o.name:c.off}</b>
            <button class="gp-con-rm" data-k="${k}" title="Remove">&times;</button></span>`;
        }).join('');
        mine.querySelectorAll('.gp-con-rm').forEach(rb=>rb.addEventListener('click', ()=>{
          const target = picks.filter(x=>typeof x !== 'number')[+rb.dataset.k];
          const at = picks.indexOf(target);
          if(at >= 0) picks.splice(at, 1);
          renderMine(); syncCount();
        }));
      };
      renderMine();
      const addBtn = card.querySelector('.gp-con-add');
      if(addBtn) addBtn.addEventListener('click', ()=>{
        const base = card.querySelector('[data-role="base"]').value;
        const off  = card.querySelector('[data-role="off"]').value;
        if(!base || !off || base === off || picks.length >= max) return;
        picks.push({ base, off, note:'your constraint pair', custom:true });
        card.querySelector('[data-role="base"]').value = '';
        card.querySelector('[data-role="off"]').value = '';
        renderMine(); syncCount();
      });
    }
    const close = ()=>{
      pop.classList.remove('go');
      setTimeout(()=>{ pop.classList.remove('on'); pop.innerHTML = ''; }, 240);
    };
    pop.querySelector('.gp-b-dim').addEventListener('click', close);
    pop.querySelector('.gp-b-x').addEventListener('click', close);
    pop.querySelector('#gpBOk').addEventListener('click', ()=>{
      if(sec.kind === 'plays') gpSheet[sec.id] = picks;
      else if(sec.id === 'formations') gpSheet.formations = picks;
      else if(sec.id === 'constraints') gpSheet.constraints = picks;
      else if(sec.id === 'xfactor') gpSheet.xFactor = (xf.player || xf.play) ? xf : null;
      gpSave(); close(); render(); stamp(sec.id);
    });
    pop._close = close;
  }

  /* sticky menu: look at the play, or pin up to 2 of its tags on the sticky */
  function openStickyMenu(btn){
    const id = btn.dataset.play, p = gpPlay(id);
    if(!p) return;
    const secEl = btn.closest('.gp-sec');
    const secId = secEl ? secEl.dataset.sec : null;
    const removable = secId && Array.isArray(gpSheet[secId]);
    root.querySelectorAll('.gp-smenu').forEach(x=>x.remove());
    const m = document.createElement('div');
    m.className = 'gp-smenu';
    let dirty = false;
    const away = (e)=>{ if(!m.contains(e.target)) closeMenu(); };
    const closeMenu = ()=>{
      document.removeEventListener('click', away, true);
      m.remove();
      if(dirty) render();
    };
    const tagsHTML = ()=>{
      const chosen = gpSheet.stickyTags[id] || [];
      return `<span class="gp-sm-cap">PIN UP TO 2 ON THE STICKY</span>
        <div class="gp-sm-list">${(p.tags || []).map(t=>
          `<button class="gp-sm-t${chosen.includes(t) ? ' on' : ''}" data-t="${t}">${tagLabel(t)}</button>`).join('')}
        </div>
        <button class="gp-sm-done">DONE</button>`;
    };
    const wire = ()=>{
      const look = m.querySelector('.gp-sm-look');
      if(look) look.addEventListener('click', ()=>{ closeMenu(); openPlay(id); });
      const rm2 = m.querySelector('.gp-sm-rm');
      if(rm2) rm2.addEventListener('click', ()=>{
        gpSheet[secId] = (gpSheet[secId] || []).filter(x=>x !== id);
        gpSave(); dirty = true; closeMenu();
      });
      const tg = m.querySelector('.gp-sm-tags');
      if(tg) tg.addEventListener('click', ()=>{ m.innerHTML = tagsHTML(); wire(); });
      m.querySelectorAll('.gp-sm-t').forEach(b2=>b2.addEventListener('click', ()=>{
        const t = b2.dataset.t;
        const cur = (gpSheet.stickyTags[id] || []).slice();
        const at = cur.indexOf(t);
        if(at >= 0) cur.splice(at, 1);
        else if(cur.length < 2) cur.push(t);
        else return;
        gpSheet.stickyTags[id] = cur;
        gpSave(); dirty = true;
        b2.classList.toggle('on', cur.includes(t));
      }));
      const done = m.querySelector('.gp-sm-done');
      if(done) done.addEventListener('click', closeMenu);
    };
    m.innerHTML = `<b class="gp-sm-nm">${p.name}</b>
      <button class="gp-sm-look">LOOK AT THE PLAY &#9656;</button>
      <button class="gp-sm-tags">TAGS &#9656;</button>
      ${removable ? `<button class="gp-sm-rm">TAKE IT OFF THE SHEET</button>` : ''}`;
    const wr = root.getBoundingClientRect(), r = btn.getBoundingClientRect();
    m.style.left = Math.max(8, Math.min(r.left - wr.left, wr.width - 260)) + 'px';
    m.style.top = Math.min(r.bottom - wr.top + 6, wr.height - 240) + 'px';
    root.appendChild(m);
    requestAnimationFrame(()=>requestAnimationFrame(()=>m.classList.add('in')));
    wire();
    setTimeout(()=>document.addEventListener('click', away, true), 0);
  }

  function explain(secId, anchor){
    const info = GP.headerInfo[secId];
    if(!info) return;
    root.querySelectorAll('.gp-explain').forEach(e=>e.remove());
    const tip = document.createElement('div');
    tip.className = 'gp-explain';
    tip.textContent = info;
    anchor.parentElement.appendChild(tip);
    requestAnimationFrame(()=>requestAnimationFrame(()=>tip.classList.add('in')));
    setTimeout(()=>{ if(tip.isConnected) tip.remove(); }, 5200);
  }

  function useRecommended(cascade){
    const R = GP.recommended;
    const steps = [
      { id:'xfactor', fn:()=>{ gpSheet.xFactor = Object.assign({}, R.xFactor); } },
      ...GP_SECTIONS.filter(s=>s.kind === 'plays').map(s=>
        ({ id:s.id, fn:()=>{ gpSheet[s.id] = (R[s.id] || []).slice(); } })),
      { id:'constraints', fn:()=>{ gpSheet.constraints = R.constraints.slice(); } },
    ];
    if(rm || !cascade){ steps.forEach(s=>s.fn()); gpSave(); render(); return; }
    let i = 0;
    const tick = ()=>{
      if(i >= steps.length){ gpSave(); return; }
      const s = steps[i++]; s.fn(); gpSave(); render(); stamp(s.id);
      setTimeout(tick, 260);
    };
    tick();
  }

  /* THE FORMATIONS TAB: same paper language as the call sheet. A formation
     ticker on the tray, the big screenshot (placeholder for now) + the
     diagram, marker points and the calls as stickies on the paper. */
  let gpfIdx = 0;
  const gpfPlays = f=>(f.tags || []).map(nm=>WB_PLAYS.find(p=>p.name === nm)).filter(Boolean);
  function gpfSheetHTML(){
    const f = WB_FORMATIONS[gpfIdx];
    const plays2 = gpfPlays(f);
    const shot = GP.formationShots[f.name] || GP.formationShot;
    const rot = i=>(((i*37) % 5) - 2)*0.9;
    return `<div class="gp-sheet gpf-sheet">
        <div class="gp-ph">
          <img class="gp-ph-o" src="${assetUrl('Bears Assets/Bears Logo 1.webp')}" alt="">
          <b class="gp-ph-t">${f.name}</b>
          <span class="gpf-count">${plays2.length} CALLS</span>
          <span class="gp-sweep" aria-hidden="true"></span>
        </div>
        <div class="gpf-body">
          <div class="gpf-shot"><img src="${assetUrl(shot)}" alt="${f.name}"></div>
          <div class="gpf-side">
            <div class="gpf-diagram"><img src="${assetUrl(f.img)}" alt=""></div>
            <div class="gpf-desc"><p>${f.desc || ''}</p></div>
            <div class="gpf-points">${(f.bullets || []).slice(0, 3).map(bt=>
              `<div class="gpf-pt"><i>&#10003;</i><span>${bt}</span></div>`).join('')}</div>
            <div class="gpf-callab">THE CALLS THAT LIVE HERE</div>
            <div class="gpf-calls">${plays2.map((p, i)=>{
              const tg = (gpSheet.stickyTags || {})[p.id] || [];
              return `<button class="gp-sticky gpf-call${p.type === 'Star Play' ? ' gp-st-star' : ''}"
                  data-play="${p.id}" style="--r:${rot(i)}deg">
                 <b>${gpCrown(p)}${p.name}</b>
                 ${tg.length ? `<span class="gp-tags">${tg.map(t=>`<i>${tagLabel(t)}</i>`).join('')}</span>` : ''}
               </button>`; }).join('')}</div>
          </div>
        </div>
      </div>`;
  }
  function gpFormHTML(){
    const tickets = WB_FORMATIONS.map((ff, i)=>
      `<button class="gp-tik gpf-tik${i === gpfIdx ? ' on' : ''}" data-fi="${i}"
          style="--r:${((i%3) - 1)*0.9}deg">
         <span class="gp-tik-tape"></span>
         <b>${ff.name}</b><span>${gpfPlays(ff).length} CALLS</span>
       </button>`).join('');
    return `
      <div class="gp-motes" aria-hidden="true"></div>
      <div class="gp-stage" id="gpStage">${gpfSheetHTML()}</div>
      <div class="gp-rail gpf-rail">${gpKnobs('forms')}<div class="gp-rail-tik">${tickets}</div></div>
      <div class="gp-pop" id="gpPop"></div>`;
  }
  function wireFormCalls(){
    root.querySelectorAll('.gpf-call').forEach(b=>
      b.addEventListener('click', ()=>openPlay(b.dataset.play)));
  }
  function wireForm(){
    root.querySelectorAll('.gpf-tik').forEach(b=>b.addEventListener('click', ()=>swapFormation(+b.dataset.fi)));
    root.querySelectorAll('.gp-knob').forEach(b=>b.addEventListener('click', ()=>{
      if(b.dataset.tab === 'plan') switchMode('plan');
    }));
    wireFormCalls();
  }
  /* the page-pull: current sheet lifts off, the next look rises out of the tray */
  function swapFormation(next, dir){
    if(next === gpfIdx) return;
    const stage = root.querySelector('#gpStage');
    if(!stage || rm){ gpfIdx = next; showFormations(); return; }
    const d = dir != null ? dir : (next > gpfIdx ? 1 : -1);
    const cur = stage.querySelector('.gpf-sheet');
    gpfIdx = next;
    root.querySelectorAll('.gpf-tik').forEach(b=>b.classList.toggle('on', +b.dataset.fi === next));
    cur.classList.add(d > 0 ? 'gpf-out-up' : 'gpf-out-dn');
    const incoming = document.createElement('div');
    incoming.innerHTML = gpfSheetHTML();
    const nsheet = incoming.firstElementChild;
    nsheet.classList.add(d > 0 ? 'gpf-in-up' : 'gpf-in-dn');
    stage.appendChild(nsheet);
    requestAnimationFrame(()=>requestAnimationFrame(()=>nsheet.classList.add('go')));
    setTimeout(()=>{ if(cur.isConnected) cur.remove();
      nsheet.classList.remove('gpf-in-up','gpf-in-dn','go');
      wireFormCalls(); }, 460);
  }
  function showFormations(){
    root.innerHTML = gpFormHTML();
    wireForm();
  }

  function wirePlan(){
    root.querySelectorAll('.gp-tik[data-sec], .gp-add').forEach(b=>
      b.addEventListener('click', ()=>openBuilder(b.dataset.sec)));
    root.querySelectorAll('.gp-sec-h').forEach(b=>
      b.addEventListener('click', ()=>explain(b.dataset.sec, b)));
    root.querySelectorAll('.gp-sticky[data-play]').forEach(b=>
      b.addEventListener('click', (e)=>{ e.stopPropagation(); openStickyMenu(b); }));
    root.querySelectorAll('.gp-con-p[data-play]').forEach(b=>
      b.addEventListener('click', (e)=>{ e.stopPropagation(); openPlay(b.dataset.play); }));
    root.querySelectorAll('.gp-st-form').forEach(b=>
      b.addEventListener('click', ()=>showFormations()));
    const reco = root.querySelector('#gpReco');
    if(reco) reco.addEventListener('click', ()=>useRecommended(true));
    const saveTik = root.querySelector('#gpSaveTik');
    if(saveTik) saveTik.addEventListener('click', async ()=>{
      gpSave();                                     // local cache first (always keeps a draft)
      const sub = saveTik.querySelector('span:last-child');
      const orig = sub ? sub.textContent : '';
      const flash = (txt)=>{ saveTik.classList.add('saved'); if(sub) sub.textContent = txt;
        setTimeout(()=>{ saveTik.classList.remove('saved'); if(sub) sub.textContent = orig; }, 2200); };
      // push to the member's coaching app (Supabase `saved_sheets`); pops the sign-in
      // modal on first save. Cancelling leaves the ticket alone (still cached locally).
      const res = await saveSheetRemote();
      if(res.ok){ flash('Saved to your app ✓'); try{ skToast('Call sheet saved to your app'); }catch(e){} }
      else if(res.reason === 'cancelled'){ /* not signed in / dismissed - local draft kept */ }
      else { flash('Saved on this device'); }   // signed-out or table missing: at least the draft
    });
    const clear = root.querySelector('#gpClear');
    if(clear) clear.addEventListener('click', ()=>{ gpSheet = gpBlankSheet(); gpSave(); dealSheet(); });
    root.querySelectorAll('.gp-knob').forEach(b=>b.addEventListener('click', ()=>{
      if(b.dataset.tab === 'forms') switchMode('forms');
    }));
  }
  /* deal every sticky currently on the sheet with a staggered slap-in */
  function dealSheet(fromReco){
    render();
    if(rm) return;
    const cards = Array.from(root.querySelectorAll('.gp-sheet .gp-sticky'));
    cards.forEach((c, i)=>{
      c.classList.add('gp-deal');
      c.style.setProperty('--dl', (fromReco ? i*45 : i*30) + 'ms');
    });
    requestAnimationFrame(()=>requestAnimationFrame(()=>
      cards.forEach(c=>c.classList.remove('gp-deal'))));
  }
  wirePlan();
  /* entrance beat: the paper drops in, tickets rise, stickies deal */
  if(!rm){
    const stage = root.querySelector('#gpStage');
    if(stage){ stage.classList.add('gp-enter');
      requestAnimationFrame(()=>requestAnimationFrame(()=>stage.classList.remove('gp-enter'))); }
    const cards = Array.from(root.querySelectorAll('.gp-sheet .gp-sticky'));
    cards.forEach((c, i)=>{ c.classList.add('gp-deal'); c.style.setProperty('--dl', 220 + i*28 + 'ms'); });
    requestAnimationFrame(()=>requestAnimationFrame(()=>cards.forEach(c=>c.classList.remove('gp-deal'))));
  }

  /* presenter: each Space/Right builds the NEXT unbuilt section from the
     recommended picks (the creator narrates the sheet into existence). */
  const order = ['xfactor',
    ...GP_SECTIONS.filter(s=>s.kind === 'plays').map(s=>s.id), 'constraints'];
  const buildNext = ()=>{
    const R = GP.recommended;
    for(const id of order){
      const sec = GP_SECTIONS.find(s=>s.id === id);
      if(gpBuilt(sec)) continue;
      if(id === 'xfactor') gpSheet.xFactor = Object.assign({}, R.xFactor);
      else if(id === 'constraints') gpSheet.constraints = R.constraints.slice();
      else gpSheet[id] = (R[id] || []).slice();
      gpSave(); render(); stamp(id);
      return;
    }
  };
  const onGpKey = (e)=>{
    if(!inner.querySelector('.gp-wrap') || !takeover.classList.contains('open')){
      document.removeEventListener('keydown', onGpKey, true);
      return;
    }
    const pop = root.querySelector('#gpPop');
    if(e.key === 'Escape' && pop && pop.classList.contains('on')){
      e.preventDefault(); e.stopPropagation();
      if(pop._close) pop._close();
      return;
    }
    if(e.key !== ' ' && e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
    if(pop && pop.classList.contains('on')) return;      // let the popup be
    if(root.querySelector('.gpf-sheet')){                 // formations tab: walk the looks
      e.preventDefault(); e.stopPropagation();
      const dir = e.key === 'ArrowLeft' ? -1 : 1;
      swapFormation((gpfIdx + dir + WB_FORMATIONS.length) % WB_FORMATIONS.length, dir);
      return;
    }
    if(e.key === 'ArrowLeft') return;
    if(!root.querySelector('.gp-sheet')) return;
    e.preventDefault(); e.stopPropagation();
    buildNext();
  };
  document.addEventListener('keydown', onGpKey, true);
}

function wireYg(){
  const wrap = document.querySelector('#takeover .yg-wrap');
  if(!wrap) return;
  const slides = [...wrap.querySelectorAll('.yg-slide')];
  const tabs = [...wrap.querySelectorAll('.yg-tab')];
  const count = wrap.querySelector('.yg-count');
  const N = slides.length;
  const rm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const DATA = [...YG_TEAMS, YG_BOOK];
  let idx = -1, busy = false;

  /* the whole 1600x780 spread scales as ONE object, so the player, the
     panels and the rail hold the same relationship on every screen */
  const ygFit = () => {
    if(!wrap.isConnected){ removeEventListener('resize', ygFit); return; }
    wrap.style.setProperty('--ygs',
      Math.min((innerWidth - 30) / 1600, (innerHeight - 160) / 780).toFixed(4));
  };
  addEventListener('resize', ygFit);
  ygFit();

  /* the count-up: eased, comma-formatted, ~1s */
  function runCount(el){
    const target = +el.dataset.n;
    if(rm){ el.textContent = target.toLocaleString('en-US'); return; }
    const t0 = performance.now(), dur = 1050;
    const tick = (now) => {
      if(!el.isConnected) return;
      const p = Math.min(1, (now - t0) / dur);
      const e = 1 - Math.pow(1 - p, 3);
      el.textContent = Math.round(target * e).toLocaleString('en-US');
      if(p < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }
  function activate(s){
    s.classList.add('live');
    s.querySelectorAll('.yg-num[data-n]').forEach(runCount);
  }
  function deactivate(s){
    s.classList.remove('live');
    s.querySelectorAll('.yg-num[data-n]').forEach(el => { el.textContent = '0'; });
  }

  function go(n, dir){
    n = ((n % N) + N) % N;
    if(n === idx || busy) return;
    busy = true; setTimeout(() => { busy = false; }, 560);
    const d = dir != null ? dir : (n > idx ? 1 : -1);
    const oldS = idx > -1 ? slides[idx] : null;
    const newS = slides[n];
    idx = n;
    if(oldS){
      oldS.classList.remove('on', 'in-l', 'in-r');
      oldS.classList.add(d > 0 ? 'out-l' : 'out-r');
      /* reset AFTER the exit animation, while the slide is invisible */
      setTimeout(() => { oldS.classList.remove('out-l', 'out-r'); deactivate(oldS); }, 440);
    }
    newS.classList.remove('out-l', 'out-r');
    newS.classList.add('on', d > 0 ? 'in-r' : 'in-l');
    setTimeout(() => newS.classList.remove('in-r', 'in-l'), 600);
    setTimeout(() => { if(idx === n) activate(newS); }, rm ? 0 : 230);
    const t = DATA[n];
    wrap.style.setProperty('--acc', t.acc);
    wrap.style.setProperty('--deep', t.deep);
    tabs.forEach((b, bi) => b.classList.toggle('on', bi === n));
    if(count) count.textContent = `0${n + 1} / 0${N}`;
  }

  tabs.forEach(b => b.addEventListener('click', () => go(+b.dataset.i)));
  wrap.querySelector('.yg-arrow.prev').addEventListener('click', () => go(idx - 1, -1));
  wrap.querySelector('.yg-arrow.next').addEventListener('click', () => go(idx + 1, 1));

  /* scroll = page (desktop only; phones scroll the slide itself) */
  let wAcc = 0, wCool = 0;
  wrap.addEventListener('wheel', (e) => {
    if(window.innerWidth <= 768) return;
    e.preventDefault();
    const now = performance.now();
    if(now < wCool) return;
    wAcc += e.deltaY + e.deltaX;
    if(Math.abs(wAcc) > 90){
      go(idx + (wAcc > 0 ? 1 : -1), wAcc > 0 ? 1 : -1);
      wAcc = 0; wCool = now + 750;
    }
  }, { passive:false });

  /* swipe = page (a mostly-horizontal drag, so phone scrolling stays free) */
  let sx = 0, sy = 0, swiping = false;
  wrap.addEventListener('pointerdown', (e) => { sx = e.clientX; sy = e.clientY; swiping = true; }, { passive:true });
  wrap.addEventListener('pointerup', (e) => {
    if(!swiping) return; swiping = false;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if(Math.abs(dx) > 58 && Math.abs(dx) > Math.abs(dy) * 1.5) go(idx + (dx < 0 ? 1 : -1), dx < 0 ? 1 : -1);
  }, { passive:true });

  /* arrow keys page too; Escape stays with the engine's BACK */
  const onKey = (e) => {
    if(!wrap.isConnected){ document.removeEventListener('keydown', onKey, true); return; }
    if(e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
    e.preventDefault(); e.stopPropagation();
    go(idx + (e.key === 'ArrowRight' ? 1 : -1), e.key === 'ArrowRight' ? 1 : -1);
  };
  document.addEventListener('keydown', onKey, true);

  go(0, 1);
}

  const root = inner.querySelector('.fr-card');

  const reels = [...root.querySelectorAll('.fr-reel')];

     then the room pushes in and the breakdown lands */
  let pushing = false;
  reels.forEach(r => r.addEventListener('click', () => {
    if(pushing) return;
    pushing = true;
    const id = r.dataset.play;
    const play = PLAYS.find(x => x.id === id);
    if(rm){ openPlay(id); return; }
    if(play && play.heroShot) tvShot.src = assetUrl(play.heroShot);
    const fbs = parseFloat(getComputedStyle(root).getPropertyValue('--fbs')) || 1;
    const rr = r.getBoundingClientRect(), sr = tvScreen.getBoundingClientRect();
    r.style.setProperty('--fx', (((sr.left + sr.width / 2) - (rr.left + rr.width / 2)) / fbs).toFixed(0) + 'px');

      presenting = !presenting;

      if(presenting){ dealt = 0; reels.forEach(r => r.classList.remove('in')); }

      e.preventDefault(); e.stopPropagation();
      reels[dealt].style.setProperty('--d', '0s');
      reels[dealt].classList.add('in');
      dealt++;
    }
  };
  document.addEventListener('keydown', onKey, true);
}

    if(e.key === 'p' || e.key === 'P'){
      presenting = !presenting;
      pres.classList.toggle('on', presenting);
      shown = 0;
      rows.forEach((_, i) => unpin(i));

    if(presenting && e.key === 'ArrowRight' && shown < rows.length){
      e.preventDefault(); e.stopPropagation();
      pin(shown); shown++;
    }
  };
  document.addEventListener('keydown', onKey, true);

  if(rm) room.classList.remove('fb-land');

  const sub = meta.sub || "Play Category";
  const title = meta.title || type;

  if(!plays.length){
    openTakeover(`
      <div class="card section-card list-card">
        <button class="card-close" title="Close (Esc)">&times;</button>
        <div class="sc-eyebrow eyebrow">${sub}</div>
        <h2 class="display sc-title">${title}</h2>
        <div class="sc-divider"></div>
        <div class="overlay-list"><div class="empty">No plays in this category yet.</div></div>
      </div>`, "right");
    inner.querySelector(".card-close").addEventListener("click", closeTakeover);
    return;
  }

  // FILM ROOM v1: the picker is the film room now (see ORPB-FILM-JS).
  // The cat-web below is parked dormant.
  openFilmRoom(type, plays, { sub, title });
  return;
}

// REST headers for the Supabase sync (anon key; owner-gated client-side). This was
// missing after the audit, so every sbHeaders() call threw and the sync silently
// died - which is why a new scheme never appeared in the coaching app's lists.
function sbHeaders(extra = {}) {
  return {
    'apikey': SCHEME_CONFIG.supabaseAnonKey,
    'Authorization': `Bearer ${SCHEME_CONFIG.supabaseAnonKey}`,
    'Content-Type': 'application/json',
    ...extra,
  };
}

async function syncPlaybookToSupabase() {
  const { schemeKey, supabaseUrl, supabaseAnonKey } = SCHEME_CONFIG;
  if (!schemeKey || !supabaseUrl || !supabaseAnonKey) return;

  try {
    // 1. Upsert playbook row
    await fetch(`${supabaseUrl}/rest/v1/playbooks`, {
      method: 'POST',
      headers: sbHeaders({ 'Prefer': 'resolution=merge-duplicates' }),
      body: JSON.stringify({
        scheme_key:      schemeKey,
        name:            SCHEME_CONFIG.schemeName,
        subtitle:        SCHEME_CONFIG.schemeSubtitle || '',
        series_label:    SCHEME_CONFIG.seriesLabel || '',
        primary_color:   SCHEME_CONFIG.primaryColor,
        secondary_color: SCHEME_CONFIG.secondaryColor,
        tagline:         SCHEME_CONFIG.tagline || '',
        tagline_sub:     SCHEME_CONFIG.taglineSub || '',
        asset_base_url:  SCHEME_CONFIG.assetBaseUrl || '',
        youtube_url:     SCHEME_CONFIG.youtubeUrl || '',
        published_at:    new Date().toISOString(),
      }),
    });

    // 2. Replace all plays — delete stale rows first, then insert fresh.
    // This ensures the DB always matches exactly what's in the PLAYS array,
    // so duplicating this file for a new scheme never leaves ghost plays behind.
    await fetch(`${supabaseUrl}/rest/v1/plays?scheme_key=eq.${encodeURIComponent(schemeKey)}`, {
      method: 'DELETE',
      headers: sbHeaders(),
    });

    const playsPayload = PLAYS.map(p => ({
      play_key:     p.id,
      scheme_key:   schemeKey,
      name:         p.name,
      type:         p.type || '',
      subtype:      p.subtype || '',
      formation:    p.formation || '',
      tags:         p.tags || [],
      reads:        p.reads || [],
      adjustments:  p.adjustments || [],
      when_to_use:  p.whenToUse || '',
      setup:        p.setup || '',
      exclusive:    p.exclusive || false,
      images:       p.images || {},
      video_url:    p.videoUrl || '',
    }));

    await fetch(`${supabaseUrl}/rest/v1/plays`, {
      method: 'POST',
      headers: sbHeaders(),
      body: JSON.stringify(playsPayload),
    });
  } catch (e) {
    // Silent fail - sync is background, never blocks the UI
  }
}

/* ==========================================================================
   SK_AUTH - shared sign-in bridge to the coaching app
   --------------------------------------------------------------------------
   The playbook is FREE TO BROWSE. There is NO login wall: anonymous visitors
   (and YouTube viewers) see everything exactly as before. We only need to know
   WHO is signed in so future "save" actions (Save Drive, Save Play to library,
   etc.) can attach to their account and show up in the coaching app.

   Same Supabase project + default session storage as the coaching app, so on a
   shared origin the member is ALREADY signed in here - no second login. On a
   separate origin, skRequireLogin() prompts once (see stub below).
   ========================================================================== */
const SK_AUTH = {
  client: null,   // supabase-js client (only created if the CDN lib loaded)
  user:   null,   // the auth user, or null while browsing anonymously
  get memberId(){ return this.user ? this.user.id : null; },
  get signedIn(){ return !!this.user; },
};

async function initAuth(){
  // supabase-js is a CDN script; if it didn't load, degrade silently to
  // anonymous browsing - the playbook still works 100%.
  if (typeof supabase === 'undefined' || !supabase.createClient) return;
  const { supabaseUrl, supabaseAnonKey } = SCHEME_CONFIG;
  if (!supabaseUrl || !supabaseAnonKey) return;
  try {
    // Default storage + same project ref = the very session the coaching app
    // wrote, so a same-origin member is already signed in here.
    SK_AUTH.client = supabase.createClient(supabaseUrl, supabaseAnonKey);
    const { data:{ session } } = await SK_AUTH.client.auth.getSession();
    SK_AUTH.user = session ? session.user : null;
    loadSavedPlays();   // hydrate the member's bookmarks (no-op while anonymous)
    // Stay in sync if they sign in/out in the coaching-app tab next door.
    SK_AUTH.client.auth.onAuthStateChange((_evt, sess) => {
      SK_AUTH.user = sess ? sess.user : null;
      loadSavedPlays();
      maybeOwnerSync();   // owner may sign in AFTER load (via the save modal) - sync then too
    });
  } catch (e) { /* never let an auth hiccup break the playbook */ }
}

/* --------------------------------------------------------------------------
   SAVED PLAYS - the member's bookmarked play_keys for THIS scheme.
   Loaded once we know who's signed in; keeps every bookmark button in sync.
   -------------------------------------------------------------------------- */
const SK_SAVED = new Set();   // play_keys this member has bookmarked (this scheme)

async function loadSavedPlays(){
  SK_SAVED.clear();
  if (!SK_AUTH.signedIn || !SK_AUTH.client) { refreshBookmarkButtons(); return; }
  try {
    const { data, error } = await SK_AUTH.client
      .from('saved_plays').select('play_key')
      .eq('scheme_key', SCHEME_CONFIG.schemeKey);
    if (error) throw error;
    (data || []).forEach(r => SK_SAVED.add(r.play_key));
  } catch (e) { /* keep browsing; bookmarks just show empty */ }
  refreshBookmarkButtons();
}

// Repaint any bookmark buttons currently on screen to match SK_SAVED.
function refreshBookmarkButtons(){
  document.querySelectorAll('[data-bookmark]').forEach(b =>
    setBookmarkState(b, SK_SAVED.has(b.dataset.bookmark)));
}

// Attach bookmark behavior to every [data-bookmark] inside `scope` for play `p`.
function wireBookmark(scope, p){
  scope.querySelectorAll('[data-bookmark]').forEach(b => {
    setBookmarkState(b, SK_SAVED.has(p.id));
    b.addEventListener('click', e => { e.stopPropagation(); toggleSavePlay(p, b); });

// Toggle a play in/out of the member's library (sign-in prompt on first save).
let skSaving = false;
async function toggleSavePlay(p, btn){
  if (skSaving) return;
  const ok = await skRequireLogin('save plays to your library');
  if (!ok) return;
  skSaving = true;
  if (btn) btn.classList.add('busy');
  const wasSaved = SK_SAVED.has(p.id);
  try {
    if (wasSaved) {
      const { error } = await SK_AUTH.client.from('saved_plays').delete()
        .eq('member_id', SK_AUTH.memberId)
        .eq('scheme_key', SCHEME_CONFIG.schemeKey)
        .eq('play_key', p.id);
      if (error) throw error;
      SK_SAVED.delete(p.id);
      skToast('Removed from your library');
    } else {
      const { error } = await SK_AUTH.client.from('saved_plays')
        .upsert({ member_id: SK_AUTH.memberId, scheme_key: SCHEME_CONFIG.schemeKey, play_key: p.id },
                { onConflict: 'member_id,scheme_key,play_key' });
      if (error) throw error;
      SK_SAVED.add(p.id);
      skToast('Saved to your coaching app');
    }
    refreshBookmarkButtons();   // every copy of this play's button on screen
  } catch (e) {
    skToast('Could not reach your library - try again');
  } finally {
    skSaving = false;
    if (btn) btn.classList.remove('busy');
  }
}

/* --------------------------------------------------------------------------
   skRequireLogin(reason) - friendly contextual sign-in (NOT a browse wall).
   Resolves true the moment the member is signed in; otherwise pops the
   varsity-patch sign-in modal wired to signInWithPassword. The member types
   their OWN email/password (same as the coaching app); we never store it.
     returns - Promise<boolean> (true = signed in, ok to proceed).
   -------------------------------------------------------------------------- */
let skLoginResolve = null;
function skRequireLogin(reason = 'save this'){
  if (SK_AUTH.signedIn) return Promise.resolve(true);
  if (!SK_AUTH.client) { skToast('Sign-in is unavailable right now'); return Promise.resolve(false); }
  skInjectAuthCSS();
  return new Promise(resolve => { skLoginResolve = resolve; skOpenLoginModal(reason); });
}

function skSettleLogin(ok){
  const r = skLoginResolve; skLoginResolve = null;
  if (r) r(ok);
}

function skOpenLoginModal(reason){
  document.getElementById('sk-login')?.remove();
  const wrap = document.createElement('div');
  wrap.id = 'sk-login';
  wrap.innerHTML = `
    <div class="sk-login-backdrop"></div>
    <div class="sk-login-card" role="dialog" aria-modal="true" aria-label="Sign in">
      <button class="sk-login-x" type="button" aria-label="Close">&times;</button>
      <div class="sk-login-emblem">${typeof CROWN !== 'undefined' ? CROWN : '★'}</div>
      <div class="sk-login-eyebrow">Scheme Kings</div>
      <h3 class="sk-login-title">Sign in to ${reason}</h3>
      <p class="sk-login-sub">It saves straight to your coaching app, so your plays and drives stay in sync across the playbook and the app.</p>
      <form class="sk-login-form" autocomplete="on">
        <input class="sk-login-input" type="email" name="email" placeholder="Email" autocomplete="email" required>
        <input class="sk-login-input" type="password" name="password" placeholder="Password" autocomplete="current-password" required>
        <div class="sk-login-err" role="alert"></div>
        <button class="sk-login-go" type="submit">Sign In &amp; Save</button>
      </form>
      <p class="sk-login-foot">Same email &amp; password as your Scheme Kings coaching app.</p>
    </div>`;
  document.body.appendChild(wrap);
  void wrap.offsetWidth;            // force reflow so the opacity:0 start registers
  wrap.classList.add('open');      // then transition in (no deferred callback needed)

  const close = (ok) => {
    wrap.classList.remove('open');
    setTimeout(() => wrap.remove(), 220);
    document.removeEventListener('keydown', onEsc);
    skSettleLogin(!!ok);
  };
  const onEsc = (e) => { if (e.key === 'Escape') close(false); };
  document.addEventListener('keydown', onEsc);
  wrap.querySelector('.sk-login-x').addEventListener('click', () => close(false));
  wrap.querySelector('.sk-login-backdrop').addEventListener('click', () => close(false));

  const form = wrap.querySelector('.sk-login-form');
  const err  = wrap.querySelector('.sk-login-err');
  const go   = wrap.querySelector('.sk-login-go');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    err.textContent = '';
    const email = form.email.value.trim();
    const password = form.password.value;
    if (!email || !password) { err.textContent = 'Enter your email and password.'; return; }
    go.disabled = true; go.textContent = 'Signing in…';
    try {
      const { data, error } = await SK_AUTH.client.auth.signInWithPassword({ email, password });
      if (error) throw error;
      SK_AUTH.user = data.user;
      await loadSavedPlays();
      close(true);
    } catch (ex) {
      err.textContent = (ex && /invalid/i.test(ex.message || ''))
        ? 'That email or password didn’t match. Try again.'
        : 'Could not sign in right now. Please try again.';
      go.disabled = false; go.textContent = 'Sign In & Save';
    }
  });
  setTimeout(() => wrap.querySelector('.sk-login-input')?.focus(), 80);
}

      const sections = playSecs.map(sec => {
        const ids = (sheet && sheet[sec.id]) || [];
        const plays = ids.map(id => PLAYS.find(p => p.id === id)).filter(Boolean).map(wrap);
        total += plays.length;
        return { id:sec.id, label:sec.label, cap:sec.n, plays };
      }).filter(s => s.plays.length);
      return { mode:'normal', total, cap:24, sections };
    }catch(e){ return { mode:'normal', total:0, cap:24, sections:[] }; }
  },
  /* Is a member signed in right now? (lets the outer Drive Builder show the
     right label — "Save Drive" vs "Sign in & Save"). */
  signedIn(){ try{ return !!(SK_AUTH && SK_AUTH.signedIn); }catch(e){ return false; } },
  /* Save a built drive to the member's profile (Supabase `saved_drives`), the
     SAME table + auth the coaching app reads. The field Drive Builder lives in
     the OUTER war-room scope and can't touch SK_AUTH / SCHEME_CONFIG directly,
     so it hands the snapshot here. Prompts the shared sign-in modal on first
     save (free to browse, gated only on the write). Resolves a result object;
     never throws, so the caller can just update its button.
       snapshot - { main:[ ...nodes ] } drive tree (JSON-serializable)
       meta.title  - saved-drive title; meta.reason - sign-in modal copy
     returns Promise<{ ok, reason?, title?, message? }>. */
  async saveDrive(snapshot, meta){
    meta = meta || {};
    try{
      const ok = await skRequireLogin(meta.reason || 'save this drive');
      if(!ok) return { ok:false, reason:'cancelled' };
      const title = meta.title || `Drive · ${new Date().toLocaleDateString()}`;
      const { error } = await SK_AUTH.client.from('saved_drives')
        .insert({ member_id: SK_AUTH.memberId, scheme_key: SCHEME_CONFIG.schemeKey, title, data: snapshot });
      if(error) throw error;
      skToast('Drive saved to your coaching app');
      return { ok:true, title };
    }catch(e){
      skToast('Could not save the drive. Try again');
      return { ok:false, reason:'error', message: e && e.message };
    }
  }
};


// ---- FULLSCREEN TOGGLE ----
// iPhone Safari has NO fullscreen API for the page (video only), and inside an
// iframe without allowfullscreen the call rejects even on Android/desktop. So:
// native API (with webkit prefixes) when it works, otherwise "faux" fullscreen —
// a class on <html> plus a postMessage the parent page can use to expand the
// embed iframe to the whole viewport.
(function(){
  const doc = document, root = doc.documentElement;
  let fauxFS = false;
  const nativeEl = () => doc.fullscreenElement || doc.webkitFullscreenElement || null;
  const fsActive = () => !!nativeEl() || fauxFS;
  function fsSync(){ doc.dispatchEvent(new CustomEvent('wr-fs-change')); }
  function setFaux(on){
    fauxFS = on;
    root.classList.toggle('faux-fs', on);
    try{
      if(window.parent !== window)
        window.parent.postMessage({ skFullscreen: on }, '*');
    }catch(e){}
    fsSync();
  }
  function toggleFS(){
    if(fsActive()){
      if(nativeEl()){
        if(doc.exitFullscreen) doc.exitFullscreen().catch(()=>{});
        else if(doc.webkitExitFullscreen) doc.webkitExitFullscreen();
      }
      if(fauxFS) setFaux(false);
      return;
    }
    const req = root.requestFullscreen || root.webkitRequestFullscreen;
    const enabled = 'fullscreenEnabled' in doc ? doc.fullscreenEnabled : doc.webkitFullscreenEnabled;
    if(req && enabled !== false){
      try{
        const p = req.call(root);
        if(p && p.catch) p.catch(()=>setFaux(true));   // e.g. iframe denied it
      }catch(e){ setFaux(true); }
      /* Some browsers, iPhone Safari worst of all, accept the call, hand back
         no promise and then never go fullscreen. Nothing rejects, so nothing
         tells us it failed and the page we sit in never hears that it should
         expand the frame. Check the result rather than trust the call. */
      setTimeout(function(){ if(!nativeEl() && !fauxFS) setFaux(true); }, 260);
    } else {
      setFaux(true);                                    // iPhone Safari path
    }
  }
  window.WR_FS = { toggle: toggleFS, active: fsActive };
  doc.addEventListener('fullscreenchange', fsSync);
  doc.addEventListener('webkitfullscreenchange', fsSync);

  // The button markup is defined AFTER this script, so wire it once the DOM is
  // ready (otherwise getElementById returns null and the listener never attaches).
  const wire = () => {
    const btn = document.getElementById('fs-btn');
    if (!btn) return;
    btn.addEventListener('click', toggleFS);
    doc.addEventListener('wr-fs-change', () => {
      btn.classList.toggle('is-fullscreen', fsActive());
    });
  };
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', wire);
  } else {
    wire();
  }
})();

})();
</script>
<script id="orpb-nav">
(function(){
  document.getElementById("orpbBack").addEventListener("click", function(e){
    e.stopPropagation();
    if(window.ORPB) window.ORPB.closeTakeover();
  });
  var fsb = document.getElementById("fsBtn");
  fsb.addEventListener("click", function(e){
    e.stopPropagation();
    if(window.WR_FS) window.WR_FS.toggle();
  });
  document.addEventListener("wr-fs-change", function(){
    var on = !!(window.WR_FS && window.WR_FS.active());
    fsb.classList.toggle("is-fs", on);
    fsb.classList.toggle("is-fullscreen", on);
  });
})();
</script>
